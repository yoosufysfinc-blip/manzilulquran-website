<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Records · ManzilulQuran Admin</title>
<link rel="icon" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --emerald-deepest:#031b13;
    --emerald-deep:#0a3d2e;
    --emerald:#125c44;
    --emerald-light:#1a7a5a;
    --gold:#c9a961;
    --gold-light:#e4c987;
    --gold-warm:#ffb86b;
    --cream:#faf6ee;
    --cream-dim:rgba(250,246,238,0.7);
    --cream-faint:rgba(250,246,238,0.4);
    --ink:#0e1a14;
    --err:#ff9999;
    --accent:#2dd4a4;   /* swapped per tab at runtime */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(ellipse at top,var(--emerald-deep) 0%,var(--emerald-deepest) 65%,#000 100%);
    color:var(--cream);min-height:100vh;padding:36px 20px 60px;
  }

  /* ---------- Lock ---------- */
  .lock-screen{
    max-width:420px;width:100%;background:#fff;color:var(--ink);
    border-radius:22px;padding:44px 32px 36px;
    box-shadow:0 30px 80px rgba(0,0,0,0.4);text-align:center;
    animation:riseIn .35s ease;margin:80px auto 0;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .lock-logo{width:80px;height:80px;border-radius:50%;border:3px solid var(--emerald-light);margin:0 auto 22px;overflow:hidden;background:#fff}
  .lock-logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  .lock-title{font-size:22px;font-weight:800;color:var(--emerald);margin-bottom:6px}
  .lock-sub{font-size:13.5px;color:#5B6B63;font-weight:500;margin-bottom:24px}
  .lock-input{
    width:100%;font-family:'Manrope',sans-serif;font-size:16px;font-weight:600;color:var(--ink);
    border:2px solid var(--emerald-light);border-radius:12px;padding:14px 16px;
    text-align:center;letter-spacing:4px;
  }
  .lock-input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(27,122,90,.15)}
  .lock-input.wrong{border-color:#c0392b;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .lock-btn{
    width:100%;margin-top:16px;font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;
    color:#fff;background:var(--emerald);border:none;border-radius:12px;padding:14px;cursor:pointer;
  }
  .lock-btn:hover{background:var(--emerald-light)}
  .lock-error{color:#c0392b;font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px}
  .lock-hint{margin-top:22px;padding-top:20px;border-top:1px solid #E8F3EE;font-size:11.5px;color:#5B6B63}
  .lock-hint a{color:var(--emerald-light);text-decoration:none;font-weight:600}

  /* ---------- Shell ---------- */
  .admin{display:none;max-width:1100px;margin:0 auto}
  .admin.show{display:block;animation:riseIn .35s ease}

  .crumb{
    display:inline-flex;align-items:center;gap:7px;
    color:var(--cream-dim);text-decoration:none;
    font-size:11.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    margin-bottom:18px;transition:color .2s;
  }
  .crumb:hover{color:var(--gold-light)}
  .crumb svg{width:13px;height:13px}

  .admin-head{
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
    margin-bottom:22px;
  }
  .admin-head-left{display:flex;align-items:center;gap:16px}
  .admin-logo{width:56px;height:56px;border-radius:50%;border:2px solid rgba(201,169,110,0.5);overflow:hidden;background:#fff;flex:0 0 auto}
  .admin-logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  .admin-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--cream);line-height:1.1}
  .admin-title .accent{color:var(--gold-light);font-style:italic;font-weight:500}
  .admin-sub{font-size:12px;color:var(--cream-dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
  .admin-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn-ghost{
    font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    color:rgba(255,255,255,0.75);background:transparent;border:1px solid rgba(255,255,255,0.2);
    border-radius:100px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-ghost:hover{background:rgba(255,255,255,0.08)}
  .btn-ghost svg{width:12px;height:12px}

  /* ---------- Tabs: each record type owns a colour ---------- */
  .tabs{
    display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;
    padding-bottom:20px;border-bottom:1px solid rgba(201,169,110,0.18);
  }
  .tab{
    font-family:'Manrope',sans-serif;
    font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--cream-dim);
    background:rgba(3,27,19,0.5);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:100px;padding:10px 17px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:all .2s;
  }
  .tab .dot{
    width:7px;height:7px;border-radius:50%;flex:0 0 auto;
    background:var(--c);
  }
  .tab:hover{color:var(--cream);border-color:color-mix(in srgb, var(--c) 45%, transparent)}
  .tab.on{
    color:var(--emerald-deepest);
    background:var(--c);
    border-color:transparent;
    box-shadow:0 6px 20px -8px var(--c);
  }
  .tab.on .dot{background:rgba(0,0,0,0.45)}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
  .stat{
    background:rgba(3,27,19,0.5);
    border:1px solid rgba(255,255,255,0.07);
    border-left:2px solid var(--accent);
    border-radius:0 13px 13px 0;padding:15px 17px;
  }
  .stat-label{font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);opacity:.9;margin-bottom:6px}
  .stat-value{font-family:'Cormorant Garamond',serif;font-size:29px;font-weight:600;color:var(--cream);line-height:1}
  .stat-value .mini{font-size:19px;letter-spacing:2px;color:var(--accent)}

  /* ---------- List ---------- */
  .list-wrap{
    background:rgba(3,27,19,0.5);
    border:1px solid rgba(255,255,255,0.07);
    border-top:2px solid var(--accent);
    border-radius:14px;overflow:hidden;
  }
  .list-search{
    padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.07);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .list-search svg{width:18px;height:18px;color:var(--accent);flex:0 0 auto}
  .list-search input{
    flex:1;min-width:150px;font-family:'Manrope',sans-serif;font-size:14px;
    color:var(--cream);background:transparent;border:none;outline:none;
  }
  .list-search input::placeholder{color:rgba(250,246,238,0.35)}
  #resultCount{font-size:12px;color:var(--accent);font-weight:700;white-space:nowrap}

  .list-table{width:100%;border-collapse:collapse}
  .list-table thead th{
    text-align:left;padding:13px 20px;
    font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
    color:var(--accent);opacity:.9;
    background:rgba(0,0,0,0.22);border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .list-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:background .18s}
  .list-table tbody tr:hover{background:color-mix(in srgb, var(--accent) 7%, transparent)}
  .list-table tbody tr:last-child{border-bottom:none}
  .list-table td{padding:13px 20px;font-size:14px;color:var(--cream);vertical-align:middle}
  .list-table td.date{color:var(--cream-faint);font-size:12.5px}
  .list-table td.rating{color:var(--accent);letter-spacing:2px;font-size:16px}
  .list-table td.actions{text-align:right;white-space:nowrap}
  .list-table td.actions button{
    background:transparent;border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    color:var(--accent);
    padding:5px 12px;border-radius:100px;cursor:pointer;
    font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    margin-left:6px;font-family:'Manrope',sans-serif;transition:all .2s;
  }
  .list-table td.actions button:hover{background:var(--accent);color:var(--emerald-deepest)}

  .loading{text-align:center;padding:60px 20px;color:var(--cream-dim);font-size:14px}
  .loading-spin{
    display:inline-block;width:26px;height:26px;
    border:3px solid rgba(255,255,255,0.12);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:60px 20px;color:var(--cream-dim);font-size:14px;line-height:1.7}
  .empty-state svg{width:42px;height:42px;color:var(--accent);opacity:.28;margin-bottom:14px}

  /* ---------- Detail modal ---------- */
  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);
    backdrop-filter:blur(6px);z-index:100;
    align-items:flex-start;justify-content:center;padding:30px 20px;overflow-y:auto;
  }
  .modal-backdrop.show{display:flex;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;color:var(--ink);max-width:760px;width:100%;
    border-radius:18px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,0.5);
    animation:modalIn .35s cubic-bezier(.2,.9,.3,1.1) both;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

  .detail{padding:36px 38px 30px}
  .detail-head{text-align:center;padding-bottom:22px;border-bottom:2px solid var(--accent);margin-bottom:24px}
  .detail-logo{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;overflow:hidden;border:2px solid var(--accent);background:#fff}
  .detail-logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
  .detail-eyebrow{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#8a7a4e;margin-bottom:6px}
  .detail-h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:var(--emerald)}
  .detail-h1 .hl{font-style:italic;font-weight:500;color:#8a7a4e}
  .detail-sub{font-size:12px;color:#666;margin-top:6px}

  .detail-meta{background:#faf6ee;border-left:3px solid var(--accent);padding:14px 18px;margin-bottom:24px;font-size:13px}
  .detail-meta-row{display:flex;justify-content:space-between;padding:4px 0;gap:14px}
  .detail-meta-row b{color:var(--emerald);font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .detail-meta-row span{color:var(--ink);font-weight:600;text-align:right}

  .detail-row{
    display:flex;gap:14px;padding:11px 14px;margin-bottom:8px;
    background:#faf6ee;border:1px solid #ecdcaf;border-radius:8px;
    font-size:13.5px;page-break-inside:avoid;break-inside:avoid;
  }
  .detail-row b{color:var(--emerald);font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase;flex:0 0 150px;padding-top:2px}
  .detail-row span{color:#333;font-weight:500;flex:1;word-break:break-word}
  .detail-row a{color:var(--emerald-light);font-weight:700}

  /* evaluation-only: every option shown, the chosen one lit up */
  .detail-q{margin-bottom:18px;page-break-inside:avoid;break-inside:avoid}
  .detail-q-title{
    font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;
    color:var(--emerald);margin-bottom:10px;display:flex;align-items:baseline;gap:8px;
  }
  .detail-q-num{
    display:inline-block;background:var(--accent);color:#fff;
    font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;
    padding:2px 8px;border-radius:100px;letter-spacing:1px;
  }
  .detail-options{display:flex;flex-direction:column;gap:6px;margin-left:14px}
  .detail-option{
    display:flex;align-items:center;gap:12px;padding:8px 12px;
    background:#faf6ee;border:1px solid #e6e0ee;border-radius:8px;
    font-size:13.5px;color:#333;
  }
  .detail-option.picked{
    background:color-mix(in srgb, var(--accent) 14%, #fff);
    border-color:var(--accent);
    color:var(--emerald);font-weight:700;
    box-shadow:0 0 0 1px var(--accent);
  }
  .detail-radio{width:16px;height:16px;border-radius:50%;border:2px solid #c3bcd0;flex:0 0 auto}
  .detail-option.picked .detail-radio{
    border-color:var(--accent);
    background:radial-gradient(circle,var(--accent) 0%,var(--accent) 40%,transparent 45%);
  }
  .picked-tag{
    margin-left:auto;font-size:10px;font-weight:800;color:var(--accent);
    letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap;
  }
  .detail-stars{color:var(--accent);font-size:26px;letter-spacing:4px;margin-left:14px;display:flex;align-items:center;gap:12px}
  .detail-stars-num{font-family:'Manrope',sans-serif;font-size:13px;font-weight:800;color:var(--emerald);letter-spacing:0}
  .detail-free{
    margin-left:14px;background:#faf6ee;border:1px solid #ecdcaf;border-radius:8px;
    padding:12px 14px;font-size:13.5px;color:#333;line-height:1.6;font-style:italic;min-height:40px;
  }

  .detail-arabic{text-align:center;font-family:'Amiri',serif;font-size:20px;color:#8a7a4e;margin:24px 0 10px}
  .detail-foot{text-align:center;padding-top:14px;border-top:1px solid #ddd;font-size:11px;color:#666;margin-top:8px}

  .modal-actions{
    background:#faf6ee;padding:16px 28px;display:flex;justify-content:flex-end;gap:10px;
    border-top:1px solid #ecdcaf;
  }
  .btn-solid{
    font-family:'Manrope',sans-serif;font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    background:var(--emerald);color:#fff;border:none;border-radius:100px;padding:11px 22px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn-solid:hover{background:var(--emerald-light)}
  .btn-solid svg{width:12px;height:12px}
  .btn-outline{
    font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    background:transparent;color:var(--emerald);border:1.5px solid var(--emerald);
    border-radius:100px;padding:10px 22px;cursor:pointer;
  }
  .btn-outline:hover{background:var(--emerald);color:#fff}

  @media (max-width:700px){
    .admin-title{font-size:22px}
    .detail{padding:26px 22px 22px}
    .detail-h1{font-size:21px}
    .detail-row b{flex:0 0 110px}

    /* rows become cards */
    .list-table thead{display:none}
    .list-table,.list-table tbody,.list-table tr,.list-table td{display:block;width:100%}
    .list-table tr{
      border:1px solid rgba(255,255,255,0.09);border-radius:12px;
      margin:12px 14px;padding:14px 16px;background:rgba(3,27,19,0.45);width:auto;
    }
    .list-table td{
      padding:6px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;
    }
    .list-table td::before{
      content:attr(data-label);
      font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
      color:var(--accent);flex:0 0 auto;
    }
    .list-table td.actions{
      justify-content:flex-end;padding-top:12px;margin-top:8px;
      border-top:1px solid rgba(255,255,255,0.08);
    }
    .list-table td.actions::before{content:none}
    .list-table td.actions button{flex:1;margin-left:0;margin-right:6px;padding:9px 12px}
    .list-table td.actions button:last-child{margin-right:0}
  }

  /* ---- Progress report detail + editor ---- */
  .pr-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;margin-bottom:18px}
  .pr-meta div{background:rgba(255,255,255,.03);padding:9px 12px}
  .pr-meta .k{font-size:9px;letter-spacing:.9px;text-transform:uppercase;opacity:.6}
  .pr-meta .v{font-size:13px;font-weight:500;word-break:break-word}
  .pr-att{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:14px 16px}
  .pr-ring{width:78px;height:78px;position:relative;flex-shrink:0}
  .pr-ring svg{transform:rotate(-90deg)}
  .pr-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700}
  .pr-am{flex:1;min-width:160px;display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
  .pr-am .k{font-size:9px;letter-spacing:.9px;text-transform:uppercase;opacity:.6}
  .pr-am .v{font-size:15px;font-weight:600}
  .pr-rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .pr-rate{border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 12px;
    background:rgba(255,255,255,.03)}
  .pr-rt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .pr-rl{font-size:12px;font-weight:500}
  .pr-pill{font-size:9.5px;font-weight:700;color:#fff;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pr-meter{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
  .pr-meter i{display:block;height:100%;border-radius:99px}
  .pr-cmt{font-size:11px;opacity:.7;font-style:italic;margin-top:5px}
  .pr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .pr-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--accent);
    padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500}
  .pr-chip .st{font-size:9px;opacity:.6;font-weight:400}
  .pr-chip button{background:none;border:none;color:inherit;opacity:.6;cursor:pointer;
    font-size:15px;line-height:1;padding:0 2px}
  .pr-chip button:hover{opacity:1;color:#ff9999}
  .pr-sec{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--accent);margin:20px 0 10px}
  .pr-pending{font-size:11px;color:#ffb86b}

  .pr-edit label{display:block;font-size:11px;letter-spacing:.4px;opacity:.65;margin-bottom:5px}
  .pr-edit input,.pr-edit select,.pr-edit textarea{width:100%;padding:9px 12px;
    background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:9px;
    color:inherit;font-family:inherit;font-size:13px}
  .pr-edit input:focus,.pr-edit select:focus,.pr-edit textarea:focus{outline:none;border-color:var(--accent)}
  .pr-edit input[readonly]{background:rgba(0,0,0,.14);color:var(--accent);font-weight:600}
  .pr-edit textarea{resize:vertical;min-height:60px;line-height:1.6}
  .pr-edit option{background:#12291f;color:#faf6ee}
  .pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .pr-full{grid-column:1/-1}
  .pr-add{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
  .pr-add>div{flex:1;min-width:110px}
  .pr-add button{padding:9px 16px;border-radius:9px;border:none;cursor:pointer;
    background:var(--accent);color:#22180a;font-family:inherit;font-weight:600;font-size:12.5px}
  @media(max-width:640px){
    .pr-meta{grid-template-columns:1fr 1fr}
    .pr-rates,.pr-grid{grid-template-columns:1fr}
  }

  @media print{
    body{background:#fff;color:#000;padding:0}
    .pr-edit,.pr-chip button{display:none !important}
    .pr-meta div,.pr-att,.pr-rate{background:#faf6ee !important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pr-meter{background:#ddd !important}
    .admin,.modal-backdrop{position:static;background:#fff;display:block !important}
    .modal-actions,.list-wrap,.admin-head,.tabs,.stats,.crumb,.lock-screen{display:none !important}
    .pr-meta .k,.pr-am .k,.pr-cmt{opacity:1;color:#4a5a54}
    .modal-backdrop{background:#fff;padding:0;overflow:visible}
    .modal{box-shadow:none;max-width:100%;border-radius:0;animation:none}
    .detail{padding:20px 30px}
    .detail-row,.detail-meta,.detail-option,.detail-free{
      background:#faf6ee !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .detail-option.picked{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>

<script>
/* =================================================================
   ░░  RECORDS  ░░
   Every submission the academy receives, in one place.

   Three different backends sit behind this page — the four forms live in
   the main spreadsheet, evaluations live in their own, and progress
   reports in a third. The tabs hide that: you just pick a record type
   and it loads.

   Progress reports are the only tab that WRITES back (attendance and
   corrections are added here, never on the teacher's form), so they are
   also the only tab with an Edit button.
   ================================================================= */

const SCRIPT_MASTER = "https://script.google.com/macros/s/AKfycbzhCGlnBG6LthyJW3b-o1qERqvKY3ULuvOyCik6469tpHsRL9bJ2pJgqw6Rnkf9S84pYg/exec";
const SCRIPT_EVAL   = "https://script.google.com/macros/s/AKfycbzSEfI9CEPSMmQLdPP_oWiT0f61jCfQBl5uNIlU9EXxNuVpIH4Y7PLBKJDgGg70O2YKqA/exec";
const SCRIPT_PROGRESS = "https://script.google.com/macros/s/AKfycbxl0MeNhyGm7QuVFaX86LGXd58c9FsrIi53xbenYttQ_CV-XNpUh8OBqOsZYEi33wPN/exec";

const PORTAL_PASSWORD = "manzil2026";
const ADMIN_API_PASSWORD = "manzil2026admin";
const SESSION_KEY = "mq_portal_unlocked_at";
const SESSION_MAX_MS = 24 * 60 * 60 * 1000;

const $ = (id) => document.getElementById(id);

/* Each record type carries the same colour it has on the Forms page, so a
   form and its submissions read as one thing. */
const TABS = [
  { key:'student',    label:'Registrations', accent:'#2dd4a4', api:'master',
    title:'Student Registration', listCols:['Timestamp','First Name','Phone','Course'] },
  { key:'batch',      label:'Batch',         accent:'#5eead4', api:'master',
    title:'Batch Registration',   listCols:['Timestamp','First Name','Phone','Course'] },
  { key:'teacher',    label:'Staff',         accent:'#e4c987', api:'master',
    title:'Staff Application',    listCols:['Timestamp','First Name','Phone','Post'] },
  { key:'complaint',  label:'Complaints',    accent:'#ff9aa6', api:'master',
    title:'Complaint',            listCols:['Timestamp','Student Name','Phone','Complaint Type'] },
  { key:'evaluation', label:'Evaluations',   accent:'#a78bfa', api:'eval',
    title:'Class Evaluation',     listCols:[] },
  { key:'progress',   label:'Progress Reports', accent:'#ffb86b', api:'progress',
    title:'Student Progress Report', listCols:[] }
];

/* Rating vocabulary used by the progress report form. Kept here so the
   detail view can colour a rating and the editor can offer the same four
   options. Changing the form's RATINGS means changing this too. */
const PR_RATINGS = ['Excellent','Very Good','Good','Developing'];
const PR_COLOR = { 'Excellent':'#2dd4a4','Very Good':'#5eead4','Good':'#e4c987','Developing':'#ffb86b' };
const PR_PCT   = { 'Excellent':100,'Very Good':78,'Good':56,'Developing':34 };
const PR_SURAHS = ["Al-Fatihah","Al-Baqarah","Aal-e-Imran","An-Nisa","Al-Ma'idah","Al-An'am","Al-A'raf","Al-Anfal","At-Tawbah","Yunus","Hud","Yusuf","Ar-Ra'd","Ibrahim","Al-Hijr","An-Nahl","Al-Isra","Al-Kahf","Maryam","Ta-Ha","Al-Anbiya","Al-Hajj","Al-Mu'minun","An-Nur","Al-Furqan","Ash-Shu'ara","An-Naml","Al-Qasas","Al-Ankabut","Ar-Rum","Luqman","As-Sajdah","Al-Ahzab","Saba","Fatir","Ya-Sin","As-Saffat","Sad","Az-Zumar","Ghafir","Fussilat","Ash-Shura","Az-Zukhruf","Ad-Dukhan","Al-Jathiyah","Al-Ahqaf","Muhammad","Al-Fath","Al-Hujurat","Qaf","Adh-Dhariyat","At-Tur","An-Najm","Al-Qamar","Ar-Rahman","Al-Waqi'ah","Al-Hadid","Al-Mujadila","Al-Hashr","Al-Mumtahanah","As-Saff","Al-Jumu'ah","Al-Munafiqun","At-Taghabun","At-Talaq","At-Tahrim","Al-Mulk","Al-Qalam","Al-Haqqah","Al-Ma'arij","Nuh","Al-Jinn","Al-Muzzammil","Al-Muddaththir","Al-Qiyamah","Al-Insan","Al-Mursalat","An-Naba","An-Nazi'at","Abasa","At-Takwir","Al-Infitar","Al-Mutaffifin","Al-Inshiqaq","Al-Buruj","At-Tariq","Al-A'la","Al-Ghashiyah","Al-Fajr","Al-Balad","Ash-Shams","Al-Layl","Ad-Duha","Ash-Sharh","At-Tin","Al-Alaq","Al-Qadr","Al-Bayyinah","Az-Zalzalah","Al-Adiyat","Al-Qari'ah","At-Takathur","Al-Asr","Al-Humazah","Al-Fil","Quraysh","Al-Ma'un","Al-Kawthar","Al-Kafirun","An-Nasr","Al-Masad","Al-Ikhlas","Al-Falaq","An-Nas"];

/* The evaluation form's questions, with every option it offered. Needed so
   the report can show what was NOT picked as well as what was — a lone
   answer with no alternatives beside it tells you very little. */
const QUESTIONS = [
  { key:'satisfaction', label:'Overall satisfaction with learning experience',
    options:['Very satisfied','Satisfied','Neutral','Dissatisfied','Very dissatisfied'] },
  { key:'progress', label:'Rating of learning progress',
    options:['Excellent progress','Good progress','Average progress','Slow progress','No noticeable progress'] },
  { key:'teacherFit', label:'Is the mentor suitable?',
    options:['Yes, perfectly suited','Yes, but could be better','Neutral / not sure','We would like to try another teacher'] },
  { key:'punctuality', label:'Does the teacher attend on time?',
    options:['Always on time','Sometimes late','Frequently late','Often misses classes'] },
  { key:'recommend', label:'Would you recommend ManzilulQuran Academy?',
    options:['Definitely','Probably','Not sure','No'] }
];

let current = TABS[0];
let headers = [];      // forms: column names
let rows = [];         // forms: arrays  |  evaluations: objects
let detail = null;
let prFull = null;    // full progress report (master + answers + surahs)
let prDraft = null;   // editable copy while the Edit pane is open

/* ---------------- Lock ---------------- */
function isUnlocked(){
  try{
    const at = parseInt(sessionStorage.getItem(SESSION_KEY) || "0", 10);
    return at && (Date.now() - at) < SESSION_MAX_MS;
  }catch(e){ return false; }
}
function unlock(){
  try{ sessionStorage.setItem(SESSION_KEY, String(Date.now())); }catch(e){}
  $("lockScreen").style.display = "none";
  $("adminView").classList.add("show");
  renderTabs();
  load();
}
function lock(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  $("adminView").classList.remove("show");
  $("lockScreen").style.display = "";
  $("lockInput").value = "";
  setTimeout(()=>$("lockInput").focus(), 100);
}
function tryPassword(){
  if(($("lockInput").value || "").trim() === PORTAL_PASSWORD){ unlock(); }
  else{
    $("lockInput").classList.add("wrong");
    $("lockError").textContent = "Wrong password. Try again.";
    setTimeout(()=>$("lockInput").classList.remove("wrong"), 400);
    $("lockInput").select();
  }
}
$("lockBtn").onclick = tryPassword;
$("lockInput").addEventListener("keydown", e => { if(e.key === "Enter") tryPassword(); });
$("lockAgainBtn").onclick = lock;

/* ---------------- Tabs ---------------- */
function renderTabs(){
  $("tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${t.key === current.key ? 'on' : ''}" data-k="${t.key}" style="--c:${t.accent}">
       <span class="dot"></span>${t.label}
     </button>`).join('');

  $("tabs").querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => {
      current = TABS.find(t => t.key === b.dataset.k);
      document.documentElement.style.setProperty('--accent', current.accent);
      $("searchInput").value = '';
      renderTabs();
      load();
    });
  });
  document.documentElement.style.setProperty('--accent', current.accent);
  $("searchInput").placeholder =
      current.key === 'evaluation' ? 'Search by student, teacher, or rating (e.g. 5)…'
    : current.key === 'progress'   ? 'Search by student, teacher, course or report ID…'
    : 'Search by name or phone number…';
}

/* ---------------- Load ---------------- */
async function load(){
  $("listContent").innerHTML = '<div class="loading"><div class="loading-spin"></div><div>Loading records…</div></div>';
  $("resultCount").textContent = '';
  $("stats").innerHTML = '';

  try{
    if(current.api === 'eval'){
      const res = await fetch(`${SCRIPT_EVAL}?action=list&password=${encodeURIComponent(ADMIN_API_PASSWORD)}`);
      const d = await res.json();
      if(d.result !== 'success') throw new Error(d.error || 'Failed to load');
      headers = [];
      rows = d.evaluations || [];
    } else if(current.api === 'progress'){
      // Returns KEYED OBJECTS, like the evaluation script — a progress
      // report is nested (master + answers + surahs) so the master
      // script's positional-array shape cannot represent it.
      const res = await fetch(`${SCRIPT_PROGRESS}?action=list&password=${encodeURIComponent(ADMIN_API_PASSWORD)}`);
      const d = await res.json();
      if(d.result !== 'success') throw new Error(d.error || 'Failed to load');
      headers = [];
      rows = d.reports || [];
    } else {
      const res = await fetch(`${SCRIPT_MASTER}?action=list&formType=${current.key}&password=${encodeURIComponent(ADMIN_API_PASSWORD)}`);
      const d = await res.json();
      if(d.result !== 'success') throw new Error(d.error || 'Failed to load');
      headers = d.headers || [];
      rows = d.rows || [];
    }
    renderStats();
    renderList(rows);
    setCount(rows.length);
  }catch(err){
    console.error(err);
    $("listContent").innerHTML = `<div class="empty-state">Couldn't load ${current.label.toLowerCase()}.<br><br>
      <small style="color:#ff9999">Error: ${esc(err.message)}</small><br><br>
      Check the Apps Script is deployed and the admin password matches.</div>`;
  }
}
$("refreshBtn").onclick = load;

function setCount(n){ $("resultCount").textContent = `Showing ${n} of ${rows.length}`; }

/* ---------------- Stats ---------------- */
function renderStats(){
  let html = `<div class="stat"><div class="stat-label">Total ${esc(current.label.toLowerCase())}</div>
              <div class="stat-value">${rows.length}</div></div>`;

  if(current.key === 'evaluation' && rows.length){
    const nums = rows.map(r => parseFloat(r.rating)).filter(n => !isNaN(n));
    const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length) : 0;
    const filled = Math.round(avg);
    html += `<div class="stat"><div class="stat-label">Average rating</div>
             <div class="stat-value">${avg.toFixed(1)}
               <span class="mini">${'★'.repeat(filled)}<span style="opacity:.25">${'★'.repeat(5-filled)}</span></span>
             </div></div>`;
  }
  if(current.key === 'progress' && rows.length){
    const pending = rows.filter(r => !String(r.attendancePercent || '').trim()).length;
    html += `<div class="stat"><div class="stat-label">Attendance pending</div>
             <div class="stat-value">${pending}</div></div>`;
  }
  if(rows.length){
    const latest = current.key === 'evaluation' ? rows[0].timestamp
      : current.key === 'progress' ? rows[0].submittedAt
      : rows[0][headers.indexOf('Timestamp')];
    html += `<div class="stat"><div class="stat-label">Most recent</div>
             <div class="stat-value" style="font-size:15px">${fmtDate(latest, true)}</div></div>`;
  }
  $("stats").innerHTML = html;
}

/* ---------------- List ---------------- */
function colIdx(name){ return headers.indexOf(name); }

function renderList(items){
  if(!rows.length){
    $("listContent").innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>No ${esc(current.label.toLowerCase())} submitted yet.</p></div>`;
    return;
  }
  if(!items.length){
    $("listContent").innerHTML = '<div class="empty-state">Nothing matches that search.</div>';
    return;
  }

  const head =
      current.key === 'evaluation' ? '<th>Date</th><th>Student</th><th>Teacher</th><th>Rating</th>'
    : current.key === 'progress'   ? '<th>Date</th><th>Student</th><th>Course</th><th>Attendance</th>'
    : current.listCols.map(c => `<th>${esc(c === 'Timestamp' ? 'Date' : c)}</th>`).join('');

  const body = items.map(item => {
    const i = rows.indexOf(item);
    if(current.key === 'progress'){
      const att = String(item.attendancePercent || '').trim();
      return `<tr data-i="${i}">
        <td class="date" data-label="Date">${esc(fmtDateOnly(item.reportDate))}</td>
        <td data-label="Student">${esc(item.studentName || '—')}</td>
        <td data-label="Course">${esc(item.courseName || '—')}</td>
        <td data-label="Attendance">${att ? esc(att) : '<span class="pr-pending">Pending</span>'}</td>
        <td class="actions">
          <button data-a="view" data-i="${i}">View</button>
          <button data-a="dl" data-i="${i}">Download</button>
        </td></tr>`;
    }
    if(current.key === 'evaluation'){
      const r = parseInt(item.rating,10) || 0;
      return `<tr data-i="${i}">
        <td class="date" data-label="Date">${fmtDate(item.timestamp)}</td>
        <td data-label="Student">${esc(item.studentName || '—')}</td>
        <td data-label="Teacher">${esc(item.teacherName || '—')}</td>
        <td class="rating" data-label="Rating">${'★'.repeat(r)}<span style="opacity:.25">${'★'.repeat(5-r)}</span></td>
        <td class="actions">
          <button data-a="view" data-i="${i}">View</button>
          <button data-a="dl" data-i="${i}">Download</button>
        </td></tr>`;
    }
    const cells = current.listCols.map(c => {
      const ci = colIdx(c);
      const v = ci >= 0 ? item[ci] : '';
      const label = c === 'Timestamp' ? 'Date' : c;
      return c === 'Timestamp'
        ? `<td class="date" data-label="${esc(label)}">${fmtDate(v)}</td>`
        : `<td data-label="${esc(label)}">${esc(v || '—')}</td>`;
    }).join('');
    return `<tr data-i="${i}">${cells}
      <td class="actions">
        <button data-a="view" data-i="${i}">View</button>
        <button data-a="dl" data-i="${i}">Download</button>
      </td></tr>`;
  }).join('');

  $("listContent").innerHTML =
    `<table class="list-table"><thead><tr>${head}<th style="text-align:right">Actions</th></tr></thead><tbody>${body}</tbody></table>`;

  $("listContent").querySelectorAll('button[data-a]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      // openDetail is async for progress reports (it fetches the full
      // record), so wait before printing or the modal is still empty.
      Promise.resolve(openDetail(+b.dataset.i)).then(() => {
        if(b.dataset.a === 'dl') setTimeout(()=>window.print(), 200);
      });
    });
  });
  $("listContent").querySelectorAll('tr[data-i]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(+tr.dataset.i));
  });
}

/* ---------------- Search ---------------- */
$("searchInput").addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderList(rows); setCount(rows.length); return; }

  let out;
  if(current.key === 'progress'){
    out = rows.filter(r =>
      [r.studentName, r.studentId, r.teacherName, r.courseName, r.reportId]
        .some(v => String(v || '').toLowerCase().includes(q)));
  } else if(current.key === 'evaluation'){
    out = rows.filter(r =>
      (r.studentName||'').toLowerCase().includes(q) ||
      (r.teacherName||'').toLowerCase().includes(q) ||
      String(r.rating||'') === q);           // type "5" for five-star
  } else {
    const dq = q.replace(/\D/g,'');
    out = rows.filter(row => {
      const text = row.join(' ').toLowerCase();
      if(text.includes(q)) return true;
      if(dq.length >= 3 && row.join(' ').replace(/\D/g,'').includes(dq)) return true;
      return false;
    });
  }
  renderList(out);
  setCount(out.length);
});

/* ---------------- Detail ---------------- */
async function openDetail(i){
  const item = rows[i];
  if(!item) return;
  detail = item;
  prFull = null; prDraft = null;
  $("prEditBtn").style.display = 'none';
  $("prSaveBtn").style.display = 'none';

  if(current.key === 'progress'){
    $("detailContent").innerHTML =
      '<div class="loading"><div class="loading-spin"></div><div>Loading report…</div></div>';
    $("modal").classList.add("show");
    document.body.style.overflow = "hidden";
    try{
      const res = await fetch(`${SCRIPT_PROGRESS}?action=getReport&id=${encodeURIComponent(item.reportId)}&password=${encodeURIComponent(ADMIN_API_PASSWORD)}`);
      const d = await res.json();
      if(d.result !== 'success') throw new Error(d.error || 'Failed to load');
      prFull = d.report;
      prDraft = JSON.parse(JSON.stringify(prFull));
      $("detailContent").innerHTML = progressDetail(prFull);
      $("prEditBtn").style.display = '';
      $("prEditBtn").textContent = 'Edit';
    }catch(err){
      $("detailContent").innerHTML =
        `<div class="empty-state">Couldn't load this report.<br><br>
         <small style="color:#ff9999">Error: ${esc(err.message)}</small></div>`;
    }
    return;
  }

  const html = current.key === 'evaluation' ? evalDetail(item) : formDetail(item);
  $("detailContent").innerHTML = html;
  $("modal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function shell(title, sub, inner){
  return `
    <div class="detail-head">
      <div class="detail-logo"><img src="/logo.png" alt="ManzilulQuran" onerror="this.style.display='none'"></div>
      <div class="detail-eyebrow">ManzilulQuran · E-Learning Academy</div>
      <div class="detail-h1">${esc(title)} <span class="hl">Record</span></div>
      <div class="detail-sub">${esc(sub)}</div>
    </div>
    ${inner}
    <div class="detail-arabic">جَزَاكَ اللهُ خَيْرًا</div>
    <div class="detail-foot">ManzilulQuran E-learning Academy · manzilulquran.in · info@manzilulquran.in</div>`;
}

function formDetail(row){
  let inner = '';
  headers.forEach((h, i) => {
    if(h === 'Timestamp') return;
    const v = row[i] || '—';
    let out;
    if(h === 'Payment Receipt' && String(v).startsWith('http')){
      out = `<a href="${esc(v)}" target="_blank" rel="noopener">Open receipt file →</a>`;
    } else if(h === 'Birth Date' || h === 'Date of Birth'){
      out = esc(fmtDateOnly(v));
    } else if(h === 'Class Time'){
      out = esc(fmtTimeOnly(v));
    } else {
      out = esc(v);
    }
    inner += `<div class="detail-row"><b>${esc(h)}</b><span>${out}</span></div>`;
  });
  return shell(current.title, 'Submitted ' + fmtDate(row[colIdx('Timestamp')], true), inner);
}

function evalDetail(e){
  const r = parseInt(e.rating,10) || 0;
  let inner = `
    <div class="detail-meta">
      <div class="detail-meta-row"><b>Student</b><span>${esc(e.studentName)}</span></div>
      <div class="detail-meta-row"><b>Teacher</b><span>${esc(e.teacherName)}</span></div>
    </div>`;

  QUESTIONS.forEach((q, i) => {
    inner += `<div class="detail-q">
      <div class="detail-q-title"><span class="detail-q-num">Q${i+1}</span>${esc(q.label)}</div>
      <div class="detail-options">` +
      q.options.map(o => {
        const on = o === e[q.key];
        return `<div class="detail-option${on ? ' picked' : ''}">
          <div class="detail-radio"></div><div>${esc(o)}</div>
          ${on ? '<div class="picked-tag">Parent&#39;s answer</div>' : ''}
        </div>`;
      }).join('') +
      `</div></div>`;
  });

  inner += `<div class="detail-q">
      <div class="detail-q-title"><span class="detail-q-num">Q6</span>Overall quality of classes</div>
      <div class="detail-stars">
        <span>${'★'.repeat(r)}<span style="opacity:.25">${'★'.repeat(5-r)}</span></span>
        <span class="detail-stars-num">${r}/5</span>
      </div>
    </div>
    <div class="detail-q">
      <div class="detail-q-title"><span class="detail-q-num">Q7</span>Suggestions or comments</div>
      <div class="detail-free">${esc(e.suggestions || '(no suggestions provided)')}</div>
    </div>`;

  return shell(current.title, 'Submitted ' + fmtDate(e.timestamp, true), inner);
}

/* ---------------- Progress report: view ---------------- */
/* Rendered inside the same shell() as every other record, so the print
   stylesheet and the house letterhead apply unchanged. */
function progressDetail(r){
  const pct = parseFloat(String(r.attendancePercent || '').replace('%','')) || 0;
  const answers = r.answers || [];
  const surahs  = (r.surahs || []).filter(x => x.entryType === 'Surah');
  const juz     = (r.surahs || []).filter(x => x.entryType === 'Juz');

  const ratings = answers.filter(a => a.type === 'rating');
  const longs   = answers.filter(a => a.type === 'textarea');
  const facts   = answers.filter(a => a.type !== 'rating' && a.type !== 'textarea');

  let inner = `<div class="pr-meta">
    ${prCell('Student', r.studentName)}
    ${prCell('Student ID', r.studentId)}
    ${prCell('Course', r.courseName)}
    ${prCell('Teacher', r.teacherName)}
    ${prCell('Class Schedule', r.classSchedule)}
    ${prCell('Report ID', r.reportId)}
  </div>`;

  if(r.classesScheduled || r.classesAttended || pct){
    const C = 2 * Math.PI * 32;
    inner += `<div class="pr-sec">Attendance</div>
      <div class="pr-att">
        <div class="pr-ring">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <circle cx="39" cy="39" r="32" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8"/>
            <circle cx="39" cy="39" r="32" fill="none" stroke="var(--accent)" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="${C}"
              stroke-dashoffset="${C - C * Math.min(pct,100) / 100}"/>
          </svg>
          <div class="pct">${pct ? pct + '%' : '—'}</div>
        </div>
        <div class="pr-am">
          <div><div class="k">Scheduled</div><div class="v">${esc(r.classesScheduled || '—')}</div></div>
          <div><div class="k">Attended</div><div class="v">${esc(r.classesAttended || '—')}</div></div>
          <div><div class="k">Leave / Resch.</div><div class="v">${esc(r.leaveRescheduled || '—')}</div></div>
        </div>
      </div>`;
  } else {
    inner += `<div class="pr-sec">Attendance</div>
      <div class="detail-free pr-pending">Attendance has not been added yet.
      Use <b>Edit</b> to record it.</div>`;
  }

  if(facts.length){
    inner += `<div class="pr-sec">Current Position &amp; Progress</div>`;
    facts.forEach(a => {
      inner += `<div class="detail-row"><b>${esc(a.label)}</b><span>${esc(a.value)}${
        a.comment ? ` <span class="pr-cmt">— ${esc(a.comment)}</span>` : ''}</span></div>`;
    });
  }

  if(surahs.length || juz.length){
    inner += `<div class="pr-sec">Portions Completed</div>`;
    if(surahs.length){
      inner += `<div class="pr-chips">` + surahs.map(x =>
        `<span class="pr-chip">${esc(x.number + '. ' + x.name)}<span class="st">${esc(x.status)}</span></span>`
      ).join('') + `</div>`;
    }
    if(juz.length){
      inner += `<div class="pr-chips">` + juz.map(x =>
        `<span class="pr-chip">${esc(x.name)}<span class="st">${esc(x.status)}</span></span>`
      ).join('') + `</div>`;
    }
  }

  if(ratings.length){
    inner += `<div class="pr-sec">Performance Assessment</div><div class="pr-rates">` +
      ratings.map(a => {
        const v = String(a.value);
        const col = PR_COLOR[v] || '#9aa';
        return `<div class="pr-rate">
          <div class="pr-rt"><span class="pr-rl">${esc(a.label)}</span>
          <span class="pr-pill" style="background:${col}">${esc(v)}</span></div>
          <div class="pr-meter"><i style="width:${PR_PCT[v] || 20}%;background:${col}"></i></div>
          ${a.comment ? `<div class="pr-cmt">${esc(a.comment)}</div>` : ''}
        </div>`;
      }).join('') + `</div>`;
  }

  const bySec = {};
  longs.forEach(a => { (bySec[a.sectionTitle] = bySec[a.sectionTitle] || []).push(a); });
  Object.keys(bySec).forEach(sec => {
    inner += `<div class="pr-sec">${esc(sec)}</div>`;
    bySec[sec].forEach(a => {
      inner += `<div class="detail-q"><div class="detail-q-title">${esc(a.label)}</div>
                <div class="detail-free">${esc(a.value)}</div></div>`;
    });
  });

  if(r.teacherRemarks){
    inner += `<div class="pr-sec">Additional Remarks</div>
              <div class="detail-free">${esc(r.teacherRemarks)}</div>`;
  }

  return shell(current.title,
    (r.studentName || 'Student') + ' · ' + fmtDateOnly(r.reportDate), inner);
}
function prCell(k, v){
  return `<div><div class="k">${esc(k)}</div><div class="v">${esc(v || '—')}</div></div>`;
}

/* ---------------- Progress report: edit ----------------
   The teacher's form never collects attendance — it is entered here,
   along with any correction to the report itself. */
function progressEdit(r){
  let h = `<div class="pr-edit">
    <div class="detail-h1" style="font-size:20px;margin-bottom:4px">Edit Report</div>
    <div class="detail-sub" style="margin-bottom:18px">${esc(r.reportId)}</div>

    <div class="pr-sec">Report Details</div>
    <div class="pr-grid">
      ${prField('reportDate','Report Date','date',r.reportDate)}
      ${prField('studentName','Student Name','text',r.studentName)}
      ${prField('studentId','Student ID','text',r.studentId)}
      ${prField('teacherName','Teacher Name','text',r.teacherName)}
    </div>

    <div class="pr-sec">Attendance &amp; Schedule</div>
    <div class="pr-grid">
      ${prField('classSchedule','Class Schedule','text',r.classSchedule)}
      ${prField('leaveRescheduled','Leave / Rescheduled','text',r.leaveRescheduled)}
      ${prField('classesScheduled','Total Classes Scheduled','number',r.classesScheduled)}
      ${prField('classesAttended','Classes Attended','number',r.classesAttended)}
      <div><label>Attendance Percentage (calculated)</label>
        <input type="text" id="pr_attendancePercent" readonly value="${esc(r.attendancePercent || '—')}"></div>
    </div>

    <div class="pr-sec">Portions Completed</div>
    <div class="pr-add">
      <div><label>Type</label><select id="pr_addType">
        <option value="Surah">Surah</option><option value="Juz">Juz</option></select></div>
      <div><label>Select</label><select id="pr_addWhich"></select></div>
      <div><label>Status</label><select id="pr_addStatus">
        <option>Completed</option><option>In Progress</option><option>Revised</option></select></div>
      <button type="button" id="pr_addBtn">Add</button>
    </div>
    <div class="pr-chips" id="pr_chips"></div>`;

  const bySec = {};
  (r.answers || []).forEach((a, i) => { (bySec[a.sectionTitle] = bySec[a.sectionTitle] || []).push({a,i}); });

  Object.keys(bySec).forEach(sec => {
    h += `<div class="pr-sec">${esc(sec)}</div><div class="pr-grid">`;
    bySec[sec].forEach(({a,i}) => {
      h += `<div class="pr-full"><label>${esc(a.label)}</label>${prAnswerInput(a,i)}
        <input type="text" data-prcmt="${i}" placeholder="Comment (optional)"
          value="${esc(a.comment || '')}" style="margin-top:6px;font-size:12px"></div>`;
    });
    h += `</div>`;
  });

  h += `<div class="pr-sec">Additional Remarks</div>
    <div class="pr-grid"><div class="pr-full">
      <label>Teacher Remarks</label>
      <textarea id="pr_teacherRemarks" rows="2">${esc(r.teacherRemarks || '')}</textarea>
    </div></div></div>`;
  return h;
}
function prField(key,label,type,val){
  return `<div><label>${esc(label)}</label>
    <input type="${type}" id="pr_${key}" value="${esc(val || '')}"></div>`;
}
function prAnswerInput(a,i){
  if(a.type === 'rating'){
    return `<select data-prans="${i}">` + PR_RATINGS.map(v =>
      `<option${String(a.value) === v ? ' selected' : ''}>${esc(v)}</option>`).join('') + `</select>`;
  }
  if(a.type === 'textarea'){
    return `<textarea data-prans="${i}" rows="3">${esc(a.value || '')}</textarea>`;
  }
  return `<input type="text" data-prans="${i}" value="${esc(a.value || '')}">`;
}

function bindProgressEdit(){
  const recalc = () => {
    const sc = Number($("pr_classesScheduled").value), at = Number($("pr_classesAttended").value);
    $("pr_attendancePercent").value =
      (sc > 0 && !isNaN(at)) ? (Math.round((at/sc)*1000)/10) + '%' : '—';
  };
  $("pr_classesScheduled").addEventListener('input', recalc);
  $("pr_classesAttended").addEventListener('input', recalc);

  const fillWhich = () => {
    $("pr_addWhich").innerHTML = $("pr_addType").value === 'Surah'
      ? PR_SURAHS.map((x,i) => `<option value="${i+1}">${i+1}. ${esc(x)}</option>`).join('')
      : Array.from({length:30}, (_,i) => `<option value="${i+1}">Juz ${i+1}</option>`).join('');
  };
  $("pr_addType").onchange = fillWhich;
  fillWhich();

  $("pr_addBtn").onclick = () => {
    const t = $("pr_addType").value, num = Number($("pr_addWhich").value);
    const name = t === 'Surah' ? PR_SURAHS[num-1] : ('Juz ' + num);
    prDraft.surahs = prDraft.surahs || [];
    if(prDraft.surahs.some(x => x.entryType === t && Number(x.number) === num)) return;
    prDraft.surahs.push({ entryType:t, number:num, name:name, status:$("pr_addStatus").value, note:'' });
    prDraft.surahs.sort((a,b) => a.entryType === b.entryType
      ? a.number - b.number : (a.entryType === 'Surah' ? -1 : 1));
    renderPrChips();
  };
  renderPrChips();
}

function renderPrChips(){
  const arr = (prDraft && prDraft.surahs) || [];
  $("pr_chips").innerHTML = arr.length ? arr.map((x,i) =>
    `<span class="pr-chip">${esc(x.entryType === 'Surah' ? x.number + '. ' + x.name : x.name)}
      <span class="st">${esc(x.status)}</span>
      <button type="button" data-prdel="${i}" title="Remove">&times;</button></span>`).join('')
    : '<span style="font-size:12px;opacity:.55">No portions recorded.</span>';
  $("pr_chips").querySelectorAll('[data-prdel]').forEach(b => {
    b.onclick = () => { prDraft.surahs.splice(+b.dataset.prdel,1); renderPrChips(); };
  });
}

/* Toggle between the report and the editor */
$("prEditBtn").onclick = () => {
  if(!prDraft) return;
  const editing = $("prSaveBtn").style.display !== 'none';
  if(editing){
    $("detailContent").innerHTML = progressDetail(prDraft);
    $("prSaveBtn").style.display = 'none';
    $("prEditBtn").textContent = 'Edit';
  } else {
    $("detailContent").innerHTML = progressEdit(prDraft);
    bindProgressEdit();
    $("prSaveBtn").style.display = '';
    $("prEditBtn").textContent = 'Back to report';
  }
};

$("prSaveBtn").onclick = async () => {
  if(!prDraft) return;

  const common = {
    reportDate:       $("pr_reportDate").value,
    studentName:      $("pr_studentName").value.trim(),
    studentId:        $("pr_studentId").value.trim(),
    teacherName:      $("pr_teacherName").value.trim(),
    classSchedule:    $("pr_classSchedule").value.trim(),
    classesScheduled: $("pr_classesScheduled").value,
    classesAttended:  $("pr_classesAttended").value,
    leaveRescheduled: $("pr_leaveRescheduled").value.trim(),
    teacherRemarks:   $("pr_teacherRemarks").value.trim()
  };

  document.querySelectorAll('[data-prans]').forEach(el => {
    const i = +el.dataset.prans;
    if(prDraft.answers[i]) prDraft.answers[i].value = el.value;
  });
  document.querySelectorAll('[data-prcmt]').forEach(el => {
    const i = +el.dataset.prcmt;
    if(prDraft.answers[i]) prDraft.answers[i].comment = el.value.trim();
  });

  Object.assign(prDraft, common);
  prDraft.attendancePercent = $("pr_attendancePercent").value === '—'
    ? '' : $("pr_attendancePercent").value;

  $("prSaveBtn").disabled = true;
  $("prSaveBtn").textContent = 'Saving…';

  try{
    const res = await fetch(SCRIPT_PROGRESS, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'updateReport',
        password: ADMIN_API_PASSWORD,
        reportId: prDraft.reportId,
        common: common,
        answers: prDraft.answers,
        surahs: prDraft.surahs || []
      })
    });
    let out; try{ out = await res.json(); }catch(_){ out = { result:'success' }; }
    if(out.result !== 'success') throw new Error(out.error || 'Save failed');

    $("detailContent").innerHTML = progressDetail(prDraft);
    $("prSaveBtn").style.display = 'none';
    $("prEditBtn").textContent = 'Edit';
    load();
  }catch(err){
    alert("Couldn't save the report.\n\n" + err.message);
  }finally{
    $("prSaveBtn").disabled = false;
    $("prSaveBtn").textContent = 'Save changes';
  }
};

function closeDetail(){
  $("modal").classList.remove("show");
  document.body.style.overflow = "";
  detail = null; prFull = null; prDraft = null;
  $("prEditBtn").style.display = 'none';
  $("prSaveBtn").style.display = 'none';
}
$("closeModalBtn").onclick = closeDetail;
$("modal").addEventListener('click', e => { if(e.target === $("modal")) closeDetail(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $("modal").classList.contains('show')) closeDetail();
});

$("downloadBtn").onclick = () => {
  const t = document.title;
  if(detail){
    const who =
        current.key === 'evaluation' ? detail.studentName
      : current.key === 'progress'   ? (detail.studentName || 'report')
      : (detail[colIdx('First Name')] || detail[colIdx('Student Name')] || 'record');
    document.title = `${current.title} - ${who}`;
  }
  window.print();
  setTimeout(()=>{ document.title = t; }, 1000);
};

/* ---------------- Utils ---------------- */
function esc(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(v, withTime){
  if(!v) return '—';
  const d = (v instanceof Date) ? v : new Date(v);
  if(isNaN(d.getTime())) return String(v);
  const o = { day:'numeric', month:'short', year:'numeric' };
  if(withTime){ o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleDateString('en-GB', o);
}
// Birth dates arrive as full ISO timestamps from Sheets — show only the day
function fmtDateOnly(v){
  if(!v || v === '—') return '—';
  const s = String(v);
  const p = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(p){
    const d = new Date(Date.UTC(+p[1], +p[2]-1, +p[3]));
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' });
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
// Time-only values carry a dummy 1899 date from Sheets — strip it
function fmtTimeOnly(v){
  if(!v || v === '—') return '—';
  const s = String(v);
  const p = s.match(/^(\d{1,2}):(\d{2})$/);
  if(p){
    const d = new Date(); d.setHours(+p[1], +p[2], 0, 0);
    return d.toLocaleTimeString('en-GB', { hour:'numeric', minute:'2-digit', hour12:true });
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? s : d.toLocaleTimeString('en-GB', { hour:'numeric', minute:'2-digit', hour12:true });
}

/* Boot last */
if(isUnlocked()){
  $("lockScreen").style.display = "none";
  $("adminView").classList.add("show");
  renderTabs();
  load();
}
</script>
