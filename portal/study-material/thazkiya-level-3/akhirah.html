<style>
:root{
  --void:#0A101C; --deep:#101A2B; --star:#EAF0F8; --dim:#8FA1B9;
  --gold:#D9B463; --gold-d:#9C7A2C; --gold-soft:#EFDCAB;
  --em:#59B096; --em-soft:#C4E5D9;
  --ui:'Nunito',system-ui,-apple-system,sans-serif;
  --disp:'Fraunces',Georgia,serif;
  --ar:'Amiri',serif;
  --ml:'Anek Malayalam','Noto Sans Malayalam',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);color:var(--star);background:var(--void);
  display:flex;flex-direction:column;touch-action:pan-y}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;z-index:0;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.65) 0 1.2px,transparent 2px),
    radial-gradient(circle at 68% 8%,rgba(255,255,255,.45) 0 1.5px,transparent 2.3px),
    radial-gradient(circle at 34% 66%,rgba(255,255,255,.4) 0 1px,transparent 1.9px),
    radial-gradient(circle at 86% 48%,rgba(255,255,255,.5) 0 1.3px,transparent 2.1px);
  background-size:440px 440px}

/* ---------- Malayalam ---------- */
body.lang-ml,body.lang-ml p,body.lang-ml .lede,body.lang-ml h2,body.lang-ml .hq .q,
body.lang-ml .ay .m,body.lang-ml .note p,body.lang-ml .mid .meta,body.lang-ml .dn{
  font-family:var(--ml)}
body.lang-ml p,body.lang-ml .note p{line-height:2.05}
body.lang-ml .lede,body.lang-ml .hq .q,body.lang-ml .ay .m{font-style:normal}
.bar .lang{min-height:36px;border:1px solid rgba(217,180,99,.35);border-radius:9px;

  font-size:11.5px;padding:8px 11px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.bar .lang:hover{background:var(--gold);color:var(--void)}

/* ---------- chrome ---------- */
.bar{position:relative;z-index:6;display:flex;align-items:center;gap:9px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;flex:0 0 auto;
  background:linear-gradient(180deg,rgba(10,16,28,.97),rgba(10,16,28,.55))}
.bar .logo{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-d)}
.bar h1{font-family:var(--ar);font-size:15.5px;font-weight:700;color:var(--gold);line-height:1.1;white-space:nowrap}
.bar .en{font-family:var(--disp);font-size:9.5px;color:var(--dim);letter-spacing:1.5px}
.bar .sp{flex:1}
.bar .no{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.menu-btn{width:36px;height:36px;border:1px solid rgba(217,180,99,.3);border-radius:9px;
  background:transparent;color:var(--gold);font-size:15px;cursor:pointer;display:grid;place-items:center}
.rail{position:relative;z-index:6;display:flex;gap:2px;padding:0 14px 8px;flex:0 0 auto}
.rail i{flex:1;height:2px;border-radius:2px;background:rgba(143,161,185,.22);transition:.3s}
.rail i.done{background:var(--gold-d)} .rail i.now{background:var(--gold)}

/* ---------- the book ---------- */
.book{flex:1;position:relative;overflow:hidden;z-index:2}
.strip{display:flex;height:100%;will-change:transform;
  transition:transform .38s cubic-bezier(.22,.75,.25,1)}
.strip.drag{transition:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow:hidden;
  padding:22px 24px calc(58px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;justify-content:center}
.inner{width:100%;max-width:600px;margin:0 auto}

/* typography — document first */
.kicker{font-size:10px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--gold);opacity:.75;margin-bottom:12px}
h2{font-family:var(--disp);font-size:clamp(1.5rem,5.4vw,2rem);font-weight:600;line-height:1.18;color:var(--star)}
.t-ar{font-family:var(--ar);font-size:clamp(1.15rem,4.4vw,1.5rem);font-weight:700;color:var(--gold);direction:rtl;margin-top:3px}
.lede{font-family:var(--disp);font-size:clamp(.95rem,3.6vw,1.05rem);font-style:italic;
  color:var(--gold-soft);opacity:.9;line-height:1.7;margin-top:14px}
.hr{width:38px;height:1px;background:var(--gold-d);margin:16px 0;opacity:.8}
p{font-size:clamp(.94rem,3.5vw,1.02rem);line-height:1.9;opacity:.94;margin-bottom:12px}
p:last-child{margin-bottom:0}
mark{background:linear-gradient(transparent 62%,rgba(217,180,99,.32) 62%);
  color:var(--gold-soft);font-weight:700;padding:0 1px}
b{color:var(--gold-soft);font-weight:700}
.small{font-size:12.5px;color:var(--dim);line-height:1.75}

/* hadith — a pull quote, not a card */
.hq{border-left:2px solid var(--gold-d);padding-left:18px;margin:6px 0 4px}
.hq .q{font-family:var(--disp);font-size:clamp(1rem,4vw,1.18rem);font-style:italic;
  line-height:1.85;color:var(--star)}
.hq .s{font-size:11.5px;font-weight:700;color:var(--gold);margin-top:10px;letter-spacing:.3px}
.hq .g{font-size:9px;font-weight:800;letter-spacing:1.1px;border:1px solid currentColor;
  border-radius:100px;padding:1px 7px;margin-left:6px;color:var(--em)}

/* ayah — centred, no box */
.ay{text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid rgba(217,180,99,.2)}
.ay .a{font-family:var(--ar);font-size:clamp(1.2rem,5vw,1.55rem);font-weight:700;
  color:var(--em-soft);direction:rtl;line-height:2.1}
.ay .m{font-size:13.5px;font-style:italic;color:var(--star);opacity:.85;margin-top:8px}
.ay .r{font-size:11px;font-weight:700;color:var(--em);margin-top:5px;letter-spacing:.4px}

/* the one box we keep */
.note{border:1px solid rgba(217,180,99,.28);border-radius:12px;padding:15px 17px;margin-top:18px;
  background:rgba(217,180,99,.05)}
.note .l{font-size:9.5px;font-weight:800;letter-spacing:1.7px;color:var(--gold);opacity:.8;margin-bottom:6px}
.note p{font-size:13.5px;line-height:1.8;margin:0;opacity:.9}

/* image plate */
.plate{margin:0 -24px 18px}
.plate img{width:100%;display:block}
.plate .ph{aspect-ratio:16/10;background:linear-gradient(160deg,#0E1726,#131F33);
  border-top:1px solid rgba(217,180,99,.18);border-bottom:1px solid rgba(217,180,99,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  text-align:center;padding:18px 26px}
.plate .ph .m{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center}
.plate .ph .fn{font-family:monospace;font-size:10.5px;color:var(--gold);opacity:.5}
.plate .ph .rt{font-family:monospace;font-size:9.5px;color:var(--em);opacity:.45;
  border:1px solid currentColor;border-radius:100px;padding:1px 7px}
.plate .ph .pr{font-size:10.5px;line-height:1.6;color:var(--dim);opacity:.35;font-style:italic;max-width:56ch}
.plate .cap{font-size:12px;color:var(--dim);text-align:center;margin-top:9px;padding:0 24px}

/* cover + end */
.mid{justify-content:center;text-align:center}
.mid .crest{width:70px;height:70px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-d);
  box-shadow:0 0 0 7px rgba(217,180,99,.07);margin:0 auto 20px}
.mid .car{font-family:var(--ar);font-size:clamp(1.9rem,8.5vw,2.7rem);font-weight:700;color:var(--gold);line-height:1.45}
.mid .cen{font-family:var(--disp);font-size:clamp(1rem,4.2vw,1.3rem);font-weight:500;
  color:var(--star);letter-spacing:3px;margin-top:4px}
.mid .meta{font-size:12.5px;color:var(--dim);margin-top:20px;line-height:2}
.mid .fin{font-family:var(--ar);font-size:clamp(1.2rem,5vw,1.6rem);color:var(--gold);line-height:2.1;margin:18px 0}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--void) 60%,transparent)}
.foot .lbl{flex:1;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot button{width:38px;height:38px;border:1px solid rgba(217,180,99,.3);background:transparent;
  color:var(--gold);border-radius:9px;font-size:15px;cursor:pointer}
.foot button:disabled{opacity:.22}
.hint{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);z-index:6;
  font-size:11px;color:var(--dim);opacity:.7;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}

/* index */
.scrim{position:fixed;inset:0;background:rgba(3,7,14,.78);z-index:20;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);z-index:30;overflow-y:auto;
  background:linear-gradient(180deg,var(--deep),var(--void));border-right:1px solid rgba(217,180,99,.22);
  padding:calc(18px + env(safe-area-inset-top)) 13px 20px;transform:translateX(-105%);
  transition:transform .3s cubic-bezier(.3,.85,.3,1)}
.drawer.on{transform:none}
.drawer h3{font-family:var(--disp);font-size:17px;color:var(--gold);padding:2px 10px 3px}
.drawer .sub{font-size:11px;color:var(--dim);padding:0 10px 12px;border-bottom:1px solid rgba(217,180,99,.18);margin-bottom:9px}
.dn{display:flex;gap:10px;align-items:center;padding:10px;min-height:42px;border-radius:9px;
  color:var(--star);font-size:13px;font-weight:600;cursor:pointer;opacity:.82}
.dn:hover{background:rgba(217,180,99,.1);opacity:1}
.dn .n{width:24px;height:24px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
  border:1px solid rgba(217,180,99,.35);color:var(--gold);font-size:10.5px;font-weight:800}

@media(min-height:760px){ .page{padding:34px 28px calc(64px + env(safe-area-inset-bottom))} }
@media (prefers-reduced-motion:reduce){ .strip{transition:none} }
</style>

<script>

const IMG="placeholder", RATIO="16:10";
const ART="Quiet night-toned illustration for a serious Islamic book. Deep navy and warm gold, soft painted texture, restrained and still. No people, no figures, no angels, and nothing of the unseen depicted literally. ";

const S=[
{
 t:"The Moment Itself", ar:"سَكَرَاتُ الْمَوْت",
 lede:"Every soul will taste it. Not read about it — taste it.",

  p:ART+"A small oil lamp on a bare windowsill, its flame almost out, the room beyond in darkness, a faint blue pre-dawn sky through the glass."},
 p1:"Death is the only appointment any of us certainly has. We do not know the date, the place or the manner — only that it is coming, and that it has never once been postponed for anybody.",
 p2:"The Prophet ﷺ described the soul of a believer drawn out gently, <mark>like a drop of water from the mouth of a waterskin</mark>, with angels bringing shrouds and fragrance from Jannah. He described the soul of the wrongdoer dragged out like a skewer through wet wool.",
 p3:"ʿĀ'ishah watched him die with a vessel of water beside him. He kept dipping his hand and wiping his face. Even he was not spared it.",
 had:{q:"There are agonies in death.",s:"Ṣaḥīḥ al-Bukhārī 4449",g:"ṢAḤĪḤ"},
 ay:{a:"وَجَاءَتْ سَكْرَةُ الْمَوْتِ بِالْحَقِّ",m:"And the intoxication of death comes with the truth.",r:"Sūrah Qāf 50:19"},
 know:"He told us to remember death often, calling it <b>the destroyer of pleasures</b>, and he encouraged visiting graves — not to frighten people, but because a person who remembers the end argues less about the middle.",
 you:"You have been to funerals. One day the funeral is yours, and the people carrying you will go home and eat dinner. That is not morbid. It is simply true, and it should change what you do this afternoon."
},
{
 t:"The Barzakh", ar:"الْبَرْزَخ",
 lede:"A barrier between two worlds, and nobody has come back through it.",
 img:{f:"akh-02-barrier.jpeg",cap:"A wall of mist across a road at night.",
  p:ART+"An empty stone road running toward a wall of pale mist under a starry sky, the road disappearing into it, low hills either side."},
 p1:"Between death and the resurrection lies the <b>barzakh</b> — a partition. The body returns to the earth. The soul enters a life we cannot see, measure or photograph.",
 p2:"Time there does not work as it does here. A person may feel they stayed a day, or part of a day, and be told they stayed a hundred years.",
 p3:"Every human being who has ever lived is in the barzakh right now — every prophet, every companion, every one of your great-grandparents. It is by far the most populated place there is, and the only one none of them can send word from.",
 had:{q:"The grave is the first stage of the stages of the hereafter. Whoever is saved from it, what comes after is easier — and whoever is not, what comes after is harder.",s:"Sunan at-Tirmidhī 2308",g:"SUNAN"},
 ay:{a:"وَمِن وَرَائِهِم بَرْزَخٌ إِلَىٰ يَوْمِ يُبْعَثُونَ",m:"And behind them is a barrier until the Day they are resurrected.",r:"Sūrah Al-Mu'minūn 23:100"},
 know:"The barzakh is not a pause in which nothing happens. It is where the results begin — which is why the Prophet ﷺ called it the first stage rather than the gap before the stages.",
 you:"Everyone you will ever miss is already there. Everyone who will ever miss you will follow. The only thing that travels between the two is duʿā."
},
{
 t:"The Two Questioners", ar:"سُؤَالُ الْقَبْر",
 lede:"Three questions. Everyone is asked exactly the same three.",
 img:{f:"akh-03-footsteps.jpeg",cap:"The last footprints leaving a fresh grave.",
  p:ART+"Fresh footprints in soft earth leading away from a plain unmarked grave mound at dusk, a low stone at its head, empty ground beyond."},
 p1:"When the burial is finished and the last footsteps walk away — the Prophet ﷺ said the dead person hears their sandals — two angels come and sit the soul up.",
 p2:"They ask: <mark>Who is your Lord? What is your religion? Who is this man who was sent among you?</mark> The believer answers. The heedless one says: <i>ah, ah — I do not know. I heard people saying something, so I said it too.</i>",
 p3:"Notice that these answers cannot be learned in that moment. They are not information. They are the result of how a person actually lived.",
 had:{q:"When the servant is placed in his grave and his companions turn away — and he hears the sound of their sandals — two angels come to him.",s:"Ṣaḥīḥ al-Bukhārī 1338 · Muslim 2870",g:"ṢAḤĪḤ"},
 ay:{a:"يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ",m:"Allah keeps firm those who believe, with the firm word.",r:"Sūrah Ibrāhīm 14:27"},
 know:"The companions understood that āyah to refer to this questioning. It is why he ﷺ would stand at a fresh grave after the burial and say: <b>ask Allah to keep him firm, for he is being questioned now.</b>",
 you:"You cannot revise for this. The third question is about a man you claim to follow — and the answer will come out sounding exactly like the way you lived, not the way you described yourself."
},
{
 t:"A Garden or a Pit", ar:"رَوْضَةٌ أَوْ حُفْرَة",
 lede:"The grave is not a waiting room. Something is already happening in it.",
 img:{f:"akh-04-two-doors.jpeg",cap:"Two doorways in one dark wall.",
  p:ART+"Two plain stone doorways side by side in a dark wall; warm green light spills from one, faint red glow from the other, nothing visible beyond either."},
 p1:"For the one who answers well, the grave is widened as far as the eye can see, a door to Jannah is opened, and its air reaches him. He says: <i>my Lord, establish the Hour, so I may return to my family.</i>",
 p2:"For the one who does not, the earth presses in until his ribs interlock. He says: <i>my Lord, do not establish the Hour.</i>",
 p3:"He ﷺ once passed two graves and said their occupants were being punished — and not for something enormous. <mark>One was careless about keeping clean of urine; the other spread gossip between people.</mark>",
 had:{q:"His place is shown to him morning and evening — if of the people of Jannah, then of the people of Jannah; and if of the people of the Fire, then of the people of the Fire.",s:"Ṣaḥīḥ al-Bukhārī 1379 · Muslim 2866",g:"ṢAḤĪḤ"},
 ay:{a:"النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا",m:"The Fire — they are exposed to it morning and evening.",r:"Sūrah Ghāfir 40:46"},
 know:"Those two graves are a warning about small things. Gossip and carelessness in purity are not the sins people expect to be punished for, which is exactly why he mentioned them.",
 you:"The thing that harms you may not be the dramatic sin you are guarding against. It may be your tongue, and the way you talk about people when they are not in the room."
},
{
 t:"The Horn", ar:"النَّفْخَةُ الأُولَى",
 lede:"One sound, and everything that exists stops existing.",
 img:{f:"akh-05-market.jpeg",cap:"A market stopped mid-morning.",
  p:ART+"An empty open-air market at first light: scales left tipped, a cloth half folded, fruit spilled across a mat, a cup on its side. Everything abandoned mid-task. No people."},
 p1:"Isrāfīl has held the horn to his lips since he was created, waiting for the command, his eyes on the Throne.",
 p2:"When it is blown, everyone in the heavens and the earth falls dead except whom Allah wills. Not a nation, not a species — <mark>everything</mark>.",
 p3:"The Qur'an describes people caught in ordinary life: one arguing in the market, one with food raised to his mouth, one repairing his roof. Nobody gets to finish what they were doing.",
 had:{q:"How can I be at ease when the owner of the horn has taken it up, lowered his brow and is listening, waiting to be permitted to blow?",s:"Sunan at-Tirmidhī 2431",g:"SUNAN"},
 ay:{a:"وَنُفِخَ فِي الصُّورِ فَصَعِقَ مَن فِي السَّمَاوَاتِ وَمَن فِي الْأَرْضِ",m:"And the horn will be blown, and whoever is in the heavens and the earth will fall dead.",r:"Sūrah Az-Zumar 39:68"},
 know:"When the companions heard that ḥadīth they asked what they should say. He told them to say: <b>ḥasbunallāhu wa niʿma l-wakīl</b> — Allah is enough for us, and He is the best Trustee.",
 you:"Whatever you are anxious about right now — an exam, an argument, what somebody said about you — will end in the middle of a sentence."
},
{
 t:"Standing Again", ar:"النَّفْخَةُ الثَّانِيَة",
 lede:"Barefoot. Uncovered. Exactly as you first arrived.",
 img:{f:"akh-06-plain.jpeg",cap:"An endless plain at first light.",
  p:ART+"An immense flat empty plain stretching to the horizon under a pale enormous sky at first light, the ground smooth and featureless, one faint band of gold along the edge."},
 p1:"After a period known only to Allah, the horn is blown a second time, and the whole of humanity stands up from the earth and looks about.",
 p2:"He ﷺ said we will be gathered <mark>barefoot, naked and uncircumcised</mark>, exactly as we were first created. ʿĀ'ishah asked whether men and women would look at one another. He answered: <i>the matter is far too serious for that.</i>",
 p3:"Nobody will be thinking about anyone else. The first to be clothed will be Ibrāhīm.",
 had:{q:"You will be gathered barefoot, naked and uncircumcised.",s:"Ṣaḥīḥ al-Bukhārī 6527 · Muslim 2860",g:"ṢAḤĪḤ"},
 ay:{a:"كَمَا بَدَأْنَا أَوَّلَ خَلْقٍ نُّعِيدُهُ",m:"As We began the first creation, We will repeat it.",r:"Sūrah Al-Anbiyā' 21:104"},
 know:"Everything a person spent a life acquiring — clothes, wealth, position, followers, the phone in their hand — stays in the earth. Only the record is carried across.",
 you:"Every single thing you own, you will one day leave in a room. Ask what you are actually building."
},
{
 t:"The Gathering", ar:"الْمَحْشَر",
 lede:"The sun brought near, and shade for exactly seven kinds of people.",
 img:{f:"akh-07-shade.jpeg",cap:"One patch of shade on burning ground.",
  p:ART+"A vast sunbaked cracked plain under a huge low white sun, with a single cool patch of deep shade in the foreground and nothing casting it. Heat haze on the horizon. No people."},
 p1:"All of creation is gathered on one plain. The sun is brought near, and people stand in their own sweat — some to the ankles, some to the waist, some drowning in it, each according to their deeds.",

 ay:"മരണത്തിന്റെ ബോധക്ഷയം സത്യവുമായി വന്നെത്തുന്നു.",
 know:"മരണത്തെ ധാരാളം ഓർക്കാൻ അവിടുന്ന് പറഞ്ഞു, അതിനെ <i>സുഖങ്ങളെ തകർക്കുന്നത്</i> എന്ന് വിളിച്ചു. ഖബ്ർ സന്ദർശിക്കാനും പ്രോത്സാഹിപ്പിച്ചു — ആളുകളെ പേടിപ്പിക്കാനല്ല, അവസാനം ഓർക്കുന്നവൻ ഇടയിലുള്ളതിനെക്കുറിച്ച് കുറച്ചേ തർക്കിക്കൂ എന്നതുകൊണ്ട്.",
 you:"നീ പല മയ്യിത്ത് നിസ്കാരങ്ങൾക്കും പോയിട്ടുണ്ട്. ഒരു ദിവസം ആ മയ്യിത്ത് നിന്റേതാകും, നിന്നെ ചുമക്കുന്നവർ വീട്ടിൽ ചെന്ന് അത്താഴം കഴിക്കും. ഇത് ഭയപ്പെടുത്താനല്ല. ഇത് സത്യമാണ്, ഇന്ന് ഉച്ചകഴിഞ്ഞ് നീ എന്ത് ചെയ്യുന്നു എന്നത് ഇത് മാറ്റണം."
},
{
 t:"ബർസഖ്", ar:"الْبَرْزَخ",
 lede:"രണ്ട് ലോകങ്ങൾക്കിടയിലെ ഒരു മറ — ആരും അതിലൂടെ തിരിച്ചുവന്നിട്ടില്ല.",
 cap:"രാത്രിയിൽ വഴി മുറിച്ചുകടക്കുന്ന ഒരു മൂടൽമഞ്ഞിന്റെ മതിൽ.",
 p1:"മരണത്തിനും പുനരുത്ഥാനത്തിനും ഇടയിലുള്ളതാണ് <b>ബർസഖ്</b> — ഒരു മറ. ശരീരം മണ്ണിലേക്ക് മടങ്ങുന്നു. ആത്മാവ് നമുക്ക് കാണാനോ അളക്കാനോ ചിത്രമെടുക്കാനോ കഴിയാത്ത ഒരു ജീവിതത്തിലേക്ക് പ്രവേശിക്കുന്നു.",
 p2:"അവിടെ സമയം ഇവിടെയുള്ളതുപോലെയല്ല പ്രവർത്തിക്കുന്നത്. ഒരു ദിവസമോ ദിവസത്തിന്റെ ഒരു ഭാഗമോ താമസിച്ചു എന്ന് ഒരാൾക്ക് തോന്നാം, നൂറ് വർഷം താമസിച്ചെന്ന് പറയപ്പെടുകയും ചെയ്യാം.",
 p3:"ഇതുവരെ ജീവിച്ചിരുന്ന എല്ലാ മനുഷ്യരും ഇപ്പോൾ ബർസഖിലാണ് — എല്ലാ പ്രവാചകന്മാരും, എല്ലാ സ്വഹാബികളും, നിന്റെ മുതുമുത്തച്ഛന്മാർ എല്ലാവരും. ഏറ്റവും കൂടുതൽ ജനസംഖ്യയുള്ള സ്ഥലമാണത്, അവരിൽ ആർക്കും ഒരു വാർത്തയും അയക്കാനാവാത്ത ഏക സ്ഥലവും.",
 had:"ഖബ്ർ പരലോക ഘട്ടങ്ങളിലെ ആദ്യത്തെ ഘട്ടമാണ്. അതിൽ നിന്ന് രക്ഷപ്പെട്ടവന് പിന്നീടുള്ളത് എളുപ്പമാകും — രക്ഷപ്പെടാത്തവന് പിന്നീടുള്ളത് കൂടുതൽ പ്രയാസമാകും.",
 ay:"അവരുടെ പിന്നിൽ അവർ ഉയിർത്തെഴുന്നേൽപ്പിക്കപ്പെടുന്ന ദിവസം വരെ ഒരു മറയുണ്ട്.",
 know:"ഒന്നും സംഭവിക്കാത്ത ഒരു ഇടവേളയല്ല ബർസഖ്. ഫലങ്ങൾ തുടങ്ങുന്നിടമാണ് — അതുകൊണ്ടാണ് നബി ﷺ അതിനെ ഘട്ടങ്ങൾക്ക് മുമ്പുള്ള വിടവ് എന്നല്ല, ആദ്യത്തെ ഘട്ടം എന്ന് വിളിച്ചത്.",
 you:"നീ ഒരിക്കലെങ്കിലും ഓർക്കാൻ പോകുന്ന എല്ലാവരും ഇതിനകം അവിടെയുണ്ട്. നിന്നെ ഓർക്കാൻ പോകുന്ന എല്ലാവരും പിന്നാലെ വരും. ഇവ രണ്ടിനുമിടയിൽ സഞ്ചരിക്കുന്ന ഒരേയൊരു കാര്യം ദുആയാണ്."
},
{
 t:"രണ്ട് ചോദ്യകർത്താക്കൾ", ar:"سُؤَالُ الْقَبْر",
 lede:"മൂന്ന് ചോദ്യം. എല്ലാവരോടും കൃത്യമായി ഈ മൂന്നെണ്ണം തന്നെ.",
 cap:"പുതിയ ഒരു ഖബ്‌റിൽ നിന്ന് അകലുന്ന അവസാന കാൽപ്പാടുകൾ.",
 p1:"മറവ് ചെയ്ത് അവസാന കാലടികൾ അകന്നുപോകുമ്പോൾ — അവരുടെ ചെരിപ്പിന്റെ ശബ്ദം മരിച്ചയാൾ കേൾക്കുമെന്ന് നബി ﷺ പറഞ്ഞു — രണ്ട് മലക്കുകൾ വന്ന് ആത്മാവിനെ ഇരുത്തുന്നു.",
 p2:"അവർ ചോദിക്കും: <mark>നിന്റെ റബ്ബ് ആരാണ്? നിന്റെ ദീൻ എന്താണ്? നിങ്ങൾക്കിടയിലേക്ക് അയക്കപ്പെട്ട ഈ മനുഷ്യൻ ആരാണ്?</mark> വിശ്വാസി ഉത്തരം പറയും. അശ്രദ്ധനായവൻ പറയും: <i>ഹാ, ഹാ — എനിക്കറിയില്ല. ആളുകൾ എന്തോ പറയുന്നത് കേട്ടു, ഞാനും അത് പറഞ്ഞു.</i>",
 p3:"ആ നിമിഷത്തിൽ ഈ ഉത്തരങ്ങൾ പഠിക്കാനാവില്ല എന്ന് ശ്രദ്ധിക്കൂ. അവ വിവരങ്ങളല്ല. ഒരാൾ എങ്ങനെ ജീവിച്ചു എന്നതിന്റെ ഫലമാണ്.",
 had:"ദാസൻ ഖബ്‌റിൽ വെക്കപ്പെടുകയും കൂട്ടുകാർ തിരിഞ്ഞുപോകുകയും ചെയ്യുമ്പോൾ — അവരുടെ ചെരിപ്പിന്റെ ശബ്ദം അവൻ കേൾക്കും — രണ്ട് മലക്കുകൾ അവന്റെ അടുത്ത് വരും.",
 ay:"വിശ്വസിച്ചവരെ ഉറച്ച വചനം കൊണ്ട് അല്ലാഹു ഉറപ്പിച്ചുനിർത്തുന്നു.",
 know:"ഈ ആയത്ത് ഖബ്‌റിലെ ചോദ്യത്തെക്കുറിച്ചാണെന്ന് സ്വഹാബികൾ മനസ്സിലാക്കി. അതുകൊണ്ടാണ് മറവ് ചെയ്ത ശേഷം പുതിയ ഖബ്‌റിനരികിൽ നിന്ന് അവിടുന്ന് പറഞ്ഞത്: <b>ഇവന് ഉറപ്പ് നൽകാൻ അല്ലാഹുവോട് ചോദിക്കൂ, ഇവൻ ഇപ്പോൾ ചോദ്യം ചെയ്യപ്പെടുകയാണ്.</b>",
 you:"ഇതിന് നിനക്ക് പഠിച്ചൊരുങ്ങാനാവില്ല. മൂന്നാമത്തെ ചോദ്യം നീ പിന്തുടരുന്നു എന്ന് പറയുന്ന ഒരു മനുഷ്യനെക്കുറിച്ചാണ് — ഉത്തരം പുറത്തുവരുന്നത് നീ സ്വയം വിശേഷിപ്പിച്ച രീതിയിലല്ല, നീ ശരിക്കും ജീവിച്ച രീതിയിലായിരിക്കും."
},
{
 t:"ഒരു തോട്ടമോ ഒരു കുഴിയോ", ar:"رَوْضَةٌ أَوْ حُفْرَة",
 lede:"ഖബ്ർ ഒരു കാത്തിരിപ്പുമുറിയല്ല. അതിൽ ഇതിനകം എന്തോ നടക്കുന്നുണ്ട്.",
 cap:"ഒരേ ഇരുണ്ട ചുമരിലെ രണ്ട് വാതിലുകൾ.",
 p1:"നന്നായി ഉത്തരം പറഞ്ഞവന് ഖബ്ർ കണ്ണെത്താദൂരത്തോളം വിശാലമാക്കപ്പെടും, സ്വർഗത്തിലേക്ക് ഒരു വാതിൽ തുറക്കപ്പെടും, അതിന്റെ വായുവും സുഗന്ധവും അവനിലേക്ക് എത്തും. അവൻ പറയും: <i>എന്റെ റബ്ബേ, അന്ത്യദിനം സ്ഥാപിക്കേണമേ, ഞാൻ എന്റെ കുടുംബത്തിലേക്ക് മടങ്ങട്ടെ.</i>",
 p2:"ഉത്തരം പറയാത്തവന് വാരിയെല്ലുകൾ പരസ്പരം കോർക്കുന്നതുവരെ മണ്ണ് ഞെരുക്കും. അവൻ പറയും: <i>എന്റെ റബ്ബേ, അന്ത്യദിനം സ്ഥാപിക്കരുതേ.</i>",
 p3:"ഒരിക്കൽ രണ്ട് ഖബ്‌റുകൾക്കരികിലൂടെ കടന്നുപോകുമ്പോൾ അവിടുന്ന് പറഞ്ഞു അവർ ശിക്ഷിക്കപ്പെടുകയാണെന്ന് — വലിയ ഒരു കാര്യത്തിന്റെ പേരിലല്ല. <mark>ഒരാൾ മൂത്രത്തിൽ നിന്ന് ശുദ്ധി സൂക്ഷിക്കുന്നതിൽ അശ്രദ്ധനായിരുന്നു; മറ്റെയാൾ ആളുകൾക്കിടയിൽ ഏഷണി പറഞ്ഞുനടന്നു.</mark>",
 had:"അവന്റെ സ്ഥാനം രാവിലെയും വൈകുന്നേരവും അവന് കാണിക്കപ്പെടും — സ്വർഗക്കാരനാണെങ്കിൽ സ്വർഗക്കാരുടേത്, നരകക്കാരനാണെങ്കിൽ നരകക്കാരുടേത്.",
 ay:"നരകം — രാവിലെയും വൈകുന്നേരവും അവർ അതിന് മുന്നിൽ പ്രദർശിപ്പിക്കപ്പെടുന്നു.",
 know:"ആ രണ്ട് ഖബ്‌റുകൾ ചെറിയ കാര്യങ്ങളെക്കുറിച്ചുള്ള താക്കീതാണ്. ഏഷണിയും ശുദ്ധിയിലെ അശ്രദ്ധയും ആളുകൾ ശിക്ഷ പ്രതീക്ഷിക്കുന്ന പാപങ്ങളല്ല — അതുകൊണ്ടാണ് അവിടുന്ന് അവ പ്രത്യേകം പറഞ്ഞത്.",
 you:"നിന്നെ ഉപദ്രവിക്കുന്നത് നീ കാവൽ നിൽക്കുന്ന വലിയ പാപമാകണമെന്നില്ല. അത് നിന്റെ നാവാകാം — മുറിയിലില്ലാത്ത ആളുകളെക്കുറിച്ച് നീ സംസാരിക്കുന്ന രീതിയാകാം."
},
{
 t:"കാഹളം", ar:"النَّفْخَةُ الأُولَى",
 lede:"ഒരൊറ്റ ശബ്ദം, നിലനിൽക്കുന്നതെല്ലാം നിലയ്ക്കുന്നു.",
 cap:"പ്രഭാതത്തിൽ പാതിവഴിയിൽ നിലച്ചുപോയ ഒരു ചന്ത.",
 p1:"സൃഷ്ടിക്കപ്പെട്ട നാൾ മുതൽ ഇസ്‌റാഫീൽ കാഹളം ചുണ്ടോട് ചേർത്ത്, കൽപ്പനയ്ക്കായി കാത്ത്, കണ്ണുകൾ അർശിൽ ഉറപ്പിച്ച് നിൽക്കുന്നു.",
 p2:"അത് ഊതപ്പെടുമ്പോൾ ആകാശങ്ങളിലും ഭൂമിയിലുമുള്ള എല്ലാവരും മരിച്ചുവീഴും, അല്ലാഹു ഉദ്ദേശിച്ചവരൊഴികെ. ഒരു ജനതയല്ല, ഒരു ജീവിവർഗമല്ല — <mark>എല്ലാം</mark>.",
 p3:"സാധാരണ ജീവിതത്തിൽ പെട്ടുപോകുന്ന ആളുകളെ ഖുർആൻ വിവരിക്കുന്നു: ഒരാൾ ചന്തയിൽ തർക്കിക്കുന്നു, ഒരാൾ ഭക്ഷണം വായിലേക്ക് ഉയർത്തിയിരിക്കുന്നു, ഒരാൾ മേൽക്കൂര നന്നാക്കുന്നു. ചെയ്തുകൊണ്ടിരുന്നത് പൂർത്തിയാക്കാൻ ആർക്കും കഴിയില്ല.",
 had:"കാഹളത്തിന്റെ ഉടമ അത് കൈയിലെടുത്ത്, നെറ്റി താഴ്ത്തി, ഊതാൻ അനുവാദം കിട്ടാൻ കാതോർത്ത് നിൽക്കുമ്പോൾ ഞാൻ എങ്ങനെ സ്വസ്ഥനായിരിക്കും?",
 ay:"കാഹളം ഊതപ്പെടും, അപ്പോൾ ആകാശങ്ങളിലും ഭൂമിയിലുമുള്ളവർ മരിച്ചുവീഴും.",
 know:"ആ ഹദീസ് കേട്ടപ്പോൾ എന്ത് പറയണമെന്ന് സ്വഹാബികൾ ചോദിച്ചു. അവിടുന്ന് പറഞ്ഞു: <b>ഹസ്ബുനല്ലാഹു വ നിഅ്മൽ വകീൽ</b> — അല്ലാഹു ഞങ്ങൾക്ക് മതി, അവൻ എത്ര നല്ല കൈകാര്യകർത്താവ്.",
 you:"ഇപ്പോൾ നിന്നെ ആകുലപ്പെടുത്തുന്നത് എന്തായാലും — ഒരു പരീക്ഷ, ഒരു വഴക്ക്, ആരോ പറഞ്ഞ ഒരു വാക്ക് — ഒരു വാക്യത്തിന്റെ നടുവിൽ അത് അവസാനിക്കും."
},
{
 t:"വീണ്ടും എഴുന്നേൽക്കുന്നു", ar:"النَّفْخَةُ الثَّانِيَة",
 lede:"നഗ്നപാദരായി. മറയില്ലാതെ. ആദ്യം വന്നതുപോലെ തന്നെ.",
 cap:"പ്രഭാതവെളിച്ചത്തിൽ അവസാനമില്ലാത്ത ഒരു സമതലം.",
 p1:"അല്ലാഹുവിന് മാത്രം അറിയാവുന്ന ഒരു കാലയളവിന് ശേഷം കാഹളം രണ്ടാമതും ഊതപ്പെടും, മനുഷ്യരാശി മുഴുവൻ മണ്ണിൽ നിന്ന് എഴുന്നേറ്റ് ചുറ്റും നോക്കും.",
 p2:"നാം <mark>നഗ്നപാദരായി, വസ്ത്രമില്ലാതെ, ചേലാകർമം ചെയ്യാത്തവരായി</mark> — ആദ്യം സൃഷ്ടിക്കപ്പെട്ടതുപോലെ തന്നെ — ഒരുമിച്ചുകൂട്ടപ്പെടുമെന്ന് അവിടുന്ന് പറഞ്ഞു. പുരുഷന്മാരും സ്ത്രീകളും പരസ്പരം നോക്കുമോ എന്ന് ആഇശ (റ) ചോദിച്ചു. അവിടുന്ന് മറുപടി പറഞ്ഞു: <i>കാര്യം അതിനെക്കാൾ എത്രയോ ഗുരുതരമാണ്.</i>",
 p3:"ആരും മറ്റാരെയും കുറിച്ച് ചിന്തിക്കില്ല. ആദ്യമായി വസ്ത്രം ധരിപ്പിക്കപ്പെടുന്നത് ഇബ്രാഹീം (അ) ആയിരിക്കും.",
 had:"നിങ്ങൾ നഗ്നപാദരായി, വസ്ത്രമില്ലാതെ, ചേലാകർമം ചെയ്യാത്തവരായി ഒരുമിച്ചുകൂട്ടപ്പെടും.",
 ay:"ആദ്യ സൃഷ്ടി നാം തുടങ്ങിയതുപോലെ അത് നാം ആവർത്തിക്കും.",
 know:"ഒരാൾ ജീവിതം മുഴുവൻ സമ്പാദിച്ചതെല്ലാം — വസ്ത്രം, സമ്പത്ത്, സ്ഥാനം, ഫോളോവേഴ്സ്, കൈയിലുള്ള ഫോൺ — മണ്ണിൽ തന്നെ കിടക്കും. കൂടെ കടന്നുപോകുന്നത് രേഖ മാത്രമാണ്.",
 you:"നിനക്ക് സ്വന്തമായുള്ള ഓരോ സാധനവും ഒരു ദിവസം നീ ഒരു മുറിയിൽ ഉപേക്ഷിക്കും. നീ ശരിക്കും എന്താണ് പണിതുകൊണ്ടിരിക്കുന്നതെന്ന് ചോദിക്കൂ."
},
{
 t:"ഒരുമിച്ചുകൂട്ടൽ", ar:"الْمَحْشَر",
 lede:"സൂര്യൻ അടുപ്പിക്കപ്പെടും, തണൽ കൃത്യമായി ഏഴ് കൂട്ടർക്ക് മാത്രം.",
 cap:"കത്തുന്ന നിലത്ത് ഒരൊറ്റ തണൽ.",
 p1:"സൃഷ്ടികളെല്ലാം ഒരൊറ്റ സമതലത്തിൽ ഒരുമിച്ചുകൂട്ടപ്പെടും. സൂര്യൻ അടുപ്പിക്കപ്പെടും, ആളുകൾ സ്വന്തം വിയർപ്പിൽ നിൽക്കും — ചിലർക്ക് നെരിയാണി വരെ, ചിലർക്ക് അരവരെ, ചിലർ അതിൽ മുങ്ങും, ഓരോരുത്തരും കർമമനുസരിച്ച്.",
 p2:"അന്ന് അല്ലാഹുവിന്റെ അർശിന്റെ തണലല്ലാതെ ഒരു തണലുമില്ല, അതിന് കീഴിൽ ആരൊക്കെയാണെന്ന് അവിടുന്ന് കൃത്യമായി പറഞ്ഞു.",
 p3:"പട്ടിക ശ്രദ്ധിച്ച് വായിക്കൂ. ഏഴിൽ ഒരാൾ പോലും പണ്ഡിതനോ നേതാവോ ധനികനോ ആയതുകൊണ്ട് മാത്രം അതിൽ വന്നതല്ല. അവർ സാധാരണ ആളുകളാണ്, രഹസ്യമായതും പ്രയാസമുള്ളതും ആരും പുകഴ്ത്താത്തതുമായ കാര്യങ്ങൾ ചെയ്യുന്നവർ — അതിൽ <mark>അല്ലാഹുവിനെ ആരാധിച്ച് വളർന്ന ഒരു യുവാവും</mark> ഉണ്ട്.",
 had:"തണലില്ലാത്ത ദിവസം അല്ലാഹു തന്റെ തണലിൽ ഏഴ് പേരെ തണലിടും: നീതിമാനായ ഭരണാധികാരി; അല്ലാഹുവിന്റെ ആരാധനയിൽ വളർന്ന യുവാവ്; ഹൃദയം പള്ളിയോട് ചേർന്നുനിൽക്കുന്നവൻ; അല്ലാഹുവിന് വേണ്ടി പരസ്പരം സ്നേഹിക്കുന്ന രണ്ട് പേർ; പ്രലോഭനം വന്നപ്പോൾ <i>ഞാൻ അല്ലാഹുവിനെ ഭയപ്പെടുന്നു</i> എന്ന് പറഞ്ഞവൻ; വലതു കൈ നൽകിയത് ഇടതു കൈ അറിയാത്തത്ര രഹസ്യമായി ദാനം ചെയ്യുന്നവൻ; ഒറ്റയ്ക്കിരുന്ന് അല്ലാഹുവിനെ ഓർത്ത് കണ്ണ് നിറയുന്നവൻ.",
 ay:"ലോകരക്ഷിതാവിന് മുന്നിൽ മനുഷ്യർ നിൽക്കുന്ന ദിവസം.",
 know:"ഏഴിൽ രണ്ടാമത്തേതാണ് ഒരു വിദ്യാർത്ഥിക്ക് നേരിട്ട് ലഭ്യമായത്. ആരാധനയിൽ വളരുക എന്നത് ഒരു നാടകീയ പ്രവൃത്തിയല്ല — ആരും പുകഴ്ത്താത്ത പതിനഞ്ച് വർഷത്തെ സാധാരണ സുബ്ഹി നിസ്കാരങ്ങളാണ്.",
 you:"ആരും നോക്കാത്തപ്പോഴും ആരാധന തുടർന്ന നിന്റെ പ്രായത്തിലുള്ള ഒരാൾക്ക് അർശിന്റെ കീഴിൽ ഒരു സ്ഥാനം മാറ്റിവെച്ചിട്ടുണ്ട്. ആ സ്ഥാനം ഇപ്പോൾ ഒഴിഞ്ഞുകിടക്കുന്നു."
},
{
 t:"നീണ്ട കാത്തിരിപ്പ്", ar:"طُولُ الْمَوْقِف",
 lede:"മനുഷ്യർ ഓരോ പ്രവാചകന്റെയും അടുത്ത് ചെല്ലും, ഓരോരുത്തരും പറയും: ഞാനല്ല.",
 cap:"അടഞ്ഞ വാതിലുകളുടെ ഒരു നീണ്ട ഇടനാഴി.",
 p1:"നിൽപ്പ് സഹിക്കാനാവാത്തത്ര നീളുമ്പോൾ, വിധി തുടങ്ങാനെങ്കിലും ശുപാർശ ചെയ്യാൻ ഒരാളെ അവർ തിരയും.",
 p2:"അവർ ആദമിന്റെ അടുത്ത് ചെല്ലും, അദ്ദേഹം പറയും: നൂഹിന്റെ അടുത്ത് പോകൂ. നൂഹ്: ഇബ്രാഹീമിന്റെ അടുത്ത് പോകൂ. ഇബ്രാഹീം: മൂസായുടെ അടുത്ത് പോകൂ. മൂസാ: ഈസായുടെ അടുത്ത് പോകൂ. ഈസാ പറയും: <mark>മുഹമ്മദ് ﷺ യുടെ അടുത്ത് പോകൂ.</mark>",
 p3:"ഇവരോരോരുത്തരും ഏറ്റവും ഉയർന്ന പദവിയിലുള്ള പ്രവാചകന്മാരാണ്, ഓരോരുത്തരും സ്വന്തം ജീവിതത്തിലെ ഒരു നിമിഷം ഓർത്ത് പറയും <i>നഫ്സീ നഫ്സീ</i> — ഞാൻ, ഞാൻ. അന്ന് ആരും മറ്റാരെയും കുറിച്ച് ചിന്തിക്കുന്നില്ല.",
 had:"അവർ എന്റെ അടുത്ത് വരും, ഞാൻ പറയും: ഞാനാണ് അതിന്, ഞാനാണ് അതിന്. പിന്നെ ഞാൻ എന്റെ റബ്ബിനോട് അനുവാദം ചോദിക്കും, അനുവാദം നൽകപ്പെടും.",
 ay:"ഒരു മനുഷ്യൻ തന്റെ സഹോദരനിൽ നിന്ന് ഓടിയൊളിക്കുന്ന ദിവസം.",
 know:"ഇതാണ് ശഫാഅത്തിന്റെ ഹദീസ്, ബുഖാരിയിലും മുസ്‌ലിമിലുമുള്ള ഏറ്റവും നീണ്ട ഹദീസുകളിലൊന്ന്. നബി ﷺ യുടെ പദവിയെക്കുറിച്ചുള്ള മുസ്‌ലിം ധാരണ വരുന്നത് ഇവിടെ നിന്നാണ് — സ്തുതികളിൽ നിന്നല്ല, മറ്റെല്ലാ പ്രവാചകനും പിന്മാറുന്ന ഒരു രംഗത്തിൽ നിന്ന്.",
 you:"നിനക്ക് ഏറ്റവും ആവശ്യമുള്ള ആ ഒരു ദിവസം, നിന്റെ മാതാപിതാക്കൾക്ക് സഹായിക്കാനാവില്ല, കൂട്ടുകാർക്ക് നിന്റെ പേര് പോലും അറിയില്ല. ആരോടാണ് നീ ചേർന്നുനിൽക്കുന്നത് എന്ന് ഇപ്പോൾ തിരഞ്ഞെടുക്കൂ."
}
,{
 t:"മഹത്തായ ശുപാർശ", ar:"الشَّفَاعَةُ الْعُظْمَىٰ",
 lede:"അവിടുന്ന് സുജൂദിൽ വീഴും, പറയപ്പെടും: തല ഉയർത്തൂ, ചോദിക്കൂ.",
 cap:"സുജൂദ് ചെയ്യുന്ന ഒഴിഞ്ഞ ഇടത്തിലേക്ക് വീഴുന്ന വെളിച്ചം.",
 p1:"അവർ അവിടുത്തെ അടുത്ത് വരുമ്പോൾ അവിടുന്ന് നിരസിക്കുന്നില്ല. അവിടുന്ന് പറയും: <mark>അനാ ലഹാ</mark> — ഞാനാണ് അതിന്.",
 p2:"അവിടുന്ന് അർശിന് കീഴിൽ ചെന്ന് സുജൂദിൽ വീഴും, അതുവരെ പഠിപ്പിക്കപ്പെട്ടിട്ടില്ലാത്ത സ്തുതികൾ അല്ലാഹു അവിടുത്തേക്ക് തുറന്നുകൊടുക്കും. <i>തല ഉയർത്തൂ; ചോദിക്കൂ, നിനക്ക് നൽകപ്പെടും; ശുപാർശ ചെയ്യൂ, നിന്റെ ശുപാർശ സ്വീകരിക്കപ്പെടും</i> എന്ന് പറയപ്പെടുന്നതുവരെ അവിടുന്ന് അവിടെ കിടക്കും.",
 p3:"ഇതാണ് മഖാമ മഹ്മൂദ് — സ്തുതിക്കപ്പെട്ട സ്ഥാനം — ഓരോ ബാങ്കിനും ശേഷം ദിവസം അഞ്ച് നേരം, ജീവിതകാലം മുഴുവൻ, നാം അവിടുത്തേക്ക് വേണ്ടി പേരെടുത്ത് ചോദിക്കുന്നത്.",
 had:"ഞാൻ എന്റെ റബ്ബിന് മുന്നിൽ സുജൂദിൽ വീഴും, ഇപ്പോൾ എനിക്കറിയാത്ത സ്തുതികൾ അവൻ എനിക്ക് നൽകും. പിന്നെ പറയപ്പെടും: തല ഉയർത്തൂ, ചോദിക്കൂ നിനക്ക് നൽകപ്പെടും, ശുപാർശ ചെയ്യൂ നിന്റെ ശുപാർശ സ്വീകരിക്കപ്പെടും.",
 ay:"നിന്റെ റബ്ബ് നിന്നെ സ്തുതിക്കപ്പെട്ട ഒരു സ്ഥാനത്തേക്ക് ഉയർത്തിയേക്കാം.",
 know:"ഓരോ പ്രവാചകനും ഉത്തരം ഉറപ്പുള്ള ഒരു ദുആ നൽകപ്പെട്ടു, ഓരോരുത്തരും അത് ഈ ജീവിതത്തിൽ ഉപയോഗിച്ചു. അവിടുന്ന് തന്റേത് കരുതിവെച്ചു — അന്ത്യദിനത്തിൽ തന്റെ ഉമ്മത്തിനുള്ള ശഫാഅത്തായി അത് സൂക്ഷിച്ചുവെന്ന് അവിടുന്ന് പറഞ്ഞു.",
 you:"ഉത്തരം ഉറപ്പുള്ള ഒരു അപേക്ഷ അവിടുന്ന് നിനക്ക് വേണ്ടി കൈയിൽ വെച്ചിരിക്കുന്നു. ഇന്ന് രാത്രി അവിടുത്തേക്ക് സ്വലാത്ത് ചൊല്ലൂ. ഒരു അപരിചിതന് വേണ്ടി തന്റെ ഒരേയൊരു ആഗ്രഹം കരുതിവെച്ച ഒരാൾക്ക് നിനക്ക് ചെയ്യാവുന്ന ഏറ്റവും ചെറിയ കാര്യമാണത്."
},
{
 t:"ഹൗള്", ar:"الْحَوْض",
 lede:"ഒരിക്കലും കണ്ടിട്ടില്ലാത്ത ആളുകളെ കാത്ത് അവിടുന്ന് ഒരു ഹൗളിനരികിൽ നിൽക്കും.",
 cap:"നക്ഷത്രങ്ങൾ നിറഞ്ഞ ആകാശത്തിന് കീഴിൽ അനങ്ങാത്ത ഒരു ഹൗള്.",
 p1:"പാലത്തിന് മുമ്പ് അവിടുന്ന് തന്റെ ഹൗളിനരികിൽ നിൽക്കും — <mark>പാലിനെക്കാൾ വെളുത്ത, തേനിനെക്കാൾ മധുരമുള്ള</mark> വെള്ളം, കസ്തൂരിയെക്കാൾ നല്ല സുഗന്ധം, ആകാശത്തിലെ നക്ഷത്രങ്ങളോളം പാത്രങ്ങൾ. അതിൽ നിന്ന് കുടിക്കുന്നവന് പിന്നെ ഒരിക്കലും ദാഹിക്കില്ല.",
 p2:"വുദൂ കാരണം അവയവങ്ങളിലുള്ള പ്രകാശം കൊണ്ട് താൻ ഉമ്മത്തിനെ തിരിച്ചറിയുമെന്ന് അവിടുന്ന് പറഞ്ഞു — ഒരാൾ മറ്റുള്ളവയ്ക്കിടയിൽ സ്വന്തം കുതിരകളെ തിരിച്ചറിയുന്നതുപോലെ.",
 p3:"പക്ഷേ തന്റേതെന്ന് അവകാശപ്പെടുന്ന ചിലർ ആട്ടിയകറ്റപ്പെടുമെന്നും അവിടുന്ന് പറഞ്ഞു; അവിടുന്ന് പറയും <i>എന്റെ അനുചരന്മാർ, എന്റെ അനുചരന്മാർ</i> — പറയപ്പെടും: നിനക്ക് ശേഷം അവർ എന്ത് ചെയ്തുവെന്ന് നിനക്കറിയില്ല.",
 had:"എന്റെ ഹൗള് ഒരു മാസത്തെ വഴിദൂരമുള്ളതാണ്. അതിന്റെ വെള്ളം പാലിനെക്കാൾ വെളുത്തതാണ്, സുഗന്ധം കസ്തൂരിയെക്കാൾ നല്ലതാണ്, പാത്രങ്ങൾ ആകാശത്തിലെ നക്ഷത്രങ്ങൾ പോലെയാണ്. അതിൽ നിന്ന് കുടിക്കുന്നവന് പിന്നെ ഒരിക്കലും ദാഹിക്കില്ല.",
 ay:"തീർച്ചയായും നാം നിനക്ക് കൗഥർ നൽകിയിരിക്കുന്നു.",
 know:"ഹൗളിലേക്ക് വെള്ളം എത്തിക്കുന്ന സ്വർഗത്തിലെ ഒരു നദിയാണ് കൗഥർ. ഖുർആനിലെ ഏറ്റവും ചെറിയ സൂറ അതിനെക്കുറിച്ചാണ് — ജീവിച്ചിരിക്കുന്ന ആൺമക്കളില്ലെന്ന് ശത്രുക്കൾ പരിഹസിച്ചപ്പോൾ അവിടുത്തെ ആശ്വസിപ്പിക്കാൻ അവതരിച്ചത്.",
 you:"ഒരിക്കലും കണ്ടിട്ടില്ലാത്ത ആളുകൾക്ക് വേണ്ടി അവിടുന്ന് ആ ഹൗളിനരികിൽ കാത്തുനിൽക്കുന്നു. ചോദ്യം അവിടുന്ന് അവിടെ ഉണ്ടാകുമോ എന്നല്ല. നീ എത്തുമ്പോൾ അവിടുന്ന് നിന്നെ തിരിച്ചറിയുമോ എന്നാണ്."
},
{
 t:"ഏടുകൾ കൈമാറുന്നു", ar:"إِعْطَاءُ الصُّحُف",
 lede:"ഓരോ വാക്കും. ഓരോ സന്ദേശവും. ഒന്നും വിട്ടുപോകുന്നില്ല.",
 cap:"ഓരോ വരിയും നിറഞ്ഞ ഒരു തുറന്ന ഗ്രന്ഥം.",
 p1:"ഓരോരുത്തർക്കും ജീവിതത്തിന്റെ രേഖ കൈമാറപ്പെടും — വലതു കൈയിലോ, ഇടതു കൈയിലോ, പിന്നിലൂടെയോ.",
 p2:"വലതു കൈയിൽ വാങ്ങുന്നവൻ ചുറ്റുമുള്ള എല്ലാവരോടും വിളിച്ചുപറയും: <i>ഇതാ, എന്റെ രേഖ വായിക്കൂ!</i> മറ്റെയാൾ പറയും: എനിക്ക് ഇത് കിട്ടാതിരുന്നെങ്കിൽ.",
 p3:"അത് തുറക്കുന്ന ഒരാളുടെ പ്രതികരണം ഖുർആൻ വിവരിക്കുന്നു: <mark>ഇത് എന്തൊരു ഗ്രന്ഥം — ചെറുതോ വലുതോ ആയ ഒന്നും വിട്ടുകളയാതെ എല്ലാം എണ്ണിവെച്ചിരിക്കുന്നു.</mark> മന്ത്രിച്ച ഒരു വാക്ക്. വായിക്കാത്ത ഒരു സന്ദേശം. വാതിൽ അടച്ചപ്പോൾ ചെയ്തത്.",
 had:"അല്ലാഹു ഒരു വിശ്വാസിയെ അടുപ്പിച്ച് മറച്ചുവെച്ച് ചോദിക്കും: ഈ പാപം നിനക്കറിയാമോ? ഈ പാപം നിനക്കറിയാമോ? എല്ലാം സമ്മതിച്ച് താൻ നശിച്ചു എന്ന് അവൻ കരുതുന്നതുവരെ. അപ്പോൾ അല്ലാഹു പറയും: ദുൻയാവിൽ ഞാൻ അവ നിനക്ക് വേണ്ടി മറച്ചുവെച്ചു, ഇന്ന് ഞാൻ അവ നിനക്ക് പൊറുത്തുതരുന്നു.",
 ay:"രേഖ വെക്കപ്പെടും, അതിലുള്ളതിനെക്കുറിച്ച് കുറ്റവാളികൾ ഭയപ്പെടുന്നത് നീ കാണും.",
 know:"രണ്ട് മലക്കുകൾ ഇടതടവില്ലാതെ എഴുതുന്നു. വലതുഭാഗത്തുള്ളവൻ ഉടനെ എഴുതുന്നുവെന്നും ഇടതുഭാഗത്തുള്ളവൻ കാത്തിരിക്കുന്നുവെന്നും — ആ വ്യക്തി പശ്ചാത്തപിച്ചാലോ എന്ന് കരുതി — പണ്ഡിതന്മാർ പറയുന്നു. മനഃപൂർവം ഒരു ഇടവേള വെച്ചിരിക്കുന്നു.",
 you:"നിന്റെ ഇടതുവശത്തെ രേഖയിൽ അത് തിരിച്ചെടുക്കാൻ സമയം തരുന്ന ഒരു ഇടവേളയുണ്ട്. അത് ഉപയോഗിക്കൂ."
},
{
 t:"വിചാരണ", ar:"الْحِسَاب",
 lede:"ആദ്യം നിസ്കാരം. പിന്നെ ഒരു ജീവിതം മുഴുവൻ ഉൾക്കൊള്ളുന്ന നാല് ചോദ്യങ്ങൾ.",
 cap:"കല്ലിൽ കൊത്തിയ നാല് അടയാളങ്ങൾ.",
 p1:"വിധി തുടങ്ങും, ഒരു ദാസനോട് ആദ്യം ചോദിക്കപ്പെടുന്ന കാര്യം <mark>നിസ്കാരമാണ്</mark>. അത് നന്നായാൽ ബാക്കി നോക്കപ്പെടും. അത് കേടായാൽ ബാക്കിയും കേടാകും.",
 p2:"പിന്നെ നാല് ചോദ്യങ്ങൾ: <b>ആയുസ്സ് — എങ്ങനെ ചെലവഴിച്ചു. യൗവനം — എങ്ങനെ ഉപയോഗിച്ചു. സമ്പത്ത് — എവിടെ നിന്ന് നേടി, എവിടെ ചെലവഴിച്ചു. അറിവ് — അതുകൊണ്ട് എന്ത് ചെയ്തു.</b>",
 p3:"ആയുസ്സിനുള്ളിൽ തന്നെ ഉൾപ്പെട്ടിട്ടും യൗവനത്തെക്കുറിച്ച് പ്രത്യേകം ചോദിക്കുന്നു. ഏറ്റവും എളുപ്പം പാഴാക്കപ്പെടുന്ന ഭാഗമായതുകൊണ്ട് അത് രണ്ട് തവണ എണ്ണപ്പെടുന്നു.",
 had:"നാല് കാര്യങ്ങളെക്കുറിച്ച് ചോദിക്കപ്പെടാതെ അന്ത്യദിനത്തിൽ ഒരു ദാസന്റെയും കാലുകൾ ചലിക്കുകയില്ല: ആയുസ്സ് എങ്ങനെ ചെലവഴിച്ചു, യൗവനം എങ്ങനെ ഉപയോഗിച്ചു, സമ്പത്ത് എങ്ങനെ നേടി എവിടെ ചെലവഴിച്ചു, അറിവുകൊണ്ട് എന്ത് ചെയ്തു.",
 ay:"ആരെങ്കിലും ഒരു അണുമണിത്തൂക്കം നന്മ ചെയ്താൽ അവൻ അത് കാണും.",
 know:"ആളുകൾ തമ്മിലുള്ള വിചാരണയുമുണ്ട്. നിസ്കാരവും നോമ്പും സകാത്തുമായി എത്തിയിട്ടും ആളുകളെ അധിക്ഷേപിക്കുകയും അടിക്കുകയും വഞ്ചിക്കുകയും ചെയ്ത, നന്മകൾ തീരുന്നതുവരെ അവർക്ക് കൈമാറേണ്ടിവരുന്ന ഒരു പാപ്പരായവനെക്കുറിച്ച് അവിടുന്ന് വിവരിച്ചു.",
 you:"നീ ഇപ്പോൾ ജീവിക്കുന്ന ഈ വർഷങ്ങളെക്കുറിച്ച് കൃത്യമായി രണ്ട് തവണ ചോദിക്കപ്പെടുന്നു. നാൽപ്പതുകളെക്കുറിച്ച് ആരോടും രണ്ട് തവണ ചോദിക്കുന്നില്ല."
},
{
 t:"തുലാസ്", ar:"الْمِيزَان",
 lede:"നാവിന് ഭാരമില്ലാത്ത, തുലാസിൽ ഭാരമുള്ള രണ്ട് വാക്കുകൾ.",
 cap:"ഒരു തട്ട് താഴ്ന്നുനിൽക്കുന്ന ഒരു തുലാസ്.",
 p1:"യഥാർത്ഥ ഒരു തുലാസ് സ്ഥാപിക്കപ്പെടും, കർമങ്ങൾ പൂർണ നീതിയോടെ തൂക്കപ്പെടും — <i>ഒരാളോടും ഒട്ടും അനീതി കാണിക്കപ്പെടില്ല.</i>",
 p2:"<mark>തുലാസിൽ വെക്കപ്പെടുന്നതിൽ ഏറ്റവും ഭാരമുള്ളത് സൽസ്വഭാവമാണ്</mark> എന്ന് അവിടുന്ന് പറഞ്ഞു, നാവിന് ഭാരമില്ലാത്തതും തുലാസിൽ ഭാരമുള്ളതും പരമകാരുണികന് പ്രിയപ്പെട്ടതുമായ രണ്ട് വാക്യങ്ങളും പറഞ്ഞു.",
 p3:"കണ്ണെത്താദൂരത്തോളം പാപങ്ങളുടെ രേഖയുള്ള, ശഹാദത്ത് എഴുതിയ ഒരൊറ്റ കാർഡ് നൽകപ്പെടുന്ന ഒരാളുടെ ഹദീസുണ്ട്. ആ കാർഡ് എല്ലാറ്റിനെയും തൂക്കിക്കവിയുന്നു.",
 had:"നാവിന് ഭാരമില്ലാത്ത, തുലാസിൽ ഭാരമുള്ള, പരമകാരുണികന് പ്രിയപ്പെട്ട രണ്ട് വാക്യങ്ങൾ: സുബ്ഹാനല്ലാഹി വ ബിഹംദിഹ്, സുബ്ഹാനല്ലാഹിൽ അളീം.",
 ay:"അന്ത്യദിനത്തിൽ നീതിയുടെ തുലാസുകൾ നാം സ്ഥാപിക്കും.",
 know:"വിശ്വാസിയുടെ തുലാസിൽ സൽസ്വഭാവത്തെക്കാൾ ഭാരമുള്ള ഒന്നുമില്ലെന്നും അവിടുന്ന് പറഞ്ഞു. ആളുകളോട് നീ പെരുമാറുന്ന രീതി മിക്കവരും കരുതുന്നതിനെക്കാൾ ഭാരമുള്ളതാണ്.",
 you:"രണ്ട് വാക്യം, പത്ത് സെക്കൻഡ്, വർഷങ്ങൾ അധ്വാനിച്ച് നേടുന്നതിനെക്കാൾ ഭാരമുള്ളത്. താൾ മറിക്കുന്നതിന് മുമ്പ് നിനക്ക് അത് ചൊല്ലാം."
},
{
 t:"പാലം", ar:"الصِّرَاط",
 lede:"എല്ലാവരും കടക്കും. എല്ലാവരും ഒരേ വേഗത്തിലല്ല.",
 cap:"ഇരുട്ടിന് മുകളിലൂടെയുള്ള ഇടുങ്ങിയ ഒരു പാലം.",
 p1:"സ്വിറാത്ത് നരകത്തിന് മുകളിൽ സ്ഥാപിക്കപ്പെടും, ഓരോ മനുഷ്യനും അതിലൂടെ കടക്കും. അതിന്റെ വശങ്ങളിൽ കൊളുത്തുകളുണ്ട്, കർമങ്ങൾക്കനുസരിച്ച് ആളുകൾ പിടിക്കപ്പെടും.",
 p2:"<mark>കണ്ണിമവെട്ടുന്നതുപോലെ, മിന്നൽ പോലെ, കാറ്റ് പോലെ, വേഗമുള്ള കുതിര പോലെ, ഓടുന്ന മനുഷ്യൻ പോലെ</mark> — ആളുകൾ കടക്കുന്നത് അവിടുന്ന് വിവരിച്ചു; ചിലർ ഇഴഞ്ഞ്, അവസാനത്തെയാൾ വലിച്ചിഴയ്ക്കപ്പെട്ട്.",
 p3:"ഇതിനിടയിലെല്ലാം പ്രവാചകന്മാർ ഒരൊറ്റ ദുആ മാത്രം പറഞ്ഞുകൊണ്ട് നിൽക്കും: <i>അല്ലാഹുമ്മ സല്ലിം, സല്ലിം</i> — അല്ലാഹുവേ, രക്ഷ നൽകേണമേ, രക്ഷ നൽകേണമേ.",
 had:"നരകത്തിന് മുകളിൽ പാലം സ്ഥാപിക്കപ്പെടും, തന്റെ ഉമ്മത്തുമായി ആദ്യം കടക്കുന്ന ദൂതൻ ഞാനായിരിക്കും. അന്ന് ദൂതന്മാരല്ലാതെ ആരും സംസാരിക്കില്ല, അവരുടെ വാക്ക്: അല്ലാഹുവേ, രക്ഷ നൽകേണമേ, രക്ഷ നൽകേണമേ.",
 ay:"നിങ്ങളിൽ അതിലൂടെ കടന്നുപോകാത്ത ആരുമില്ല.",
 know:"ഒരാൾ കടക്കുന്നത് സ്വന്തം കർമങ്ങളുടെ വെളിച്ചത്തിലാണ് — ചിലർക്ക് മുന്നിൽ ഒരു മല പോലെ വെളിച്ചം, ചിലർക്ക് കാൽവിരലിന്റെ അത്രമാത്രം, അതും കത്തിയും അണഞ്ഞും. ഇരുട്ടിൽ പള്ളിയിലേക്ക് നടക്കുന്നവർക്ക് <b>പൂർണമായ വെളിച്ചം</b> അവിടുന്ന് സന്തോഷവാർത്ത അറിയിച്ചു.",
 you:"നീ ഏത് വേഗത്തിൽ കടക്കും എന്നത് ഇപ്പോൾ, ഇതുപോലുള്ള സാധാരണ ആഴ്ചകളിലാണ് തീരുമാനിക്കപ്പെടുന്നത്. അന്നത്തെ ദിവസം ആർക്കും വേഗം കൂടുന്നില്ല."
},
{
 t:"നരകം", ar:"النَّار",
 lede:"അവിടുന്ന് അത് വിവരിച്ചു, പിന്നെ കരഞ്ഞു — നാം അത് കാണേണ്ടിവരാതിരിക്കാൻ.",
 cap:"ചാരത്തിനിടയിൽ ഒരൊറ്റ കനൽ.",
 p1:"നരകം യഥാർത്ഥമാണ്, ആളുകളെ ഭയപ്പെടുത്താനല്ല വഴി തിരിക്കാനാണ് അവിടുന്ന് അതിനെക്കുറിച്ച് സംസാരിച്ചത്. നമുക്കറിയാവുന്ന തീയെക്കാൾ <mark>എഴുപത് ഇരട്ടി</mark> ചൂടുള്ളതായി അവിടുന്ന് വിവരിച്ചു.",
 p2:"അതിലേക്കുള്ള ചെറിയ വാതിലുകളെക്കുറിച്ച് അവിടുന്ന് താക്കീത് നൽകി: നാവ്, അഹങ്കാരം, കുടുംബബന്ധം മുറിക്കൽ, മറ്റുള്ളവരുടേത് എടുക്കൽ, നിസ്കാരം അവഗണിക്കൽ.",
 p3:"പക്ഷേ നരകത്തെക്കുറിച്ചുള്ള ഓരോ ഹദീസിനൊപ്പവും ഒരു പുറത്തുകടക്കൽ വഴിയുണ്ട്. ഒരൽപ്പം ഈമാനുമായി പ്രവേശിച്ചവർ ഒടുവിൽ പുറത്തുകൊണ്ടുവരപ്പെടും, ജീവന്റെ വെള്ളം കൊണ്ട് പുനഃസ്ഥാപിക്കപ്പെടും, <b>അൽ-ജഹന്നമിയ്യൂൻ</b> എന്ന് വിളിക്കപ്പെടും — ഒടുവിൽ അല്ലാഹു ആ പേരും അവരിൽ നിന്ന് നീക്കുന്നതുവരെ.",
 had:"ആദമിന്റെ മകൻ കത്തിക്കുന്ന നിങ്ങളുടെ ഈ തീ, നരകത്തിലെ തീയുടെ എഴുപതിൽ ഒരു ഭാഗമാണ്.",
 ay:"സത്യവിശ്വാസികളേ, നിങ്ങളെയും നിങ്ങളുടെ കുടുംബത്തെയും നരകത്തിൽ നിന്ന് കാക്കുക.",
 know:"അവിടുന്ന് പറഞ്ഞു: ആരെങ്കിലും മൂന്ന് തവണ അല്ലാഹുവോട് സ്വർഗം ചോദിച്ചാൽ സ്വർഗം പറയും: അല്ലാഹുവേ, അവനെ എന്നിലേക്ക് പ്രവേശിപ്പിക്കേണമേ. ആരെങ്കിലും മൂന്ന് തവണ നരകത്തിൽ നിന്ന് അഭയം തേടിയാൽ നരകം പറയും: അല്ലാഹുവേ, അവനെ എന്നിൽ നിന്ന് രക്ഷിക്കേണമേ. ചോദിക്കൽ തന്നെ രേഖപ്പെടുത്തപ്പെടുന്നു.",
 you:"<i>നിങ്ങളെയും നിങ്ങളുടെ കുടുംബത്തെയും</i> കാക്കുക എന്നാണ് ആയത്ത് പറയുന്നത്. നീ ഇത് എത്ര ഗൗരവത്തിലെടുക്കുന്നു എന്ന് നോക്കിനിൽക്കുന്ന ഇളയ സഹോദരനും അതിൽ വരും."
},
{
 t:"സ്വർഗം, പിന്നെ അതിലും നല്ലത്", ar:"الْجَنَّةُ وَالزِّيَادَة",
 lede:"നൂറ് പദവികൾ — പിന്നെ സ്വർഗത്തെക്കാൾ അവർക്ക് പ്രിയപ്പെട്ട ഒന്ന്.",
 cap:"പ്രഭാതത്തിൽ തുറന്നുകിടക്കുന്ന ഒരു കവാടം.",
 p1:"സ്വർഗത്തിന് നൂറ് പദവികളുണ്ട്, രണ്ടിനുമിടയിലെ അകലം ആകാശത്തിനും ഭൂമിക്കുമിടയിലുള്ളതുപോലെയാണ്. അവിടുന്ന് പറഞ്ഞു: അല്ലാഹുവോട് ചോദിക്കുമ്പോൾ <mark>അൽ-ഫിർദൗസ്</mark> ചോദിക്കൂ — ഏറ്റവും ഉയർന്നത്, സ്വർഗത്തിലെ നദികൾ ഉത്ഭവിക്കുന്നിടം.",
 p2:"അതിലുള്ള ഒന്നും ഇതുവരെ കാണപ്പെട്ടിട്ടില്ല, സങ്കൽപ്പിക്കപ്പെട്ടിട്ടുമില്ല. രോഗമില്ല, വാർധക്യമില്ല, ഭയമില്ല, തർക്കമില്ല, മടുപ്പില്ല, മരണവുമില്ല — മരണം തന്നെ കൊണ്ടുവന്ന് അറുക്കപ്പെടും, പ്രഖ്യാപിക്കപ്പെടും: <i>ശാശ്വതം, ഇനി മരണമില്ല.</i>",
 p3:"പിന്നെ, എല്ലാറ്റിനും ശേഷം, മറ ഉയർത്തപ്പെടും, അവർ തങ്ങളുടെ റബ്ബിന്റെ തിരുമുഖത്തേക്ക് നോക്കും. അവർക്ക് നൽകപ്പെട്ട ഒന്നും അതിനെക്കാൾ പ്രിയപ്പെട്ടതല്ലെന്ന് അവിടുന്ന് പറഞ്ഞു. അതാണ് <b>അസ്സിയാദ</b> — അധികം.",
 had:"അല്ലാഹു പറയുന്നു: എന്റെ സദ്‌വൃത്തരായ ദാസന്മാർക്ക് ഞാൻ ഒരുക്കിവെച്ചിരിക്കുന്നത് ഒരു കണ്ണും കണ്ടിട്ടില്ല, ഒരു കാതും കേട്ടിട്ടില്ല, ഒരു മനുഷ്യഹൃദയത്തിലും തോന്നിയിട്ടുമില്ല.",
 ay:"നന്മ ചെയ്തവർക്ക് ഏറ്റവും നല്ല പ്രതിഫലമുണ്ട് — പിന്നെ അധികവും.",
 know:"ആ ആയത്തിലെ <i>സിയാദ</i> എന്നാൽ അല്ലാഹുവിന്റെ തിരുമുഖത്തേക്ക് നോക്കലാണെന്ന് അവിടുന്ന് വിശദീകരിച്ചു. സ്വർഗത്തിലെ മറ്റെല്ലാം പ്രതിഫലമാണ്; ഇത് ആ പ്രതിഫലത്തിന് മുകളിലുള്ള അധികമാണ്.",
 you:"അൽ-ഫിർദൗസ് പേരെടുത്ത് ചോദിക്കൂ. അവിടുന്ന് അങ്ങനെ പറഞ്ഞിട്ടുണ്ട്. അതിന്റെ അരികല്ല, അതിൽ കുറച്ചല്ല — അതിലെ ഏറ്റവും ഉയർന്നത്. ശരിയായി ചോദിച്ചാൽ നിനക്ക് ഒന്നും നഷ്ടപ്പെടുന്നില്ല."
}
];

/* ================= BUILD ================= */
const strip=document.getElementById('strip'), rail=document.getElementById('rail'),
      dlist=document.getElementById('dlist'), noEl=document.getElementById('no'),
      lbl=document.getElementById('lbl'), prev=document.getElementById('prev'),
      next=document.getElementById('next'), hint=document.getElementById('hint'),
      book=document.getElementById('book'),
      langBtn=document.getElementById('langBtn'),
      drawerH=document.getElementById('drawerH'), drawerSub=document.getElementById('drawerSub');
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
const plate=im=> IMG==="ready"
  ? `<div class="plate"><img src="assets/img/${im.f}" alt="${im.cap}"><div class="cap">${im.cap}</div></div>`
  : `<div class="plate"><div class="ph">
       <div class="m"><span class="fn">${im.f}</span><span class="rt">${RATIO}</span></div>
       <div class="pr">${im.p}</div></div><div class="cap">${im.cap}</div></div>`;

const T={lang:"en"};
try{T.lang=localStorage.getItem('akh_lang')||"en";}catch(e){}
const tx=(k,en)=>T.lang==="ml"&&UI_ML[k]!=null?UI_ML[k]:en;
const M=i=>T.lang==="ml"&&ML_S[i]?ML_S[i]:null;

let meta=[];

function buildBook(){
  strip.innerHTML=""; rail.innerHTML=""; dlist.innerHTML=""; meta=[];
  document.body.classList.toggle("lang-ml",T.lang==="ml");
  document.documentElement.lang=T.lang;
  langBtn.textContent = T.lang==="ml" ? "English" : "മലയാളം";
  hint.textContent = tx("hint","drag the page →");
  drawerH.textContent = tx("contents","Contents");
  drawerSub.textContent = tx("contentsSub","Sixteen stations · four pages each");

  strip.appendChild(el(`<section class="page mid"><div class="inner">
    <img class="crest" src="/logo.png" alt="">
    <div class="car">الرِّحْلَةُ الأَخِيرَة</div>
    <div class="cen">THE LAST JOURNEY</div>
    <div class="meta">${tx("coverMeta","Sixteen stations, from the last breath to the Garden<br>Every ḥadīth referenced · Thazkiya · Level 3<br>ManzilulQuran E-learning Academy")}</div>
  </div></section>`));
  meta.push({s:0,l:tx("cover","Cover")});

  S.forEach((x,i)=>{
    const m=M(i), n=i+1;
    const t=m?m.t:x.t, lede=m?m.lede:x.lede, cap=m?m.cap:x.img.cap;
    const p1=m?m.p1:x.p1, p2=m?m.p2:x.p2, p3=m?m.p3:x.p3;
    const hq=m?m.had:x.had.q, ayM=m?m.ay:x.ay.m;
    const know=m?m.know:x.know, you=m?m.you:x.you;
    const media = IMG==="ready"
      ? `<div class="plate"><img src="assets/img/${x.img.f}" alt="${cap}"><div class="cap">${cap}</div></div>`
      : `<div class="plate"><div class="ph">
           <div class="m"><span class="fn">${x.img.f}</span><span class="rt">${RATIO}</span></div>
           <div class="pr">${x.img.p}</div></div><div class="cap">${cap}</div></div>`;

    strip.appendChild(el(`<section class="page"><div class="inner">
      <div class="kicker">${tx("station","Station")} ${n} ${tx("of","of")} ${S.length}</div>
      ${media}
      <h2>${t}</h2><div class="t-ar">${x.ar}</div>
      <div class="lede">${lede}</div>
    </div></section>`));
    strip.appendChild(el(`<section class="page"><div class="inner">
      <div class="kicker">${t}</div><div class="hr"></div>
      <p>${p1}</p><p>${p2}</p>
    </div></section>`));
    strip.appendChild(el(`<section class="page"><div class="inner">
      <div class="kicker">${t} — ${tx("evid","the evidence")}</div><div class="hr"></div>
      <p>${p3}</p>
      <div class="hq"><div class="q">“${hq}”</div>
        <div class="s">${x.had.s}<span class="g">${x.had.g}</span></div></div>
      <div class="ay"><div class="a">${x.ay.a}</div><div class="m">${ayM}</div><div class="r">${x.ay.r}</div></div>
    </div></section>`));
    strip.appendChild(el(`<section class="page"><div class="inner">
      <div class="kicker">${t} — ${tx("andyou","and you")}</div><div class="hr"></div>
      <p class="small">${know}</p>
      <div class="note"><div class="l">${tx("tagYou","CARRY THIS WITH YOU")}</div><p>${you}</p></div>
    </div></section>`));
    for(let k=0;k<4;k++) meta.push({s:n,l:t});
    rail.appendChild(el(`<i></i>`));
    dlist.appendChild(el(`<div class="dn" data-p="${1+i*4}"><span class="n">${n}</span>${t}</div>`));
  });

  strip.appendChild(el(`<section class="page mid"><div class="inner">
    <div class="kicker">${tx("endKick","The end of the journey")}</div>
    <h2>${tx("endH","Now go back and live")}</h2>
    <div class="fin">اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ<br>وَأَعُوذُ بِكَ مِنَ النَّارِ</div>
    <p class="small">${tx("endP","Nothing on this journey is decided on the journey. All of it is decided here — in ordinary weeks, in prayers nobody sees you pray, and in how you speak about people who are not in the room.")}</p>
  </div></section>`));
  meta.push({s:S.length,l:tx("endLast","The end")});
}

/* ================= PAGING ================= */
let LAST=0, cur=0, x0=0, dx=0, dragging=false, W=book.clientWidth;
function place(off){ strip.style.transform=`translate3d(${-cur*W+(off||0)}px,0,0)`; }
function rebuild(keep){ buildBook(); LAST=strip.children.length-1;
  cur=Math.max(0,Math.min(LAST,keep||0)); place(); paint(); }
function paint(){
  const m=meta[cur];
  noEl.textContent = m.s? m.s+" / "+S.length : "";
  lbl.textContent  = m.l;
  prev.disabled=cur===0; next.disabled=cur===LAST;
  Array.from(rail.children).forEach((r,k)=>{
    r.className = (k+1<m.s?"done":(k+1===m.s?"now":""));
  });
}
function go(i){ cur=Math.max(0,Math.min(LAST,i)); strip.classList.remove('drag'); place(); paint(); }

book.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0) return;
  dragging=true; x0=e.clientX; dx=0; W=book.clientWidth;
  strip.classList.add('drag'); book.setPointerCapture(e.pointerId);
});
book.addEventListener('pointermove',e=>{
  if(!dragging) return;
  dx=e.clientX-x0;
  if((cur===0&&dx>0)||(cur===LAST&&dx<0)) dx*=.32;   /* resistance at the ends */
  place(dx); hint.classList.add('gone');
});
function release(){
  if(!dragging) return;
  dragging=false; strip.classList.remove('drag');
  if(dx<-W*0.18) cur=Math.min(LAST,cur+1);
  else if(dx>W*0.18) cur=Math.max(0,cur-1);
  dx=0; place(); paint();
}
book.addEventListener('pointerup',release);
book.addEventListener('pointercancel',release);
book.addEventListener('pointerleave',release);

prev.addEventListener('click',()=>go(cur-1));
next.addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1);
});
window.addEventListener('resize',()=>{W=book.clientWidth;place();});

const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function shut(){drawer.classList.remove('on');scrim.classList.remove('on');}
document.getElementById('menuBtn').addEventListener('click',()=>{drawer.classList.add('on');scrim.classList.add('on');});
scrim.addEventListener('click',shut);
dlist.addEventListener('click',e=>{const t=e.target.closest('.dn');if(t){go(+t.dataset.p);shut();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')shut();});

langBtn.addEventListener('click',()=>{
  const at=cur;
  T.lang = T.lang==="ml" ? "en" : "ml";
  try{localStorage.setItem('akh_lang',T.lang);}catch(e){}
  rebuild(at);
  hint.classList.remove('gone'); setTimeout(()=>hint.classList.add('gone'),4000);
});
setTimeout(()=>hint.classList.add('gone'),6000);
rebuild(0);
</script>
</body>
</html>
