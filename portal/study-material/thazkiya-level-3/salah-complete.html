<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ṣalāh Complete · الصَّلَاة — ManzilulQuran</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600;700&family=Amiri:wght@400;700&family=Anek+Malayalam:wght@400;500;600;700&family=Baloo+Chettan+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFAF4; --edge:#E4DCC8;
  --ink:#22302B; --soft:#5F7268;
  --em:#0B4D3B; --em-l:#D9E8E1;
  --gold:#B08A32; --gold-l:#F4EAD2;
  --rule:#CFC4A8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@page{size:A4 portrait;margin:0}
html,body{font-family:'Poppins',sans-serif;color:var(--ink);font-size:14px;line-height:1.6;background:#8E9A93}
body{padding:14px 0}

/* ---------- screen chrome (hidden when printing) ---------- */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(252,250,244,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);max-width:210mm;margin:0 auto 14px}
.bar .t{font-family:'Lora',serif;font-weight:700;color:var(--em);font-size:15px}
.bar .ar{font-family:'Amiri',serif;color:var(--gold);font-size:17px}
.bar .sp{flex:1}
.bar button{min-height:40px;border:1.5px solid var(--em);background:#fff;color:var(--em);
  font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;border-radius:8px;
  padding:8px 13px;cursor:pointer;white-space:nowrap}
.bar button:hover{background:var(--em);color:#fff}

/* ---------- the A4 sheet ---------- */
.page.p1{--acc:#0B4D3B;--accbg:#E4F0EA}
.page.p2{--acc:#1F5C82;--accbg:#E4EFF6}
.page.p3{--acc:#8A5A12;--accbg:#F8EEDC}
.page.p4{--acc:#5B4076;--accbg:#EDE7F4}
.page.p5{--acc:#8C3A34;--accbg:#F8E9E7}
.page{--acc:var(--em);--accbg:var(--em-l);border-top:5mm solid var(--acc);
  width:210mm;min-height:297mm;position:relative;overflow:hidden;
  page-break-after:always;background:var(--paper);
  padding:18mm 18mm 16mm;margin:0 auto 14px;
  text-align:center;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.5);
}
.page:last-child{page-break-after:auto}

.ptop{display:flex;justify-content:space-between;align-items:center;
  font-size:9pt;letter-spacing:1.6px;text-transform:uppercase;color:var(--soft);
  border-bottom:1px solid var(--rule);padding-bottom:3mm;margin-bottom:8mm}
.ptop .part{font-weight:700;color:var(--acc)}

.lnum{display:inline-block;font-family:'Lora',serif;font-size:11pt;font-weight:700;
  color:#fff;background:var(--acc);border-radius:100px;padding:2mm 6mm;margin-bottom:4mm}
h1.ltitle{font-family:'Lora',serif;font-size:24pt;font-weight:700;color:var(--acc);line-height:1.25}
.lar{font-family:'Amiri',serif;font-size:20pt;font-weight:700;color:var(--gold);direction:rtl;margin-top:1mm}
.lsub{font-family:'Lora',serif;font-style:italic;font-size:11pt;color:var(--soft);
  margin:3mm auto 7mm;max-width:150mm}
.rule{width:36mm;height:2px;background:var(--acc);margin:0 auto 7mm;opacity:.55}

/* content blocks — everything centred */
.blk{margin-bottom:6mm}
.h{font-family:'Lora',serif;font-size:13pt;font-weight:700;color:var(--acc);margin-bottom:2mm}
p.txt{font-size:11pt;color:var(--ink);max-width:150mm;margin:0 auto 2mm;line-height:1.75}
.lead{font-size:11.5pt;color:var(--soft);max-width:150mm;margin:0 auto}

/* Arabic always right-to-left */
.arb{direction:rtl;text-align:right;font-family:'Amiri',serif;font-size:17pt;font-weight:700;
  color:var(--acc);line-height:2.15;background:#fff;border:1px solid var(--accbg);
  border-right:4px solid var(--acc);border-radius:3mm;padding:5mm 6mm;margin:0 auto 2mm;max-width:158mm}
.trn{font-style:italic;font-size:10pt;color:var(--gold);max-width:150mm;margin:0 auto 1mm}
.mng{font-size:10.5pt;color:var(--soft);max-width:150mm;margin:0 auto}

ul.pts,ol.pts{list-style:none;max-width:150mm;margin:0 auto;padding:0}
ul.pts li,ol.pts li{font-size:11pt;padding:1.6mm 0;border-bottom:1px dotted var(--rule)}
ul.pts li:last-child,ol.pts li:last-child{border-bottom:0}
ol.pts{counter-reset:c}
ol.pts li::before{counter-increment:c;content:counter(c);display:inline-grid;place-items:center;
  width:6mm;height:6mm;border-radius:50%;background:var(--gold-l);color:var(--gold);
  font-weight:700;font-size:9pt;margin-right:3mm;vertical-align:middle}

table{border-collapse:collapse;margin:0 auto;max-width:160mm;width:100%;font-size:10pt}
th{background:var(--acc);color:#fff;font-weight:600;padding:2.5mm;font-size:9.5pt;
  letter-spacing:.4px;text-transform:uppercase}
td{border-bottom:1px solid var(--rule);padding:2.5mm;text-align:center}
td.ar{font-family:'Amiri',serif;font-size:14pt;font-weight:700;direction:rtl;color:var(--em);line-height:1.9}
tr:nth-child(even) td{background:var(--accbg)}

.note{background:var(--gold-l);border:1px solid rgba(176,138,50,.35);border-radius:3mm;
  padding:4mm 6mm;max-width:155mm;margin:0 auto;font-size:10.5pt;color:#6B531A}
.note b{color:#4A3910}
.remember{background:var(--acc);color:#fff;border-radius:3mm;padding:5mm 7mm;
  max-width:155mm;margin:6mm auto 0}
.remember .rh{font-family:'Lora',serif;font-weight:700;font-size:11pt;letter-spacing:1px;
  text-transform:uppercase;opacity:.8;margin-bottom:1.5mm}
.remember p{font-size:11pt;line-height:1.7}

.wm{position:absolute;bottom:7mm;left:50%;transform:translateX(-50%);
  font-family:'Lora',serif;font-size:9pt;color:var(--em);opacity:.4;letter-spacing:2.5px;
  font-style:italic;white-space:nowrap}
.pno{position:absolute;bottom:7mm;right:14mm;font-size:9pt;color:var(--soft)}

/* audience badge + class mode */
.aud{display:inline-block;font-size:8.5pt;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  border:1.5px solid var(--acc);color:var(--acc);border-radius:100px;padding:1mm 4mm;margin-bottom:3mm}
.tocaud{color:var(--gold);font-size:8.5pt;font-weight:700}

/* cover */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.cover .crest{width:34mm;height:34mm;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin-bottom:8mm}
.cover .car{font-family:'Amiri',serif;font-size:42pt;font-weight:700;color:var(--em);line-height:1.3}
.cover .cen{font-family:'Lora',serif;font-size:22pt;font-weight:700;color:var(--gold);letter-spacing:3px;margin-top:2mm}
.cover .cline{width:60mm;height:2px;background:var(--rule);margin:8mm auto}
.cover .cmeta{font-size:11pt;color:var(--soft);line-height:2}

/* contents */
.toc{max-width:160mm;margin:0 auto;text-align:left}
.toc .grp{font-family:'Lora',serif;font-weight:700;color:var(--gold);font-size:11pt;
  text-transform:uppercase;letter-spacing:1.2px;margin:5mm 0 2mm;text-align:center}
.toc a{display:flex;gap:4mm;align-items:baseline;text-decoration:none;color:var(--ink);
  font-size:10.5pt;padding:1.4mm 0;border-bottom:1px dotted var(--rule)}
.toc a .n{width:7mm;text-align:right;color:var(--em);font-weight:700}
.toc a .t{flex:1}
.toc a:hover{color:var(--em)}

/* the two-part lesson chooser */
.chooser{display:flex;gap:5mm;justify-content:center;margin:0 auto 6mm;max-width:150mm}
.chooser button{flex:1;min-height:44px;border:2px solid var(--em);background:#fff;color:var(--em);
  font-family:'Lora',serif;font-weight:700;font-size:12pt;border-radius:3mm;padding:4mm;cursor:pointer}
.chooser button.on{background:var(--em);color:#fff}
.sect{display:none} .sect.on{display:block}


/* ---------- Malayalam ---------- */
body.lang-ml,body.lang-ml p.txt,body.lang-ml li,body.lang-ml td,body.lang-ml .note,
body.lang-ml .remember p,body.lang-ml .mng,body.lang-ml .lsub,body.lang-ml .imgcap,
body.lang-ml .fig .lb{font-family:'Anek Malayalam','Noto Sans Malayalam',sans-serif}
body.lang-ml h1.lt,body.lang-ml .h,body.lang-ml th,body.lang-ml .toc .grp,
body.lang-ml .remember .rh,body.lang-ml .lnum{font-family:'Baloo Chettan 2','Anek Malayalam',sans-serif}
body.lang-ml p.txt,body.lang-ml li{line-height:1.95}
.bar .lang{min-height:38px;border:1.5px solid var(--gold);background:#fff;color:var(--gold-d);
  font-family:'Poppins',sans-serif;font-weight:700;font-size:12.5px;border-radius:8px;
  padding:8px 13px;cursor:pointer;white-space:nowrap}
.bar .lang:hover{background:var(--gold);color:#fff}

/* ---------- illustrations ---------- */
.seq{display:grid;grid-template-columns:repeat(5,1fr);gap:4mm;max-width:165mm;margin:0 auto}
.seq.four{grid-template-columns:repeat(4,1fr)}
.seq.three{grid-template-columns:repeat(3,1fr)}
.fig{text-align:center}
.fig .box{position:relative;aspect-ratio:3/4;border:1px solid var(--rule);border-radius:2mm;
  background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.fig img{width:100%;height:100%;object-fit:contain;display:block}
.fig .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;
  width:100%;height:100%;background:repeating-linear-gradient(45deg,#fff,#fff 3mm,var(--gold-l) 3mm,var(--gold-l) 6mm)}
.fig .ph .i{font-size:15pt;opacity:.6}
.fig .ph .c{font-family:monospace;font-size:6.5pt;color:var(--soft);word-break:break-all;padding:0 1mm}
.fig .n{position:absolute;top:1mm;left:1mm;width:5mm;height:5mm;border-radius:50%;
  background:var(--acc);color:#fff;font-size:7.5pt;font-weight:700;display:grid;place-items:center}
.fig .lb{font-size:8pt;font-weight:600;color:var(--ink);margin-top:1.5mm;line-height:1.35}
.fig .lar{font-family:'Amiri',serif;font-size:9.5pt;color:var(--gold);direction:rtl;line-height:1.5}
.imgone{max-width:120mm;margin:0 auto}
.imgone .box{aspect-ratio:16/10;border:1px solid var(--rule);border-radius:2mm;background:#fff;overflow:hidden}
.imgone img{width:100%;display:block}
.imgcap{font-size:9.5pt;color:var(--soft);margin-top:2mm;max-width:150mm;margin-left:auto;margin-right:auto}
@media(max-width:820px){
  .seq{grid-template-columns:repeat(3,1fr);gap:8px}
  .seq.four,.seq.three{grid-template-columns:repeat(3,1fr)}
  .fig .lb{font-size:10px}
}
@media print{.fig .ph{background:#fff;border:1px dashed var(--rule)}}

@media print{
  body{background:#fff;padding:0}
  .bar{display:none!important}
  .page{box-shadow:none;margin:0}
  .chooser{display:none!important}
}
@media(max-width:820px){
  body{padding:0}
  .bar{max-width:100%;margin-bottom:0}
  .page{width:100%;min-height:auto;padding:22px 16px 30px;margin-bottom:10px;box-shadow:none;
    border-bottom:6px solid var(--edge)}
  h1.ltitle{font-size:20pt}.cover .car{font-size:30pt}.cover .cen{font-size:16pt}
  .arb{font-size:15pt;padding:12px 14px}
  table{font-size:9pt}th,td{padding:6px 4px}
  .wm,.pno{position:static;transform:none;display:block;margin-top:14px}
}
</style>
</head>
<body>

<div class="bar">
  <div><span class="t">Ṣalāh Complete</span> <span class="ar">الصَّلَاة</span></div>
  <div class="sp"></div>
  <button class="lang" id="langBtn">മലയാളം</button>
  <span id="barMeta" style="font-size:11.5px;color:var(--soft)">23 lessons · Shāfiʿī</span>
</div>

<div id="book"></div>

 F("slh-02-takbir.jpeg","Takbīrat al-iḥrām","تَكْبِيرَةُ الإِحْرَام","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. TAKBĪRAT AL-IḤRĀM. Standing upright. BOTH hands raised to shoulder level, level with the ears, palms flat and facing forward, fingers together and pointing straight up, elbows bent and held away from the body. Feet flat and apart."),
 F("slh-03-qiyam-hands.jpeg","Hands folded","وَضْعُ الْيَدَيْن","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. HANDS FOLDED. Standing upright. The RIGHT hand rests on top of the LEFT forearm just above the wrist, both hands held together against the body BELOW the chest and ABOVE the navel. Elbows relaxed at the sides."),
 F("slh-04-ruku.jpeg","Rukūʿ — bowing","الرُّكُوع","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. RUKŪʿ, bowing. The back is FLAT and HORIZONTAL, parallel to the ground, like a table top. The head is level with the back — not raised above it and not dropped below it. Both hands grip the knees with fingers spread wide. Legs straight, knees not bent."),
 F("slh-05-itidal.jpeg","Iʿtidāl — rising","الاعْتِدَال","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. IʿTIDĀL, rising from bowing. Standing completely upright again, spine straight, arms hanging relaxed at the sides, feet flat. Identical to plain standing — show the body fully settled and still."),
 F("slh-06-sujud.jpeg","Sujūd","السُّجُود","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. SUJŪD, prostration. FOREHEAD AND NOSE both touch the mat. Palms flat on the mat level with the shoulders, fingers together pointing forward. ELBOWS RAISED clear of the ground and held away from the sides. Knees on the mat. TOES BENT FORWARD so the toe-tips press the mat. Back raised and sloping."),
 F("slh-07-jalsa.jpeg","Sitting between","الْجُلُوسُ بَيْنَ السَّجْدَتَيْن","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Full body visible, side view facing right. SITTING BETWEEN THE TWO PROSTRATIONS (iftirāsh). Seated on the LEFT foot which is laid flat on its side underneath. The RIGHT foot is UPRIGHT with the toes bent forward pressing the mat. Both hands flat on the thighs near the knees, fingers together pointing forward. Back straight."),

 F("slh-10-salam.jpeg","Salām","السَّلَام","Cartoon illustration for a children's Islamic prayer guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. The figure wears a plain long white thawb and a white kufi prayer cap. The head is a plain rounded shape with NO facial features at all — no eyes, no nose, no mouth, no beard. Plain cream background, a simple green prayer mat under the figure, nothing else in the scene. Seen from behind and slightly to the side. GIVING SALĀM. Seated in the same tawarruk position, turning the HEAD to the RIGHT so the side of the plain featureless head is visible over the shoulder. Hands still resting on the thighs. Shoulders relaxed.")

 F("wud-04-face.jpeg","Wash the face","غَسْلُ الْوَجْه","Cartoon illustration for a children's Islamic guide. Simple rounded shapes, flat bright colours, thick outlines. A plain rounded head with NO facial features at all — no eyes, nose or mouth — wearing a white kufi cap where relevant. Plain cream background, water as simple blue droplets. WASHING THE FACE. Two hands washing a plain featureless head, with a dotted outline marking the boundary of the face from hairline to chin and from ear to ear."),
 F("wud-05-arms.jpeg","Arms to the elbows","الذِّرَاعَان","Cartoon illustration for a children's Islamic guide. Simple rounded shapes, flat bright colours, thick clean outlines, no shading. Show hands and forearms only with rolled-up white sleeves — no face and no body. Plain cream background, water drawn as simple blue droplets and curved lines. Washing the right forearm with the left hand, water running down, and a clear dotted marker ring AT THE ELBOW showing the elbow is included."),

 F("wud-08-feet.jpeg","Feet to the ankles","الرِّجْلَان","Cartoon illustration for a children's Islamic guide. Simple rounded shapes, flat bright colours, thick outlines. Show one bare FOOT only, no body and no face. A hand passes fingers between the toes while water pours over it. A dotted marker ring AT THE ANKLE shows the ankle is included. Plain cream background.")

const LESSONS=[
/* ---------------- PART 1 ---------------- */
{p:1,t:"Why Ṣalāh",ar:"لِمَاذَا الصَّلَاة",
 sub:"The one act of worship given directly, above the seven heavens.",
 b:[{t:"txt",x:"Every other command came down to the earth through Jibrīl. Ṣalāh alone was given to the Prophet ﷺ on the night of Isrā' and Miʿrāj, above the seven heavens, with no messenger in between. That alone tells you its weight."},
    {t:"h",x:"Why five"},
    {t:"txt",x:"Fifty prayers were first commanded. Mūsā advised the Prophet ﷺ to return and ask for relief, and he did so until they became five in number and fifty in reward. Allah's mercy is written into the count itself."},
    {t:"ar",x:"إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَوْقُوتًا",
     tr:"Inna ṣ-ṣalāta kānat ʿala l-mu'minīna kitāban mawqūtā",
     en:"Indeed, prayer is prescribed for the believers at fixed times. — An-Nisā' 4:103"},
    {t:"h",x:"The first thing weighed"},
    {t:"txt",x:"The Prophet ﷺ said the first matter a servant is questioned about on the Day of Judgement is the prayer. If it is sound, the rest follows; if it is ruined, the rest is ruined."},
    {t:"rem",x:"Ṣalāh is not a part of your day. It is the frame your day is built around."}]},

{p:1,t:"The Five Prayers",ar:"الصَّلَوَاتُ الْخَمْس",
 sub:"Names, times, and how many rakʿahs — in one table.",
 b:[{t:"tbl",head:["Prayer","Arabic","Farḍ","Time begins","Time ends"],
     rows:[["Ṣubḥ (Fajr)","الصُّبْح","2","True dawn","Sunrise"],
           ["Ẓuhr","الظُّهْر","4","Sun passes zenith","Shadow = object + noon shadow"],
           ["ʿAṣr","الْعَصْر","4","End of Ẓuhr","Sunset"],
           ["Maghrib","الْمَغْرِب","3","Sunset","Disappearance of red twilight"],
           ["ʿIshā'","الْعِشَاء","4","Red twilight gone","True dawn"]]},
    {t:"note",x:"<b>Shāfiʿī note.</b> ʿAṣr begins when an object's shadow equals its own length plus the shadow it had at noon. Delaying a prayer past its time without excuse is a serious sin — pray it at its beginning wherever you can."},
    {t:"h",x:"The ten rakʿah rawātib"},
    {t:"tbl",head:["Prayer","Before","After"],
     rows:[["Ṣubḥ","2","—"],["Ẓuhr","2","2"],["Maghrib","—","2"],["ʿIshā'","—","2"]]},
    {t:"note",x:"<b>Ten rakʿahs in total.</b> ʿAṣr has no rawātib, and Witr is not counted among them. Both are covered in Lesson 16."},
    {t:"rem",x:"Learn the table by heart. A person who knows the times never misses a prayer by accident."}]},

{p:1,t:"Conditions Before You Stand",ar:"شُرُوطُ الصَّلَاة",
 sub:"Five things must be true before the takbīr — and purity is one of them.",
 b:[{t:"ol",x:["<b>Purity from ḥadath</b> — minor and major. Taught fully in Part 5.",
     "<b>Purity of body, clothes and place</b> from najāsah.",
     "<b>Covering the ʿawrah</b> — for men, navel to knee; for women, all but the face and hands.",
     "<b>Facing the qiblah</b> — with certainty if you can, with best effort if you cannot.",
     "<b>The time has entered</b> — praying before the time does not count."]},
    {t:"h",x:"And then the niyyah"},
    {t:"txt",x:"Niyyah is not a condition standing outside the prayer — in the Shāfiʿī madhhab it is the first pillar, made in the heart at the moment of takbīrat al-iḥrām. The next lesson gives the wording for every prayer."},
    {t:"note",x:"If any of the five is missing, the prayer is not valid, however beautifully it is performed. Check them before you raise your hands, not after."},
    {t:"rem",x:"Five conditions, then the intention. Nothing before that, nothing skipped."}]},

/* ---------------- PART 2 ---------------- */
{p:2,t:"Adhān and Iqāmah",ar:"الأَذَان وَالإِقَامَة",
 sub:"The call that opens the time, and the call that opens the prayer.",
 b:[{t:"txt",x:"The adhān announces that the time has entered. The iqāmah announces that the prayer is beginning. Both are sunnah muakkadah for the five daily prayers."},
    {t:"h",x:"Replying to the adhān"},
    {t:"txt",x:"Repeat after the mu'adhdhin word for word — except after ḥayya ʿala ṣ-ṣalāh and ḥayya ʿala l-falāḥ, where you say instead:"},
    {t:"ar",x:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",tr:"Lā ḥawla wa lā quwwata illā billāh",
     en:"There is no power and no strength except with Allah."},
    {t:"h",x:"The duʿā after the adhān"},
    {t:"ar",x:"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ وَالصَّلَاةِ الْقَائِمَةِ آتِ مُحَمَّدٍ الْوَسِيلَةَ وَالْفَضِيلَةَ وَالدَّرَجَةَ الرَّفِيعَةَ وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ وَارْزُقْنَا شَفَاعَتَهُ يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",
     tr:"Allāhumma rabba hādhihi d-daʿwati t-tāmmah wa ṣ-ṣalāti l-qā'imah, āti Muḥammadan il-wasīlata wa l-faḍīlata wa d-darajata r-rafīʿah, wabʿathhu maqāman maḥmūdan illadhī waʿadtah, warzuqnā shafāʿatahu yawma l-qiyāmah, innaka lā tukhlifu l-mīʿād",
     en:"O Allah, Lord of this perfect call and the prayer to be established, grant Muḥammad the wasīlah, the excellence and the lofty rank, and raise him to the praised station You promised him. Grant us his intercession on the Day of Resurrection — indeed You do not break Your promise."},
    {t:"note",x:"Whoever says this duʿā after the adhān will have the intercession of the Prophet ﷺ on the Day of Judgement."},
    {t:"rem",x:"Do not talk over the adhān. Answer it — it costs thirty seconds and carries a promise."}]},

{p:2,t:"Niyyah for Every Prayer",ar:"النِّيَّة",
 sub:"Alone, behind an imām, and leading — the wording for all five.",
 b:[{t:"txt",x:"In the Shāfiʿī madhhab the niyyah is made <b>in the heart</b> at the moment of takbīrat al-iḥrām. Saying it aloud beforehand is not required; it is done to help the heart settle on what it intends."},
    {t:"h",x:"Praying alone — مُنْفَرِدًا"},
    {t:"niy",mode:""},
    {t:"h",x:"In jamāʿah"},
    {t:"txt",x:"Add one word before <span class='arb-inline'>لِلَّهِ تَعَالَى</span>:"},
    {t:"tbl",head:["You are","Add","Meaning"],
     rows:[["Following the imām","<span style='font-family:Amiri,serif;font-size:14pt'>مَأْمُومًا</span>","as a follower"],
           ["Leading the prayer","<span style='font-family:Amiri,serif;font-size:14pt'>إِمَامًا</span>","as an imām"]]},
    {t:"txt",x:"So Ẓuhr behind an imām becomes: أُصَلِّي فَرْضَ الظُّهْرِ أَرْبَعَ رَكَعَاتٍ مُتَوَجِّهًا إِلَى الْقِبْلَةِ أَدَاءً مَأْمُومًا لِلَّهِ تَعَالَى"},
    {t:"note",x:"<b>Making up a missed prayer?</b> Replace <span style='font-family:Amiri,serif'>أَدَاءً</span> (on time) with <span style='font-family:Amiri,serif'>قَضَاءً</span> (made up)."},
    {t:"rem",x:"The tongue may be silent. The heart must not be."}]},

{p:2,t:"Takbīr to Rukūʿ",ar:"مِنَ التَّكْبِيرِ إِلَى الرُّكُوع",
 sub:"Standing, opening, reciting, and bowing.",
 b:[{t:"ol",x:["Stand facing the qiblah, feet apart, eyes on the place of sujūd.",
     "Raise both hands to shoulder level and say <b>Allāhu akbar</b> — this is takbīrat al-iḥrām, and the niyyah is in the heart at this moment.",
     "Place the right hand over the left, below the chest and above the navel.",
     "Recite the opening duʿā, then aʿūdhu billāh, then Al-Fātiḥah.",
     "Recite a short sūrah — in the first two rakʿahs only.",
     "Say Allāhu akbar, raise the hands, and bow into rukūʿ with a straight back."]},
    {t:"seq",x:"POS_A",cls:"four"},
    {t:"h",x:"In rukūʿ"},
    {t:"ar",x:"سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ",tr:"Subḥāna rabbiya l-ʿaẓīmi wa bi-ḥamdih",
     en:"Glory to my Lord the Most Great, and praise be to Him. — three times"},
    {t:"h",x:"Rising — iʿtidāl"},
    {t:"ar",x:"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ",tr:"Samiʿa llāhu liman ḥamidah",en:"Allah hears whoever praises Him — said while rising."},
    {t:"ar",x:"رَبَّنَا لَكَ الْحَمْدُ، مِلْءَ السَّمَاوَاتِ وَمِلْءَ الْأَرْضِ وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ",
     tr:"Rabbanā laka l-ḥamd, mil'a s-samāwāti wa mil'a l-arḍi wa mil'a mā shi'ta min shay'in baʿd",
     en:"Our Lord, all praise is Yours — filling the heavens, filling the earth, and filling whatever else You will."},
    {t:"note",x:"<b>Shāfiʿī.</b> Al-Fātiḥah is a pillar in every rakʿah, for the imām and the follower alike. If you cannot finish it before the imām bows, you may still follow — but learn it until you can."},
    {t:"rem",x:"Stillness is a pillar. Never move to the next position until the body has settled in this one."}]},

{p:2,t:"Sujūd to Salām",ar:"مِنَ السُّجُودِ إِلَى السَّلَام",
 sub:"The closest a servant comes to his Lord, and how the prayer ends.",
 b:[{t:"txt",x:"Sujūd is made on <b>seven bones</b>: the forehead with the nose, the two palms, the two knees, and the toes of both feet. All seven must touch the ground."},
    {t:"ar",x:"سُبْحَانَ رَبِّيَ الأَعْلَى وَبِحَمْدِهِ",tr:"Subḥāna rabbiya l-aʿlā wa bi-ḥamdih",
     en:"Glory to my Lord the Most High, and praise be to Him. — three times"},
    {t:"seq",x:"POS_B",cls:"three"},
    {t:"h",x:"Sitting between the two sujūd"},
    {t:"ar",x:"رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي",
     tr:"Rabbi ghfir lī warḥamnī wajburnī warfaʿnī warzuqnī wahdinī wa ʿāfinī waʿfu ʿannī",
     en:"My Lord, forgive me, have mercy on me, mend me, raise me, provide for me, guide me, grant me well-being, and pardon me."},
    {t:"h",x:"Tashahhud, then durūd, then salām"},
    {t:"txt",x:"In the final sitting, recite the tashahhud, then the durūd Ibrāhīmī, then a duʿā, then turn the face right and left saying:"},
    {t:"ar",x:"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ",tr:"As-salāmu ʿalaykum wa raḥmatullāh",
     en:"Peace be upon you and the mercy of Allah."},
    {t:"rem",x:"The prayer is opened with Allah's greatness and closed with peace given to others. That is the whole religion in one movement."}]},

{p:2,t:"What We Recite",ar:"مَا نَقْرَؤُهُ فِي الصَّلَاة",
 sub:"Al-Fātiḥah, tashahhud, durūd — and the Qunūt of Ṣubḥ.",
 b:[{t:"h",x:"Tashahhud"},
    {t:"ar",x:"التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ",
     tr:"At-taḥiyyātu l-mubārakātu ṣ-ṣalawātu ṭ-ṭayyibātu lillāh…",
     en:"All greetings, blessings and good deeds are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings…"},
    {t:"h",x:"Durūd Ibrāhīmī"},
    {t:"ar",x:"اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ",
     tr:"Allāhumma ṣalli ʿalā sayyidinā Muḥammadin wa ʿalā āli sayyidinā Muḥammad, kamā ṣallayta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīm, wa bārik ʿalā sayyidinā Muḥammadin wa ʿalā āli sayyidinā Muḥammad, kamā bārakta ʿalā Ibrāhīma wa ʿalā āli Ibrāhīma fi l-ʿālamīn, innaka ḥamīdun majīd",
     en:"O Allah, send blessings upon our master Muḥammad and upon the family of our master Muḥammad, as You blessed Ibrāhīm and the family of Ibrāhīm; and send favour upon our master Muḥammad and upon his family, as You favoured Ibrāhīm and his family among the worlds. Indeed You are Praiseworthy, Glorious."},
    {t:"h",x:"The duʿā after the durūd, before the salām"},
    {t:"ar",x:"اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ وَمَا أَخَّرْتُ وَمَا أَسْرَرْتُ وَمَا أَعْلَنْتُ وَمَا أَسْرَفْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي، أَنْتَ الْمُقَدِّمُ وَأَنْتَ الْمُؤَخِّرُ، لَا إِلَهَ إِلَّا أَنْتَ",
     tr:"Allāhumma ghfir lī mā qaddamtu wa mā akhkhartu wa mā asrartu wa mā aʿlantu wa mā asraftu wa mā anta aʿlamu bihi minnī, anta l-muqaddimu wa anta l-mu'akhkhiru, lā ilāha illā ant",
     en:"O Allah, forgive me what I have sent ahead and what I have left behind, what I have concealed and what I have declared, and what I have been excessive in, and what You know better than I. You are the One who brings forward and the One who puts back. There is no god but You."},
    {t:"ar",x:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ النَّارِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",
     tr:"Allāhumma innī aʿūdhu bika min ʿadhābi l-qabri wa min ʿadhābi n-nāri wa min fitnati l-maḥyā wa l-mamāti wa min fitnati l-masīḥi d-dajjāl",
     en:"O Allah, I seek refuge in You from the punishment of the grave, from the punishment of the Fire, from the trial of life and death, and from the trial of the Masīḥ ad-Dajjāl."},
    {t:"note",x:"<b>Qunūt — a Shāfiʿī practice.</b> In the second rakʿah of Ṣubḥ, after rising from rukūʿ, the Qunūt duʿā is recited standing. It is sunnah; if forgotten, sujūd as-sahw is performed. It is also recited in the last rakʿah of Witr in the second half of Ramaḍān."},
    {t:"rem",x:"Learn the meanings, not only the sounds. You cannot mean what you do not understand."}]},

{p:2,t:"After the Salām",ar:"أَذْكَارُ بَعْدَ الصَّلَاة",
 sub:"The most valuable two minutes of the whole prayer.",
 b:[{t:"ol",x:["<b>Astaghfirullāh</b> — three times.",
     "<b>Allāhumma anta s-salām wa minka s-salām, tabārakta yā dha l-jalāli wa l-ikrām.</b>",
     "<b>Āyat al-Kursī</b> — whoever recites it after each farḍ prayer, nothing stands between him and Paradise except death.",
     "<b>Subḥānallāh</b> 33 · <b>Al-ḥamdulillāh</b> 33 · <b>Allāhu akbar</b> 34.",
     "The duʿā taught to Muʿādh ibn Jabal, below."]},
    {t:"ar",x:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ",
     tr:"Allāhumma aʿinnī ʿalā dhikrika wa shukrika wa ḥusni ʿibādatik",
     en:"O Allah, help me to remember You, to thank You, and to worship You well."},
    {t:"note",x:"Do not stand up the instant you say salām. The Prophet ﷺ would remain seated facing the qiblah, and the reward attached to these few minutes is out of all proportion to their length."},
    {t:"rem",x:"You have already done the hard part. This is the interest on it."}]},

/* ---------------- PART 3 ---------------- */
{p:3,t:"Sujūd as-Sahw",ar:"سُجُودُ السَّهْو",
 sub:"What to do when you forget, add, or lose count.",
 b:[{t:"txt",x:"Sujūd as-sahw is two prostrations that repair a prayer disturbed by forgetfulness. <b>In the Shāfiʿī madhhab they are performed before the salām</b>, after the tashahhud."},
    {t:"h",x:"When it is done"},
    {t:"ul",x:["You left out a <b>sunnah abʿāḍ</b> — such as the first tashahhud, or the Qunūt of Ṣubḥ.",
     "You added an action from the prayer — an extra rukūʿ, sujūd or rakʿah — by mistake.",
     "You are unsure how many rakʿahs you have prayed."]},
    {t:"h",x:"The rule for doubt"},
    {t:"txt",x:"Build on <b>the smaller number</b>, which is what you are certain of. If you cannot decide between three and four, treat it as three, complete the fourth, then make sujūd as-sahw before the salām."},
    {t:"h",x:"What is recited in the two sajdahs"},
    {t:"ar",x:"سُبْحَانَ مَنْ لَا يَنَامُ وَلَا يَسْهُو",
     tr:"Subḥāna man lā yanāmu wa lā yashū",
     en:"Glory to the One who neither sleeps nor forgets. — said in each of the two sajdahs"},
    {t:"txt",x:"The two sajdahs are performed exactly like the sujūd of the prayer, with a sitting between them, after the final tashahhud and <b>before</b> the salām."},
    {t:"note",x:"A pillar (rukn) that is left out cannot be repaired by sujūd as-sahw. If you forget an entire rakʿah, you must pray it."},
    {t:"rem",x:"Forgetting is human. Shayṭān wants you to abandon the prayer over it — instead, repair it and continue."}]},

{p:3,t:"What Breaks the Prayer",ar:"مُبْطِلَاتُ الصَّلَاة",
 sub:"And several things people believe break it, which do not.",
 b:[{t:"h",x:"These invalidate the prayer"},
    {t:"ul",x:["Speaking deliberately, even one word.",
     "Eating or drinking anything.",
     "Excessive continuous movement unrelated to the prayer — three successive movements.",
     "Losing wudu, or the occurrence of major impurity.",
     "Uncovering the ʿawrah, or najāsah touching the body, clothes or place.",
     "Turning the chest away from the qiblah.",
     "Laughing aloud.",
     "Leaving out a pillar deliberately, or changing the intention."]},
    {t:"h",x:"These do <i>not</i> break it"},
    {t:"ul",x:["A small unavoidable movement — scratching once, adjusting a garment.",
     "Involuntary coughing, sneezing or yawning.",
     "Saying subḥānallāh to correct the imām, or a woman clapping once.",
     "Tears, or a quiet involuntary sound.",
     "A child walking past, or a small movement to prevent someone passing in front."]},
    {t:"rem",x:"Do not restart a prayer out of vague worry. Learn what genuinely breaks it and stop doubting the rest."}]},

{p:3,t:"Missed Prayers and Qaḍā'",ar:"قَضَاءُ الصَّلَاة",
 sub:"What to do about the prayers behind you.",
 b:[{t:"txt",x:"A prayer missed with a valid excuse — sleep or genuine forgetfulness — is prayed as soon as you wake or remember. The Prophet ﷺ said there is no negligence in sleep; negligence is in delaying the prayer until the next one comes."},
    {t:"txt",x:"A prayer left deliberately is a serious sin, and it must still be made up. The Shāfiʿī position is that qaḍā' remains obligatory and should be done <b>immediately and in order</b>, alongside your current prayers, until the debt is cleared."},
    {t:"h",x:"How to make them up"},
    {t:"ol",x:["Pray them in the order they were missed, where you can recall the order.",
     "Use the niyyah with <span style='font-family:Amiri,serif'>قَضَاءً</span> in place of <span style='font-family:Amiri,serif'>أَدَاءً</span>.",
     "Add a fixed number of missed prayers to each day alongside the five current ones.",
     "Keep a written count so the debt is real and visible."]},
    {t:"note",x:"Despair is not repentance. A person who has missed years of prayer begins with the next one — today's — and then starts paying back."},
    {t:"rem",x:"You cannot change what you missed. You can decide that today is where the missing stops."}]},

{p:3,t:"Travelling",ar:"صَلَاةُ الْمُسَافِر",
 sub:"Shortening and joining — a mercy, not a loophole.",
 b:[{t:"h",x:"Qaṣr — shortening"},
    {t:"txt",x:"On a journey of the required distance and for a permissible purpose, the four-rakʿah prayers — Ẓuhr, ʿAṣr and ʿIshā' — are prayed as <b>two</b>. Ṣubḥ and Maghrib are never shortened."},
    {t:"h",x:"Jamʿ — joining"},
    {t:"tbl",head:["Pair","Joined at","Called"],
     rows:[["Ẓuhr + ʿAṣr","Ẓuhr time","jamʿ taqdīm"],["Ẓuhr + ʿAṣr","ʿAṣr time","jamʿ ta'khīr"],
           ["Maghrib + ʿIshā'","Maghrib time","jamʿ taqdīm"],["Maghrib + ʿIshā'","ʿIshā' time","jamʿ ta'khīr"]]},
    {t:"txt",x:"The travel concession begins once you have left the built-up area of your town, and ends when you return to it or intend a long stay."},
    {t:"note",x:"<b>Behind a resident imām</b>, pray the full number. Shortening applies when you pray alone or behind another traveller."},
    {t:"rem",x:"Allah made travel easier, not optional. Shorten the prayer — never drop it."}]},

/* ---------------- PART 4 ---------------- */
{p:4,t:"Praying Behind an Imām",ar:"صَلَاةُ الْجَمَاعَة",
 sub:"Twenty-seven times the reward, and the manners that come with it.",
 b:[{t:"txt",x:"The Prophet ﷺ said prayer in congregation is twenty-seven degrees above prayer alone. For men it is strongly emphasised; for women, prayer at home is permitted and rewarded, and joining the congregation is allowed."},
    {t:"h",x:"Joining late — masbūq"},
    {t:"ol",x:["Make the niyyah with <span style='font-family:Amiri,serif'>مَأْمُومًا</span> and give the takbīr.",
     "Join the imām in whatever position he is in — do not wait for him to stand.",
     "If you catch the rukūʿ, that rakʿah counts for you.",
     "When the imām gives salām, stand and complete the rakʿahs you missed."]},
    {t:"h",x:"The rows"},
    {t:"ul",x:["Straighten the row; shoulder to shoulder, foot to foot.",
     "Fill the front row first, and close every gap.",
     "Do not begin a new row while there is space in the one ahead.",
     "Never move ahead of the imām — follow him, do not race him."]},
    {t:"one",x:"SAFF",cap:"Shoulder to shoulder, foot to foot, no gaps. Fill the front row first."},
    {t:"rem",x:"A straight row is not decoration. The Prophet ﷺ would not begin until the rows were straight."}]},

{p:4,t:"Jumuʿah",ar:"صَلَاةُ الْجُمُعَة",
 sub:"The best day on which the sun rises.",
 b:[{t:"txt",x:"Jumuʿah replaces Ẓuhr on Friday and is obligatory on adult, sane, resident men. It is two rakʿahs, preceded by two khuṭbahs, which are part of the prayer — not an introduction to it."},
    {t:"h",x:"The sunnahs of the day"},
    {t:"ul",x:["Ghusl, and wearing your best clean clothes.",
     "Using the miswāk and applying perfume.",
     "Going early — the earlier you arrive, the greater the reward.",
     "Reciting Sūrah Al-Kahf.",
     "Sending abundant ṣalawāt on the Prophet ﷺ."]},
    {t:"note",x:"<b>Silence during the khuṭbah is obligatory.</b> The Prophet ﷺ said if you tell your companion to be quiet while the imām is speaking, you have spoken idly yourself. No phones, no whispering, no reading."},
    {t:"txt",x:"There is an hour on Friday in which no Muslim asks Allah for something good except that it is granted. Many scholars place it in the last hour before Maghrib."},
    {t:"rem",x:"Arrive early, sit close, stay silent. Friday rewards the one who prepares for it."}]},

{p:4,t:"Sunnah and Nafl",ar:"السُّنَنُ وَالنَّوَافِل",
 sub:"The ten rawātib the Prophet ﷺ kept, and the voluntary prayers beyond them.",
 b:[{t:"txt",x:"Voluntary prayer may be offered in any number at any permitted time. But the ones the Prophet ﷺ kept <b>regularly</b> before and after the farḍ prayers carry special weight. These are <b>ten rakʿahs</b>, and they are called the <b>rawātib</b>."},
    {t:"tbl",head:["Prayer","Before","After"],
     rows:[["Ṣubḥ","2","—"],["Ẓuhr","2","2"],["Maghrib","—","2"],["ʿIshā'","—","2"]]},
    {t:"txt",x:"Ibn ʿUmar (raḍiyallāhu ʿanhu) said: <i>I memorised ten rakʿahs from the Prophet ﷺ — two before Ẓuhr and two after, two after Maghrib at home, two after ʿIshā' at home, and two before Ṣubḥ.</i> (Bukhārī)"},
    {t:"h",x:"The two before Ṣubḥ — the most emphasised of all"},
    {t:"txt",x:"The Prophet ﷺ never left them, not even while travelling. He said: <i>The two are more beloved to me than the whole world.</i> (Muslim, Tirmidhī, Aḥmad)"},
    {t:"txt",x:"Abū Hurayrah (raḍiyallāhu ʿanhu) reported: <i>Do not leave the two rakʿahs before Ṣubḥ, even if cavalry should drive you away.</i> (Aḥmad, Abū Dāwūd). ʿĀ'ishah (raḍiyallāhu ʿanhā) said he never gave any voluntary prayer the attention he gave these two. (Bukhārī, Muslim)"},
    {t:"ul",x:["Pray them <b>lightly and briefly</b> — ʿĀ'ishah said she wondered whether he had even recited Al-Fātiḥah.",
     "Recite Sūrah Al-Kāfirūn in the first rakʿah and Al-Ikhlāṣ in the second, quietly. (Aḥmad)",
     "He would then <b>lie on his right side</b> until the Ṣubḥ prayer — understood by many scholars as applying to one who prays the sunnah at home.",
     "If missed, they may be prayed after the Ṣubḥ prayer."]},
    {t:"h",x:"Ẓuhr, Maghrib and ʿIshā'"},
    {t:"txt",x:"At times the Prophet ﷺ prayed <b>four</b> before Ẓuhr and two after. ʿĀ'ishah (raḍiyallāhu ʿanhā) reported this (Aḥmad, Muslim), and at other times he prayed four after Ẓuhr as well. Two rakʿahs before Maghrib are permitted without making them a fixed practice — <i>Pray before Maghrib</i>, he said, then added, <i>for whoever wishes</i> (Bukhārī), disliking that people take it as a confirmed sunnah."},
    {t:"h",x:"ʿAṣr — a lighter sunnah"},
    {t:"txt",x:"Four rakʿahs before ʿAṣr may be prayed. They do not carry the weight of the rawātib. <i>May Allah have mercy on a man who prays four before ʿAṣr.</i> (Abū Dāwūd, Tirmidhī)"},
    {t:"h",x:"Other voluntary prayers"},
    {t:"tbl",head:["Prayer","When","Rakʿah"],
     rows:[["Witr","After ʿIshā', last of the night","1, 3, 5…"],
           ["Tahajjud","Last third of the night","2 by 2"],
           ["Ḍuḥā","Mid-morning until before noon","2 to 8"],
           ["Taḥiyyat al-masjid","On entering the masjid","2"],
           ["Two after wudu","After completing wudu","2"]]},
    {t:"note",x:"<b>Change your place.</b> A ḥadīth reported by Abū Hurayrah (Abū Dāwūd) indicates the sunnah should be prayed a little forward, back, left or right of where the farḍ was prayed — not on the same spot."},
    {t:"rem",x:"Ten rakʿahs a day, kept for a year, build a person more than a hundred prayed once."}]},
{p:4,t:"Prayers for Special Times",ar:"صَلَوَاتٌ خَاصَّة",
 sub:"Four prayers every Muslim should know before they are needed.",
 b:[{t:"h",x:"Ṣalāt al-Janāzah"},
    {t:"txt",x:"A farḍ kifāyah — if some perform it, the obligation lifts from the rest. It has <b>no rukūʿ and no sujūd</b>: four takbīrs, standing throughout. After the first, Al-Fātiḥah; after the second, durūd; after the third, duʿā for the deceased; after the fourth, the salām."},
    {t:"one",x:"JANAZAH",cap:"Four takbīrs, standing throughout — no rukūʿ and no sujūd."},
    {t:"h",x:"The two Eids"},
    {t:"txt",x:"Two rakʿahs with extra takbīrs — seven in the first rakʿah before Al-Fātiḥah, five in the second — followed by a khuṭbah. Sunnah muakkadah. Eat before Eid al-Fiṭr and after Eid al-Aḍḥā."},
    {t:"h",x:"Ṣalāt al-Istikhārah"},
    {t:"txt",x:"Two rakʿahs when you face a decision, then the duʿā of istikhārah. It is not a dream you wait for — you pray, you consult, and then you choose, trusting Allah to turn you toward the better outcome."},
    {t:"ar",x:"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ",
     tr:"Allāhumma innī astakhīruka bi-ʿilmika wa astaqdiruka bi-qudratik",
     en:"O Allah, I seek Your guidance by Your knowledge and Your power by Your might…"},
    {t:"h",x:"Sujūd at-Tilāwah"},
    {t:"txt",x:"On reciting or hearing a verse of prostration, say Allāhu akbar, prostrate once, and rise. Inside the prayer it is done in place; outside it, facing the qiblah in a state of purity."},
    {t:"rem",x:"Learn the janāzah prayer now. The day you need it, there is no time to learn it."}]},
{p:4,t:"Khushūʿ",ar:"الْخُشُوع",
 sub:"Praying with a heart that is actually present.",
 b:[{t:"txt",x:"A prayer can be perfect in form and empty in substance. Khushūʿ is the stillness of the limbs and the presence of the heart together — and it is what separates a prayer that changes you from one that merely counts."},
    {t:"h",x:"Before you stand"},
    {t:"ul",x:["Make wudu slowly and without hurry.",
     "Put the phone in another room, face down and silent.",
     "Pray at the start of the time, not at the end when you are rushed.",
     "Remember who you are about to speak to."]},
    {t:"h",x:"While you stand"},
    {t:"ul",x:["Keep the eyes on the place of sujūd. The eyes wander first; the heart follows.",
     "Understand what you are saying — learn the meaning of Al-Fātiḥah this week.",
     "Recite slowly, pausing at the end of each āyah.",
     "When the mind drifts, bring it back without frustration. It will drift again. Bring it back again."]},
    {t:"note",x:"The Prophet ﷺ said a man may finish his prayer and have only a tenth of it written for him — only the portion he was present for."},
    {t:"rem",x:"Pray as though it is your last prayer. One day it will be."}]},

/* ---------------- PART 5 : FIQH ---------------- */
{p:5,t:"Minor Ritual Impurity",ar:"الْحَدَثُ الأَصْغَر",
 sub:"What wudu removes — and exactly what removes wudu.",
 b:[{t:"txt",x:"Al-ḥadath al-aṣghar is the state that prevents prayer until wudu is performed. It is not dirt on the body; it is a ruling that attaches to a person until it is lifted."},
    {t:"h",x:"The six farḍ of wudu (Shāfiʿī)"},
    {t:"ol",x:["<b>Niyyah</b>, at the moment water first touches the face.",
     "Washing the <b>whole face</b> — hairline to chin, ear to ear.",
     "Washing <b>both arms including the elbows</b>.",
     "Wiping <b>part of the head</b> — even a few hairs suffices.",
     "Washing <b>both feet including the ankles</b>.",
     "<b>Tartīb</b> — performing them in this order."]},
    {t:"seq",x:"WUDU",cls:"four"},
    {t:"h",x:"What breaks wudu — nawāqiḍ (Shāfiʿī)"},
    {t:"ol",x:["Anything exiting the front or back passage — urine, stool, wind.",
     "Loss of reason: sleep, fainting, intoxication. <i>Sleeping firmly seated does not break it.</i>",
     "Skin contact between an adult man and an adult woman who are not maḥram, without a barrier.",
     "Touching the private parts with the <b>palm or inner fingers</b>, one's own or another's."]},
    {t:"note",x:"<b>Rule of doubt.</b> Certainty is not lifted by doubt. If you are sure you had wudu and unsure whether it broke, you still have wudu. Do not repeat wudu over waswasah."},
    {t:"rem",x:"Points 3 and 4 are Shāfiʿī positions and differ in other madhāhib. Follow the madhhab you are taught."}]},

{p:5,t:"Major Ritual Impurity",ar:"الْحَدَثُ الأَكْبَر",
 sub:"What ghusl removes, and how it is performed. Causes follow in the next lesson.",
 b:[{t:"txt",x:"Al-ḥadath al-akbar is the greater state of ritual impurity, lifted only by <b>ghusl</b> — washing the entire body with the intention of removing it. This is a matter of worship, not cleanliness: a person may be perfectly clean and still be in this state."},
    {t:"h",x:"While in this state you may not"},
    {t:"ul",x:["Pray, or make ṭawāf around the Kaʿbah.",
     "Touch or carry the muṣḥaf.",
     "Recite the Qur'an aloud from memory.",
     "Remain inside the masjid.",
     "Fast — in the states covered in the next lesson."]},
    {t:"h",x:"The two farḍ of ghusl (Shāfiʿī)"},
    {t:"ol",x:["<b>Niyyah</b> — to lift the major impurity, made as the water first reaches the body.",
     "<b>Water reaching every part of the body</b>, including the roots of the hair and the skin beneath it."]},
    {t:"one",x:"GHUSL",cap:"Head first, then the right side, then the left — until no part of the body is left dry."},
    {t:"h",x:"The complete method"},
    {t:"ol",x:["Wash both hands, then remove any impurity from the body.",
     "Perform a complete wudu.",
     "Pour water over the head three times, working it to the roots of the hair.",
     "Pour over the right side of the body, then the left.",
     "Ensure no part is left dry — behind the ears, the navel, between the toes.",
     "Wash the feet last if they were not washed in the wudu."]},
    {t:"rem",x:"Ghusl is one intention and water everywhere. Everything else is sunnah."}]},

{p:5,aud:"m",t:"Janābah — Causes and Rulings",ar:"الْجَنَابَة",
 sub:"The causes of major impurity, and what to do afterwards.",
 b:[{t:"h",x:"What brings about this state"},
    {t:"ul",x:["The emission of <b>manī</b> — in sleep or while awake, with or without desire present.",
     "<b>Jimāʿ</b> — marital relations, whether or not emission occurs.",
     "Embracing Islam.",
     "Death — the deceased is washed by others."]},
    {t:"h",x:"Waking and finding wetness"},
    {t:"txt",x:"If you wake and find wetness, ghusl is obligatory. If you remember a dream but find nothing, it is not. If you find wetness but remember no dream, ghusl is still obligatory. This is a normal part of growing up — not a fault, and not a thing to feel ashamed about."},
    {t:"h",x:"Manī, madhī and wadī"},
    {t:"tbl",head:["Discharge","Description","Ruling"],
     rows:[["Manī","Thick, released with desire","Ghusl obligatory"],
           ["Madhī","Thin and clear, with arousal","Wash the area, then wudu"],
           ["Wadī","Thick and white, after urination","Wash the area, then wudu"]]},
    {t:"h",x:"Afterwards"},
    {t:"ol",x:["Perform ghusl as taught in the previous lesson.",
     "Prayers missed while in this state are made up.",
     "If it occurs at night in Ramaḍān, perform ghusl and fast normally — the fast is valid even if the ghusl is delayed past Fajr."]},
    {t:"note",x:"If you are unsure which discharge occurred, ask your teacher privately. Nobody is embarrassed by a fiqh question."},
    {t:"rem",x:"Learn this before you need it. It is ordinary fiqh, and every Muslim is taught it."}]},

{p:5,aud:"f",t:"Ḥayḍ and Nifās",ar:"الْحَيْضُ وَالنِّفَاس",
 sub:"The causes of major impurity, and the rulings of the monthly cycle.",
 b:[{t:"h",x:"What brings about this state"},
    {t:"ul",x:["The emission of <b>manī</b>.",
     "<b>Jimāʿ</b> — marital relations.",
     "<b>Ḥayḍ</b> — the monthly cycle, once it ends.",
     "<b>Nifās</b> — post-childbirth bleeding, once it ends.",
     "Embracing Islam."]},
    {t:"h",x:"Ḥayḍ — a natural state"},
    {t:"txt",x:"This is something Allah created, not a punishment and not a fault. The Prophet ﷺ told ʿĀ'ishah (raḍiyallāhu ʿanhā) that it is something Allah has decreed for the daughters of Ādam."},
    {t:"tbl",head:["","Minimum","Usual","Maximum"],
     rows:[["Ḥayḍ","1 day and night","6–7 days","15 days"],
           ["Purity between","15 days","—","—"],
           ["Nifās","a moment","40 days","60 days"]]},
    {t:"h",x:"During ḥayḍ or nifās"},
    {t:"ul",x:["Prayer is <b>dropped entirely</b> — and is <b>not</b> made up afterwards.",
     "Fasting is <b>not</b> permitted — and <b>is</b> made up later, day for day.",
     "Ṭawāf, touching the muṣḥaf and remaining in the masjid are not permitted.",
     "Dhikr, duʿā and listening to the Qur'an remain fully permitted."]},
    {t:"note",x:"<b>Why prayer is not made up but fasting is.</b> Prayer returns five times a day and making it all up would be a burden Allah did not intend. Fasting comes once a year, so it is made up. The mercy is in the ruling itself."},
    {t:"h",x:"When it ends"},
    {t:"ol",x:["Purity is known by the flow stopping completely.",
     "Perform ghusl as taught in the previous lesson, working water to the roots of the hair.",
     "Braided hair need not be undone, so long as water reaches the scalp.",
     "Resume prayer from the next prayer whose time is present."]},
    {t:"note",x:"Bleeding outside the recognised pattern may be <b>istiḥāḍah</b>, which is ruled differently — prayer continues. Ask a female teacher rather than guessing."},
    {t:"rem",x:"Knowing these rulings is part of your worship. Learn them properly and without embarrassment."}]},

{p:5,t:"When There Is No Water",ar:"التَّيَمُّم وَالْمَسْح",
 sub:"Tayammum, and wiping over socks and bandages.",
 b:[{t:"txt",x:"Tayammum replaces wudu or ghusl when water is genuinely unavailable, or when using it would cause or worsen illness. It is a real substitute, not a lesser one."},
    {t:"h",x:"The farḍ of tayammum (Shāfiʿī)"},
    {t:"ol",x:["<b>Niyyah</b> — specifically to make the prayer permissible.",
     "Striking clean earth or dust and <b>wiping the whole face</b>.",
     "A second strike, wiping <b>both arms to the elbows</b>.",
     "<b>Tartīb</b> — face before arms."]},
    {t:"seq",x:"TAYAMMUM",cls:"three"},
    {t:"note",x:"<b>Shāfiʿī.</b> One tayammum permits <b>one</b> farḍ prayer, plus as many voluntary prayers as you wish. A new farḍ prayer requires a fresh tayammum."},
    {t:"h",x:"Masḥ over khuffayn"},
    {t:"txt",x:"Leather socks put on while in a state of wudu may be wiped instead of washing the feet: <b>one day and night</b> for a resident, <b>three days and nights</b> for a traveller. Major impurity ends the concession — for ghusl the socks must come off."},
    {t:"h",x:"Over a bandage"},
    {t:"txt",x:"Wash what you can reach and wipe gently over the dressing. Do not remove a bandage if doing so would harm the wound."},
    {t:"rem",x:"Allah does not intend hardship for you. Learn the concession properly and use it without guilt."}]}
];

/* 1 */{t:"എന്തിന് നിസ്കാരം",sub:"ഏഴ് ആകാശങ്ങൾക്ക് മുകളിൽ വെച്ച് നേരിട്ട് നൽകപ്പെട്ട ഒരേയൊരു ആരാധന.",
 b:["മറ്റെല്ലാ കൽപ്പനകളും ജിബ്‌രീൽ വഴി ഭൂമിയിലേക്ക് ഇറങ്ങിവന്നു. നിസ്കാരം മാത്രം ഇസ്റാഇന്റെയും മിഅ്റാജിന്റെയും രാത്രിയിൽ, ഏഴ് ആകാശങ്ങൾക്കും മുകളിൽ വെച്ച്, ഇടയിൽ ഒരു ദൂതനുമില്ലാതെ നബി ﷺ ക്ക് നൽകപ്പെട്ടു. അതിന്റെ ഭാരം അതിൽ നിന്ന് തന്നെ മനസ്സിലാക്കാം.",

  "ആദ്യം തൂക്കപ്പെടുന്നത്",

  "പിന്നെ നിയ്യത്ത്",

/* 4 */{t:"ബാങ്കും ഇഖാമത്തും",sub:"സമയം അറിയിക്കുന്ന വിളിയും നിസ്കാരം തുടങ്ങുന്ന വിളിയും.",
 b:["സമയമായി എന്ന് അറിയിക്കുന്നതാണ് ബാങ്ക്. നിസ്കാരം തുടങ്ങുന്നു എന്ന് അറിയിക്കുന്നതാണ് ഇഖാമത്ത്. അഞ്ച് നേരത്തെ നിസ്കാരങ്ങൾക്ക് രണ്ടും ശക്തമായ സുന്നത്താണ്.",
  "ബാങ്കിന് മറുപടി പറയൽ",
  "മുഅദ്ദിൻ പറയുന്നത് അതേപടി ഏറ്റുപറയൂ — ഹയ്യ അലസ്സ്വലാഹ്, ഹയ്യ അലൽ ഫലാഹ് എന്നിവയ്ക്ക് ശേഷം ഇങ്ങനെ പറയൂ:",
  "അല്ലാഹുവിനെക്കൊണ്ടല്ലാതെ ഒരു ശക്തിയും കഴിവുമില്ല.",
  "ബാങ്കിന് ശേഷമുള്ള ദുആ",
  "അല്ലാഹുവേ, ഈ പരിപൂർണമായ വിളിയുടെയും നിലനിൽക്കുന്ന നിസ്കാരത്തിന്റെയും റബ്ബേ, മുഹമ്മദ് നബി ﷺ ക്ക് വസീലയും ഫളീലത്തും ഉന്നത പദവിയും നൽകേണമേ. നീ വാഗ്ദാനം ചെയ്ത മഖാമ മഹ്മൂദിൽ അവിടുത്തെ എത്തിക്കേണമേ. അന്ത്യദിനത്തിൽ അവിടുത്തെ ശഫാഅത്ത് ഞങ്ങൾക്ക് നൽകേണമേ. തീർച്ചയായും നീ വാഗ്ദാനം ലംഘിക്കുന്നവനല്ല.",
  "ബാങ്കിന് ശേഷം ഈ ദുആ ചൊല്ലുന്നവന് അന്ത്യദിനത്തിൽ നബി ﷺ യുടെ ശഫാഅത്ത് ലഭിക്കും.",
  "ബാങ്ക് വിളിക്കുമ്പോൾ സംസാരിക്കരുത്. മറുപടി പറയൂ — മുപ്പത് സെക്കൻഡ് മതി, ഒരു വാഗ്ദാനവും അതിലുണ്ട്."]},
/* 5 */{t:"ഓരോ നിസ്കാരത്തിന്റെയും നിയ്യത്ത്",sub:"ഒറ്റയ്ക്ക്, ഇമാമിന്റെ പിന്നിൽ, ഇമാമായി — അഞ്ചിനും.",

  "ഒറ്റയ്ക്ക് നിസ്കരിക്കുമ്പോൾ — مُنْفَرِدًا",null,
  "ജമാഅത്തിൽ",
  "<span class='arb-inline'>لِلَّهِ تَعَالَى</span> എന്നതിന് മുമ്പ് ഒരു വാക്ക് ചേർക്കൂ:",
  {head:["നീ ആരാണ്","ചേർക്കേണ്ടത്","അർത്ഥം"],
   rows:[["ഇമാമിനെ പിന്തുടരുന്നു","<span style='font-family:Amiri,serif;font-size:14pt'>مَأْمُومًا</span>","മഅ്മൂമായി"],
     ["ഇമാമായി നിസ്കരിക്കുന്നു","<span style='font-family:Amiri,serif;font-size:14pt'>إِمَامًا</span>","ഇമാമായി"]]},
  "അതായത് ഇമാമിന്റെ പിന്നിലുള്ള ളുഹ്ർ ഇങ്ങനെയാകും: أُصَلِّي فَرْضَ الظُّهْرِ أَرْبَعَ رَكَعَاتٍ مُتَوَجِّهًا إِلَى الْقِبْلَةِ أَدَاءً مَأْمُومًا لِلَّهِ تَعَالَى",
  "<b>നഷ്ടപ്പെട്ട നിസ്കാരം വീട്ടുകയാണോ?</b> <span style='font-family:Amiri,serif'>أَدَاءً</span> (സമയത്ത്) എന്നതിന് പകരം <span style='font-family:Amiri,serif'>قَضَاءً</span> (വീട്ടൽ) എന്ന് ചേർക്കൂ.",
  "നാവ് മിണ്ടാതിരുന്നാലും കുഴപ്പമില്ല. മനസ്സ് മിണ്ടാതിരിക്കരുത്."]},
/* 6 */{t:"തക്ബീർ മുതൽ റുകൂഅ് വരെ",sub:"നിൽക്കൽ, തുടങ്ങൽ, ഓതൽ, കുനിയൽ.",
 b:[["ഖിബ്‌ലയിലേക്ക് തിരിഞ്ഞ്, കാലുകൾ അകത്തിവെച്ച്, സുജൂദ് ചെയ്യുന്ന സ്ഥലത്തേക്ക് നോക്കി നിൽക്കൂ.",
   "രണ്ട് കൈകളും ചുമലിന്റെ ഉയരത്തിൽ ഉയർത്തി <b>അല്ലാഹു അക്ബർ</b> എന്ന് പറയൂ — ഇതാണ് തക്ബീറത്തുൽ ഇഹ്‌റാം. ഈ നിമിഷത്തിലാണ് നിയ്യത്ത് മനസ്സിലുണ്ടാകേണ്ടത്.",
   "വലതു കൈ ഇടതു കൈയുടെ മുകളിൽ, നെഞ്ചിന് താഴെ പൊക്കിളിന് മുകളിൽ വെക്കൂ.",
   "ആദ്യം തുടക്കത്തിന്റെ ദുആ, പിന്നെ അഊദു, പിന്നെ ഫാതിഹ ഓതൂ.",
   "ഒരു ചെറിയ സൂറ ഓതൂ — ആദ്യത്തെ രണ്ട് റക്അത്തിൽ മാത്രം.",
   "അല്ലാഹു അക്ബർ പറഞ്ഞ്, കൈകൾ ഉയർത്തി, മുതുക് നേരെയാക്കി റുകൂഇലേക്ക് കുനിയൂ."],
  null,"റുകൂഇൽ","മഹാനായ എന്റെ റബ്ബ് എത്ര പരിശുദ്ധൻ, അവന് സ്തുതി. — മൂന്ന് തവണ",
  "ഉയരുമ്പോൾ — ഇഅ്തിദാൽ",
  "അല്ലാഹുവിനെ സ്തുതിച്ചവന്റെ സ്തുതി അല്ലാഹു കേട്ടു — ഉയരുമ്പോൾ പറയുന്നത്.",
  "ഞങ്ങളുടെ റബ്ബേ, എല്ലാ സ്തുതിയും നിനക്കാണ് — ആകാശങ്ങൾ നിറയെ, ഭൂമി നിറയെ, അതിന് ശേഷം നീ ഉദ്ദേശിക്കുന്നത് നിറയെ.",
  "<b>ശാഫിഈ.</b> ഓരോ റക്അത്തിലും ഫാതിഹ ഒരു റുക്‌നാണ് — ഇമാമിനും മഅ്മൂമിനും ഒരുപോലെ. ഇമാം കുനിയുന്നതിന് മുമ്പ് പൂർത്തിയാക്കാൻ കഴിഞ്ഞില്ലെങ്കിലും പിന്തുടരാം — പക്ഷേ കഴിയുന്നതുവരെ പഠിക്കൂ.",
  "അടങ്ങിയിരിക്കൽ ഒരു റുക്‌നാണ്. ശരീരം ഈ നിലയിൽ ഉറയ്ക്കുന്നതുവരെ അടുത്തതിലേക്ക് നീങ്ങരുത്."]},
/* 7 */{t:"സുജൂദ് മുതൽ സലാം വരെ",sub:"ദാസൻ റബ്ബിനോട് ഏറ്റവും അടുക്കുന്ന നിമിഷം, പിന്നെ നിസ്കാരം അവസാനിക്കുന്ന വിധം.",
 b:["സുജൂദ് <b>ഏഴ് അസ്ഥികളിലാണ്</b>: മൂക്കോടുകൂടിയ നെറ്റി, രണ്ട് ഉള്ളംകൈ, രണ്ട് മുട്ട്, രണ്ട് കാലിന്റെയും വിരലുകൾ. ഏഴും നിലത്ത് തൊടണം.",
  "അത്യുന്നതനായ എന്റെ റബ്ബ് എത്ര പരിശുദ്ധൻ, അവന് സ്തുതി. — മൂന്ന് തവണ",
  null,"രണ്ട് സുജൂദിനിടയിൽ ഇരിക്കുമ്പോൾ",
  "എന്റെ റബ്ബേ, എനിക്ക് പൊറുത്തുതരേണമേ, കരുണ ചെയ്യേണമേ, എന്നെ നന്നാക്കേണമേ, ഉയർത്തേണമേ, ഉപജീവനം നൽകേണമേ, നേർവഴി കാണിക്കേണമേ, സൗഖ്യം നൽകേണമേ, മാപ്പ് നൽകേണമേ.",
  "തശഹ്ഹുദ്, പിന്നെ സ്വലാത്ത്, പിന്നെ സലാം",
  "അവസാനത്തെ ഇരുത്തത്തിൽ തശഹ്ഹുദ്, പിന്നെ സ്വലാത്തുൽ ഇബ്രാഹീമിയ്യ, പിന്നെ ദുആ ചൊല്ലി, മുഖം വലത്തോട്ടും ഇടത്തോട്ടും തിരിച്ച് പറയൂ:",
  "നിങ്ങളുടെ മേൽ അല്ലാഹുവിന്റെ രക്ഷയും കാരുണ്യവും ഉണ്ടാകട്ടെ.",
  "അല്ലാഹുവിന്റെ മഹത്വം പറഞ്ഞ് നിസ്കാരം തുടങ്ങുന്നു, മറ്റുള്ളവർക്ക് സമാധാനം നേർന്ന് അവസാനിക്കുന്നു. ഒരു ചലനത്തിൽ ദീൻ മുഴുവനുമുണ്ട്."]},
/* 8 */{t:"നാം എന്താണ് ഓതുന്നത്",sub:"ഫാതിഹ, തശഹ്ഹുദ്, സ്വലാത്ത് — പിന്നെ സുബ്ഹിയിലെ ഖുനൂത്ത്.",
 b:["തശഹ്ഹുദ്",
  "എല്ലാ അഭിവാദ്യങ്ങളും അനുഗ്രഹങ്ങളും നല്ല കാര്യങ്ങളും അല്ലാഹുവിനാണ്. നബിയേ, അങ്ങയുടെ മേൽ അല്ലാഹുവിന്റെ രക്ഷയും കാരുണ്യവും അനുഗ്രഹങ്ങളും ഉണ്ടാകട്ടെ…",
  "സ്വലാത്തുൽ ഇബ്രാഹീമിയ്യ",
  "അല്ലാഹുവേ, ഇബ്രാഹീം നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ നീ അനുഗ്രഹം ചൊരിഞ്ഞതുപോലെ ഞങ്ങളുടെ നേതാവ് മുഹമ്മദ് നബി ﷺ യുടെയും കുടുംബത്തിന്റെയും മേൽ അനുഗ്രഹം ചൊരിയേണമേ. ഇബ്രാഹീം നബിയുടെയും കുടുംബത്തിന്റെയും മേൽ നീ ബറകത്ത് ചൊരിഞ്ഞതുപോലെ ഞങ്ങളുടെ നേതാവ് മുഹമ്മദ് നബി ﷺ യുടെയും കുടുംബത്തിന്റെയും മേൽ ബറകത്ത് ചൊരിയേണമേ. തീർച്ചയായും നീ സ്തുത്യർഹനും മഹത്വമുള്ളവനുമാണ്.",
  "സ്വലാത്തിന് ശേഷം, സലാമിന് മുമ്പുള്ള ദുആ",
  "അല്ലാഹുവേ, ഞാൻ മുമ്പ് ചെയ്തതും പിന്നീട് ചെയ്യുന്നതും, രഹസ്യമാക്കിയതും പരസ്യമാക്കിയതും, അതിരുകടന്നതും, എന്നെക്കാൾ നിനക്ക് നന്നായി അറിയാവുന്നതും എനിക്ക് പൊറുത്തുതരേണമേ. നീയാണ് മുന്തിക്കുന്നവനും പിന്തിക്കുന്നവനും. നീയല്ലാതെ ഒരു ദൈവവുമില്ല.",
  "അല്ലാഹുവേ, ഖബ്‌റിലെ ശിക്ഷയിൽ നിന്നും നരകശിക്ഷയിൽ നിന്നും ജീവിതത്തിന്റെയും മരണത്തിന്റെയും പരീക്ഷണത്തിൽ നിന്നും മസീഹുദ്ദജ്ജാലിന്റെ ഫിത്‌നയിൽ നിന്നും ഞാൻ നിന്നിൽ അഭയം തേടുന്നു.",
  "<b>ഖുനൂത്ത് — ഒരു ശാഫിഈ പതിവ്.</b> സുബ്ഹിയുടെ രണ്ടാം റക്അത്തിൽ, റുകൂഇൽ നിന്ന് ഉയർന്ന ശേഷം നിന്നുകൊണ്ട് ഖുനൂത്ത് ദുആ ഓതുന്നു. ഇത് സുന്നത്താണ്; മറന്നാൽ സഹ്‌വിന്റെ സുജൂദ് ചെയ്യണം. റമദാനിന്റെ അവസാന പകുതിയിൽ വിത്‌റിന്റെ അവസാന റക്അത്തിലും ഇത് ഓതുന്നു.",
  "ശബ്ദം മാത്രമല്ല, അർത്ഥവും പഠിക്കൂ. മനസ്സിലാകാത്തത് നിനക്ക് ഉദ്ദേശിക്കാനാവില്ല."]}
,
/* 9 */{t:"സലാമിന് ശേഷം",sub:"നിസ്കാരം മുഴുവനിലെയും ഏറ്റവും വിലപ്പെട്ട രണ്ട് മിനിറ്റ്.",
 b:[["<b>അസ്തഗ്ഫിറുല്ലാഹ്</b> — മൂന്ന് തവണ.",
   "<b>അല്ലാഹുമ്മ അൻതസ്സലാം വ മിൻകസ്സലാം, തബാറക്ത യാ ദൽജലാലി വൽ ഇക്‌റാം.</b>",
   "<b>ആയത്തുൽ കുർസി</b> — ഓരോ ഫർദ് നിസ്കാരത്തിന് ശേഷവും ഇത് ഓതുന്നവന് സ്വർഗത്തിനും അവനും ഇടയിൽ മരണമല്ലാതെ ഒന്നുമില്ല.",
   "<b>സുബ്ഹാനല്ലാഹ്</b> 33 · <b>അൽഹംദുലില്ലാഹ്</b> 33 · <b>അല്ലാഹു അക്ബർ</b> 34.",
   "മുആദ് ബ്നു ജബലിന് പഠിപ്പിച്ച ദുആ, താഴെ."],
  "അല്ലാഹുവേ, നിന്നെ ഓർക്കാനും നിനക്ക് നന്ദി പറയാനും നിന്നെ നന്നായി ആരാധിക്കാനും എന്നെ സഹായിക്കേണമേ.",
  "സലാം പറഞ്ഞ ഉടനെ എഴുന്നേൽക്കരുത്. നബി ﷺ ഖിബ്‌ലയിലേക്ക് തിരിഞ്ഞ് ഇരിക്കുമായിരുന്നു. ഈ ഏതാനും മിനിറ്റുകളുടെ പ്രതിഫലം അതിന്റെ ദൈർഘ്യത്തിന് ഒട്ടും ആനുപാതികമല്ല.",
  "കഠിനമായ ഭാഗം നീ ഇതിനകം ചെയ്തുകഴിഞ്ഞു. ഇത് അതിന്റെ പലിശയാണ്."]},
/* 10 */{t:"സഹ്‌വിന്റെ സുജൂദ്",sub:"മറന്നാൽ, കൂട്ടിയാൽ, എണ്ണം തെറ്റിയാൽ എന്ത് ചെയ്യണം.",
 b:["മറവി കാരണം കുഴഞ്ഞുപോയ നിസ്കാരം ശരിയാക്കുന്ന രണ്ട് സുജൂദാണ് സഹ്‌വിന്റെ സുജൂദ്. <b>ശാഫിഈ മദ്ഹബിൽ ഇത് സലാമിന് മുമ്പാണ്</b>, തശഹ്ഹുദിന് ശേഷം.",
  "എപ്പോൾ ചെയ്യണം",
  ["<b>സുന്നത്ത് അബ്ആദ്</b> ഒഴിവായാൽ — ആദ്യത്തെ തശഹ്ഹുദ് അല്ലെങ്കിൽ സുബ്ഹിയിലെ ഖുനൂത്ത് പോലെ.",
   "അബദ്ധത്തിൽ നിസ്കാരത്തിലെ ഒരു പ്രവൃത്തി കൂട്ടിയാൽ — ഒരു റുകൂഅ്, സുജൂദ് അല്ലെങ്കിൽ റക്അത്ത്.",
   "എത്ര റക്അത്ത് നിസ്കരിച്ചു എന്ന് ഉറപ്പില്ലെങ്കിൽ."],
  "സംശയത്തിന്റെ നിയമം",
  "<b>കുറഞ്ഞ എണ്ണത്തിൽ</b> ഉറച്ചുനിൽക്കൂ — അതാണ് നിനക്ക് ഉറപ്പുള്ളത്. മൂന്നാണോ നാലാണോ എന്ന് തീരുമാനിക്കാൻ കഴിയുന്നില്ലെങ്കിൽ മൂന്നായി കണക്കാക്കി നാലാമത്തേത് പൂർത്തിയാക്കി, സലാമിന് മുമ്പ് സഹ്‌വിന്റെ സുജൂദ് ചെയ്യൂ.",
  "രണ്ട് സുജൂദിൽ ഓതേണ്ടത്",
  "ഉറങ്ങുകയോ മറക്കുകയോ ചെയ്യാത്തവൻ എത്ര പരിശുദ്ധൻ. — രണ്ട് സുജൂദിലും ചൊല്ലുന്നത്",
  "ഈ രണ്ട് സുജൂദും നിസ്കാരത്തിലെ സുജൂദ് പോലെ തന്നെയാണ്, ഇടയിൽ ഇരുത്തത്തോടെ, അവസാന തശഹ്ഹുദിന് ശേഷം <b>സലാമിന് മുമ്പ്</b>.",
  "ഒഴിവായ ഒരു റുക്‌ൻ സഹ്‌വിന്റെ സുജൂദ് കൊണ്ട് നികത്താനാവില്ല. ഒരു റക്അത്ത് മുഴുവൻ മറന്നാൽ അത് നിസ്കരിക്കണം.",
  "മറവി മനുഷ്യസഹജമാണ്. അതിന്റെ പേരിൽ നിസ്കാരം ഉപേക്ഷിക്കാനാണ് പിശാച് ആഗ്രഹിക്കുന്നത് — പകരം അത് നന്നാക്കി തുടരൂ."]},
/* 11 */{t:"നിസ്കാരം മുറിയുന്നത്",sub:"മുറിക്കും എന്ന് ആളുകൾ കരുതുന്ന, യഥാർത്ഥത്തിൽ മുറിക്കാത്ത ചില കാര്യങ്ങളും.",
 b:["ഇവ നിസ്കാരം അസാധുവാക്കും",
  ["മനഃപൂർവം സംസാരിക്കൽ, ഒരു വാക്കാണെങ്കിലും.",
   "എന്തെങ്കിലും തിന്നുകയോ കുടിക്കുകയോ ചെയ്യൽ.",
   "നിസ്കാരവുമായി ബന്ധമില്ലാത്ത തുടർച്ചയായ ധാരാളം ചലനങ്ങൾ — തുടർച്ചയായി മൂന്ന് ചലനം.",
   "വുദൂ മുറിയൽ, അല്ലെങ്കിൽ വലിയ അശുദ്ധി ഉണ്ടാകൽ.",
   "ഔറത്ത് വെളിപ്പെടൽ, അല്ലെങ്കിൽ ശരീരത്തിലോ വസ്ത്രത്തിലോ സ്ഥലത്തോ നജസ് ആകൽ.",
   "നെഞ്ച് ഖിബ്‌ലയിൽ നിന്ന് തിരിക്കൽ.",
   "ഉറക്കെ ചിരിക്കൽ.",
   "മനഃപൂർവം ഒരു റുക്‌ൻ ഒഴിവാക്കൽ, അല്ലെങ്കിൽ നിയ്യത്ത് മാറ്റൽ."],
  "ഇവ മുറിക്കുകയില്ല",
  ["ഒഴിവാക്കാനാവാത്ത ഒരു ചെറിയ ചലനം — ഒരു തവണ ചൊറിയൽ, വസ്ത്രം നേരെയാക്കൽ.",
   "സ്വയം നിയന്ത്രിക്കാനാവാത്ത ചുമ, തുമ്മൽ, കോട്ടുവാ.",
   "ഇമാമിനെ തിരുത്താൻ സുബ്ഹാനല്ലാഹ് പറയൽ, അല്ലെങ്കിൽ സ്ത്രീ ഒരു തവണ കൈയടിക്കൽ.",
   "കണ്ണുനീർ, അല്ലെങ്കിൽ ഇഷ്ടമില്ലാതെ വരുന്ന ഒരു ചെറിയ ശബ്ദം.",
   "ഒരു കുട്ടി കടന്നുപോകൽ, അല്ലെങ്കിൽ മുന്നിലൂടെ ആരെയെങ്കിലും കടക്കുന്നത് തടയാനുള്ള ചെറിയ ചലനം."],
  "അവ്യക്തമായ ആശങ്ക കാരണം നിസ്കാരം വീണ്ടും തുടങ്ങരുത്. ശരിക്കും എന്താണ് മുറിക്കുന്നത് എന്ന് പഠിച്ച് ബാക്കിയുള്ളതിൽ സംശയിക്കുന്നത് നിർത്തൂ."]},
/* 12 */{t:"നഷ്ടപ്പെട്ട നിസ്കാരവും ഖദാഉം",sub:"പിന്നിൽ ബാക്കിയായ നിസ്കാരങ്ങൾ എന്ത് ചെയ്യണം.",
 b:["ന്യായമായ കാരണത്താൽ — ഉറക്കമോ യഥാർത്ഥ മറവിയോ — നഷ്ടപ്പെട്ട നിസ്കാരം ഉണരുമ്പോഴോ ഓർക്കുമ്പോഴോ ഉടനെ നിസ്കരിക്കണം. ഉറക്കത്തിൽ അശ്രദ്ധയില്ലെന്നും, അടുത്ത നിസ്കാരം വരുന്നതുവരെ വൈകിപ്പിക്കുന്നതിലാണ് അശ്രദ്ധയെന്നും നബി ﷺ പറഞ്ഞു.",
  "മനഃപൂർവം ഒഴിവാക്കിയ നിസ്കാരം വലിയ തെറ്റാണ്, എന്നിട്ടും അത് വീട്ടണം. ഖദാഅ് നിർബന്ധമായി തുടരുന്നു എന്നും, കടം തീരുന്നതുവരെ ഇപ്പോഴത്തെ നിസ്കാരങ്ങൾക്കൊപ്പം <b>ഉടനെയും ക്രമത്തിലും</b> വീട്ടണമെന്നുമാണ് ശാഫിഈ നിലപാട്.",
  "എങ്ങനെ വീട്ടാം",
  ["ക്രമം ഓർമ്മയുണ്ടെങ്കിൽ നഷ്ടപ്പെട്ട ക്രമത്തിൽ തന്നെ നിസ്കരിക്കൂ.",
   "<span style='font-family:Amiri,serif'>أَدَاءً</span> എന്നതിന് പകരം <span style='font-family:Amiri,serif'>قَضَاءً</span> ചേർത്ത് നിയ്യത്ത് വെക്കൂ.",
   "ഇന്നത്തെ അഞ്ചിനൊപ്പം ദിവസവും ഒരു നിശ്ചിത എണ്ണം നഷ്ടപ്പെട്ട നിസ്കാരങ്ങൾ ചേർക്കൂ.",
   "കടം യഥാർത്ഥവും കണ്ണിൽപ്പെടുന്നതുമാകാൻ എഴുതി കണക്ക് വെക്കൂ."],
  "നിരാശ തൗബയല്ല. വർഷങ്ങളോളം നിസ്കാരം നഷ്ടപ്പെടുത്തിയ ഒരാൾ അടുത്ത നിസ്കാരത്തിൽ നിന്ന് — ഇന്നത്തേതിൽ നിന്ന് — തുടങ്ങുന്നു, പിന്നെ കടം വീട്ടാൻ തുടങ്ങുന്നു.",
  "നഷ്ടപ്പെട്ടത് മാറ്റാൻ നിനക്കാവില്ല. പക്ഷേ ഇന്നുമുതൽ ഇനി നഷ്ടപ്പെടില്ല എന്ന് തീരുമാനിക്കാം."]},
/* 13 */{t:"യാത്രയിൽ",sub:"ചുരുക്കലും ചേർക്കലും — ഒരു ഇളവ്, ഒരു പഴുതല്ല.",
 b:["ഖസ്വ്ർ — ചുരുക്കൽ",
  "നിശ്ചിത ദൂരമുള്ള, അനുവദനീയമായ ആവശ്യത്തിനുള്ള യാത്രയിൽ നാല് റക്അത്തുള്ള ളുഹ്ർ, അസ്വ്ർ, ഇശാഅ് <b>രണ്ട്</b> റക്അത്തായി നിസ്കരിക്കുന്നു. സുബ്ഹിയും മഗ്‌രിബും ഒരിക്കലും ചുരുക്കാറില്ല.",
  "ജംഅ് — ചേർക്കൽ",
  {head:["ജോഡി","ചേർക്കുന്ന സമയം","പേര്"],
   rows:[["ളുഹ്ർ + അസ്വ്ർ","ളുഹ്‌റിന്റെ സമയത്ത്","ജംഅ് തഖ്ദീം"],["ളുഹ്ർ + അസ്വ്ർ","അസ്വറിന്റെ സമയത്ത്","ജംഅ് താഖീർ"],
     ["മഗ്‌രിബ് + ഇശാഅ്","മഗ്‌രിബിന്റെ സമയത്ത്","ജംഅ് തഖ്ദീം"],["മഗ്‌രിബ് + ഇശാഅ്","ഇശാഇന്റെ സമയത്ത്","ജംഅ് താഖീർ"]]},
  "നിന്റെ നാടിന്റെ കെട്ടിടങ്ങൾ കഴിഞ്ഞാൽ യാത്രയുടെ ഇളവ് തുടങ്ങുന്നു; തിരിച്ചെത്തുമ്പോഴോ ദീർഘകാലം താമസിക്കാൻ ഉദ്ദേശിക്കുമ്പോഴോ അത് അവസാനിക്കുന്നു.",
  "<b>നാട്ടുകാരനായ ഇമാമിന്റെ പിന്നിൽ</b> മുഴുവൻ എണ്ണവും നിസ്കരിക്കണം. ഒറ്റയ്ക്കോ മറ്റൊരു യാത്രക്കാരന്റെ പിന്നിലോ നിസ്കരിക്കുമ്പോഴാണ് ചുരുക്കൽ.",
  "അല്ലാഹു യാത്ര എളുപ്പമാക്കി, ഒഴിവാക്കിയില്ല. നിസ്കാരം ചുരുക്കൂ — ഒരിക്കലും ഉപേക്ഷിക്കരുത്."]},
/* 14 */{t:"ഇമാമിന്റെ പിന്നിൽ",sub:"ഇരുപത്തിയേഴ് ഇരട്ടി പ്രതിഫലം, അതിനൊപ്പം വരുന്ന മര്യാദകളും.",
 b:["ജമാഅത്തായുള്ള നിസ്കാരം ഒറ്റയ്ക്കുള്ളതിനെക്കാൾ ഇരുപത്തിയേഴ് ഇരട്ടിയാണെന്ന് നബി ﷺ പറഞ്ഞു. പുരുഷന്മാർക്ക് ഇത് ശക്തമായി ഊന്നിപ്പറയപ്പെട്ടിരിക്കുന്നു; സ്ത്രീകൾക്ക് വീട്ടിൽ നിസ്കരിക്കാൻ അനുവാദവും പ്രതിഫലവുമുണ്ട്, ജമാഅത്തിൽ ചേരാനും അനുവാദമുണ്ട്.",
  "വൈകി ചേരൽ — മസ്ബൂഖ്",
  ["<span style='font-family:Amiri,serif'>مَأْمُومًا</span> ചേർത്ത് നിയ്യത്ത് വെച്ച് തക്ബീർ ചൊല്ലൂ.",
   "ഇമാം ഏത് നിലയിലാണോ അതിൽ ചേരൂ — അദ്ദേഹം എഴുന്നേൽക്കാൻ കാത്തുനിൽക്കരുത്.",
   "റുകൂഅ് കിട്ടിയാൽ ആ റക്അത്ത് നിനക്ക് കിട്ടി.",
   "ഇമാം സലാം വീട്ടുമ്പോൾ എഴുന്നേറ്റ് ബാക്കി റക്അത്തുകൾ പൂർത്തിയാക്കൂ."],
  "സ്വഫ്ഫുകൾ",
  ["സ്വഫ്ഫ് നേരെയാക്കൂ; ചുമലോട് ചുമൽ, കാലോട് കാൽ.",
   "ആദ്യം മുൻനിര നിറയ്ക്കൂ, എല്ലാ വിടവും അടയ്ക്കൂ.",
   "മുന്നിലെ നിരയിൽ സ്ഥലമുള്ളപ്പോൾ പുതിയ നിര തുടങ്ങരുത്.",
   "ഇമാമിനെക്കാൾ മുന്നോട്ട് പോകരുത് — പിന്തുടരൂ, മത്സരിക്കരുത്."],
  null,
  "നേരായ സ്വഫ്ഫ് വെറും അലങ്കാരമല്ല. സ്വഫ്ഫുകൾ നേരെയാകുന്നതുവരെ നബി ﷺ നിസ്കാരം തുടങ്ങിയിരുന്നില്ല."]},
/* 15 */{t:"ജുമുഅ",sub:"സൂര്യൻ ഉദിക്കുന്ന ദിവസങ്ങളിൽ ഏറ്റവും ഉത്തമമായ ദിവസം.",
 b:["വെള്ളിയാഴ്ച ളുഹ്‌റിന് പകരമാണ് ജുമുഅ. പ്രായപൂർത്തിയായ, ബുദ്ധിയുള്ള, നാട്ടിൽ താമസിക്കുന്ന പുരുഷന്മാർക്ക് ഇത് നിർബന്ധമാണ്. രണ്ട് ഖുത്ബകൾക്ക് ശേഷമുള്ള രണ്ട് റക്അത്താണ് — ഖുത്ബ നിസ്കാരത്തിന്റെ ഭാഗമാണ്, അതിന്റെ ആമുഖമല്ല.",
  "ആ ദിവസത്തെ സുന്നത്തുകൾ",
  ["കുളിക്കുക, ഏറ്റവും നല്ല വൃത്തിയുള്ള വസ്ത്രം ധരിക്കുക.",
   "മിസ്‌വാക്ക് ഉപയോഗിക്കുക, സുഗന്ധം പൂശുക.",
   "നേരത്തെ പോകുക — എത്ര നേരത്തെ എത്തുന്നോ അത്ര പ്രതിഫലം.",
   "സൂറത്തുൽ കഹ്ഫ് ഓതുക.",
   "നബി ﷺ യുടെ മേൽ ധാരാളം സ്വലാത്ത് ചൊല്ലുക."],
  "<b>ഖുത്ബയുടെ സമയത്ത് മൗനം നിർബന്ധമാണ്.</b> ഇമാം സംസാരിക്കുമ്പോൾ കൂട്ടുകാരനോട് 'മിണ്ടരുത്' എന്ന് പറഞ്ഞാൽ പോലും നീ വൃഥാ സംസാരിച്ചു എന്ന് നബി ﷺ പറഞ്ഞു. ഫോൺ വേണ്ട, അടക്കം പറച്ചിൽ വേണ്ട, വായന വേണ്ട.",
  "വെള്ളിയാഴ്ചയിൽ ഒരു നിമിഷമുണ്ട് — ആ നേരത്ത് ഒരു മുസ്‌ലിം അല്ലാഹുവോട് നല്ലത് ചോദിച്ചാൽ അത് നൽകപ്പെടും. പല പണ്ഡിതരും അത് മഗ്‌രിബിന് മുമ്പുള്ള അവസാന നാഴികയിലാണെന്ന് പറയുന്നു.",
  "നേരത്തെ എത്തൂ, മുന്നിൽ ഇരിക്കൂ, മൗനമായിരിക്കൂ. ഒരുങ്ങിയെത്തുന്നവന് വെള്ളിയാഴ്ച പ്രതിഫലം നൽകുന്നു."]}
,
/* 16 */{t:"സുന്നത്തും നഫ്‌ലും",sub:"നബി ﷺ പതിവാക്കിയ പത്ത് റക്അത്ത്, പിന്നെ അതിനപ്പുറമുള്ള നിസ്കാരങ്ങൾ.",
 b:["ഏത് സമയത്തും എത്ര വേണമെങ്കിലും സുന്നത്ത് നിസ്കരിക്കാം. പക്ഷേ ഫർദ് നിസ്കാരങ്ങൾക്ക് മുമ്പും ശേഷവും നബി ﷺ <b>പതിവായി</b> നിർവഹിച്ചവയ്ക്ക് പ്രത്യേക സ്ഥാനമുണ്ട്. അവ <b>പത്ത് റക്അത്താണ്</b>, അവയെ <b>റവാതിബ്</b> എന്ന് വിളിക്കുന്നു.",
  {head:["നിസ്കാരം","മുമ്പ്","ശേഷം"],rows:[["സുബ്ഹി","2","—"],["ളുഹ്ർ","2","2"],["മഗ്‌രിബ്","—","2"],["ഇശാഅ്","—","2"]]},
  "ഇബ്നു ഉമർ (റ) പറഞ്ഞു: <i>നബി ﷺ യിൽ നിന്ന് പത്ത് റക്അത്ത് ഞാൻ മനഃപാഠമാക്കി — ളുഹ്‌റിന് മുമ്പ് രണ്ടും ശേഷം രണ്ടും, മഗ്‌രിബിന് ശേഷം വീട്ടിൽ രണ്ട്, ഇശാഇന് ശേഷം വീട്ടിൽ രണ്ട്, സുബ്ഹിക്ക് മുമ്പ് രണ്ട്.</i> (ബുഖാരി)",
  "സുബ്ഹിക്ക് മുമ്പുള്ള രണ്ട് — എല്ലാറ്റിലും ഏറ്റവും പ്രധാനം",
  "യാത്രയിൽ പോലും അവിടുന്ന് അവ ഒഴിവാക്കിയില്ല. അവിടുന്ന് പറഞ്ഞു: <i>ഈ രണ്ട് റക്അത്ത് എനിക്ക് ഈ ദുൻയാവിനെക്കാൾ പ്രിയപ്പെട്ടതാണ്.</i> (മുസ്‌ലിം, തിർമിദി, അഹ്മദ്)",
  "അബൂഹുറൈറ (റ) റിപ്പോർട്ട് ചെയ്യുന്നു: <i>കുതിരപ്പട നിങ്ങളെ ഓടിച്ചാലും സുബ്ഹിക്ക് മുമ്പുള്ള രണ്ട് റക്അത്ത് ഒഴിവാക്കരുത്.</i> (അഹ്മദ്, അബൂദാവൂദ്). ഈ രണ്ടിന് നൽകിയ ശ്രദ്ധ മറ്റൊരു സുന്നത്തിനും അവിടുന്ന് നൽകിയിട്ടില്ലെന്ന് ആഇശ (റ) പറഞ്ഞു. (ബുഖാരി, മുസ്‌ലിം)",
  ["<b>ലഘുവായും ചുരുക്കിയും</b> നിസ്കരിക്കൂ — ഫാതിഹ ഓതിയോ എന്ന് പോലും സംശയിച്ചെന്ന് ആഇശ (റ) പറഞ്ഞു.",
   "ആദ്യ റക്അത്തിൽ സൂറത്തുൽ കാഫിറൂനും രണ്ടാമത്തേതിൽ ഇഖ്‌ലാസും പതുക്കെ ഓതൂ. (അഹ്മദ്)",
   "പിന്നെ അവിടുന്ന് സുബ്ഹി നിസ്കാരം വരെ <b>വലതു വശം ചെരിഞ്ഞ് കിടക്കുമായിരുന്നു</b> — വീട്ടിൽ സുന്നത്ത് നിസ്കരിക്കുന്നവർക്കാണ് ഇത് ബാധകമെന്ന് പല പണ്ഡിതരും പറയുന്നു.",
   "നഷ്ടപ്പെട്ടാൽ സുബ്ഹി നിസ്കാരത്തിന് ശേഷം നിസ്കരിക്കാം."],
  "ളുഹ്ർ, മഗ്‌രിബ്, ഇശാഅ്",
  "ചിലപ്പോൾ നബി ﷺ ളുഹ്‌റിന് മുമ്പ് <b>നാലും</b> ശേഷം രണ്ടും നിസ്കരിച്ചു. ആഇശ (റ) ഇത് റിപ്പോർട്ട് ചെയ്തിട്ടുണ്ട് (അഹ്മദ്, മുസ്‌ലിം), ചിലപ്പോൾ ളുഹ്‌റിന് ശേഷം നാലും നിസ്കരിച്ചു. മഗ്‌രിബിന് മുമ്പ് രണ്ട് റക്അത്ത് അനുവദനീയമാണ്, പക്ഷേ അത് സ്ഥിരം പതിവാക്കരുത് — <i>മഗ്‌രിബിന് മുമ്പ് നിസ്കരിക്കൂ</i> എന്ന് പറഞ്ഞ ശേഷം അവിടുന്ന് <i>ഉദ്ദേശിക്കുന്നവർക്ക്</i> എന്ന് കൂട്ടിച്ചേർത്തു (ബുഖാരി), അത് ഉറപ്പുള്ള സുന്നത്തായി ആളുകൾ കണക്കാക്കുന്നത് അവിടുന്ന് ഇഷ്ടപ്പെട്ടില്ല.",
  "അസ്വ്ർ — ലഘുവായ ഒരു സുന്നത്ത്",
  "അസ്വറിന് മുമ്പ് നാല് റക്അത്ത് നിസ്കരിക്കാം. അവയ്ക്ക് റവാതിബിന്റെ സ്ഥാനമില്ല. <i>അസ്വറിന് മുമ്പ് നാല് റക്അത്ത് നിസ്കരിക്കുന്നവനോട് അല്ലാഹു കരുണ കാണിക്കട്ടെ.</i> (അബൂദാവൂദ്, തിർമിദി)",
  "മറ്റ് സുന്നത്ത് നിസ്കാരങ്ങൾ",
  {head:["നിസ്കാരം","എപ്പോൾ","റക്അത്ത്"],
   rows:[["വിത്ർ","ഇശാഇന് ശേഷം, രാത്രിയുടെ അവസാനം","1, 3, 5…"],["തഹജ്ജുദ്","രാത്രിയുടെ അവസാന മൂന്നിലൊന്ന്","രണ്ട് വീതം"],
     ["ളുഹാ","ഉച്ചയ്ക്ക് മുമ്പ് രാവിലെ","2 മുതൽ 8 വരെ"],["തഹിയ്യത്തുൽ മസ്ജിദ്","പള്ളിയിൽ കയറുമ്പോൾ","2"],
     ["വുദൂവിന് ശേഷം","വുദൂ പൂർത്തിയാക്കിയ ശേഷം","2"]]},
  "<b>സ്ഥലം മാറുക.</b> ഫർദ് നിസ്കരിച്ച അതേ സ്ഥലത്തല്ല, അൽപ്പം മുന്നിലോ പിന്നിലോ വലത്തോ ഇടത്തോ മാറി സുന്നത്ത് നിസ്കരിക്കണമെന്ന് അബൂഹുറൈറ (റ) വഴി വന്ന ഹദീസ് സൂചിപ്പിക്കുന്നു (അബൂദാവൂദ്).",
  "ദിവസം പത്ത് റക്അത്ത്, ഒരു വർഷം തുടർന്നാൽ — ഒരു തവണ നൂറ് നിസ്കരിക്കുന്നതിനെക്കാൾ ഒരാളെ അത് മാറ്റിമറിക്കും."]},
/* 17 */{t:"പ്രത്യേക സമയങ്ങളിലെ നിസ്കാരങ്ങൾ",sub:"ആവശ്യം വരുന്നതിന് മുമ്പ് എല്ലാ മുസ്‌ലിമും അറിഞ്ഞിരിക്കേണ്ട നാലെണ്ണം.",
 b:["മയ്യിത്ത് നിസ്കാരം",
  "ഇത് ഫർദ് കിഫായയാണ് — ചിലർ നിർവഹിച്ചാൽ ബാക്കിയുള്ളവരിൽ നിന്ന് ബാധ്യത ഒഴിവാകും. ഇതിന് <b>റുകൂഉം സുജൂദുമില്ല</b>: നാല് തക്ബീർ, മുഴുവൻ സമയവും നിൽക്കൽ. ആദ്യത്തേതിന് ശേഷം ഫാതിഹ; രണ്ടാമത്തേതിന് ശേഷം സ്വലാത്ത്; മൂന്നാമത്തേതിന് ശേഷം മയ്യിത്തിന് വേണ്ടി ദുആ; നാലാമത്തേതിന് ശേഷം സലാം.",
  null,"രണ്ട് പെരുന്നാളുകൾ",
  "അധിക തക്ബീറുകളോടെ രണ്ട് റക്അത്ത് — ആദ്യ റക്അത്തിൽ ഫാതിഹയ്ക്ക് മുമ്പ് ഏഴ്, രണ്ടാമത്തേതിൽ അഞ്ച് — പിന്നെ ഖുത്ബ. ഇത് ശക്തമായ സുന്നത്താണ്. ചെറിയ പെരുന്നാളിന് മുമ്പ് ഭക്ഷണം കഴിക്കൂ, ബലിപെരുന്നാളിന് ശേഷം കഴിക്കൂ.",
  "ഇസ്തിഖാറ നിസ്കാരം",
  "ഒരു തീരുമാനം എടുക്കേണ്ടിവരുമ്പോൾ രണ്ട് റക്അത്ത്, പിന്നെ ഇസ്തിഖാറയുടെ ദുആ. ഇത് ഒരു സ്വപ്നത്തിനായി കാത്തിരിക്കലല്ല — നീ നിസ്കരിക്കുന്നു, ആലോചിക്കുന്നു, പിന്നെ തിരഞ്ഞെടുക്കുന്നു; നല്ലതിലേക്ക് അല്ലാഹു തിരിക്കുമെന്ന് വിശ്വസിച്ചുകൊണ്ട്.",
  "അല്ലാഹുവേ, നിന്റെ അറിവ് കൊണ്ട് ഞാൻ നിന്നോട് നന്മ തേടുന്നു, നിന്റെ കഴിവ് കൊണ്ട് ഞാൻ കഴിവ് തേടുന്നു…",
  "സുജൂദുത്തിലാവത്ത്",
  "സുജൂദിന്റെ ആയത്ത് ഓതുകയോ കേൾക്കുകയോ ചെയ്താൽ അല്ലാഹു അക്ബർ പറഞ്ഞ് ഒരു സുജൂദ് ചെയ്ത് എഴുന്നേൽക്കുക. നിസ്കാരത്തിനുള്ളിലാണെങ്കിൽ അവിടെത്തന്നെ; പുറത്താണെങ്കിൽ ശുദ്ധിയോടെ ഖിബ്‌ലയിലേക്ക് തിരിഞ്ഞ്.",
  "മയ്യിത്ത് നിസ്കാരം ഇപ്പോൾ പഠിക്കൂ. ആവശ്യം വരുന്ന ദിവസം പഠിക്കാൻ സമയമുണ്ടാകില്ല."]},
/* 18 */{t:"ഖുശൂഅ്",sub:"മനസ്സ് ശരിക്കും ഹാജരായിക്കൊണ്ട് നിസ്കരിക്കൽ.",
 b:["രൂപത്തിൽ പൂർണവും ഉള്ളടക്കത്തിൽ ശൂന്യവുമായ ഒരു നിസ്കാരം ഉണ്ടാകാം. അവയവങ്ങളുടെ അടക്കവും മനസ്സിന്റെ സാന്നിധ്യവും ഒരുമിച്ചാണ് ഖുശൂഅ് — നിന്നെ മാറ്റിമറിക്കുന്ന നിസ്കാരത്തെ വെറും എണ്ണത്തിന് വേണ്ടിയുള്ള നിസ്കാരത്തിൽ നിന്ന് വേർതിരിക്കുന്നത് അതാണ്.",
  "നിൽക്കുന്നതിന് മുമ്പ്",
  ["വുദൂ പതുക്കെ, തിടുക്കമില്ലാതെ ചെയ്യൂ.",
   "ഫോൺ മറ്റൊരു മുറിയിൽ, കമിഴ്ത്തി, നിശ്ശബ്ദമാക്കി വെക്കൂ.",
   "സമയത്തിന്റെ തുടക്കത്തിൽ നിസ്കരിക്കൂ, തിരക്കിലാകുന്ന അവസാനത്തിലല്ല.",
   "നീ ആരോടാണ് സംസാരിക്കാൻ പോകുന്നത് എന്ന് ഓർക്കൂ."],
  "നിൽക്കുമ്പോൾ",
  ["സുജൂദ് ചെയ്യുന്ന സ്ഥലത്ത് കണ്ണുറപ്പിക്കൂ. കണ്ണാണ് ആദ്യം അലയുന്നത്; മനസ്സ് പിന്നാലെ പോകും.",
   "പറയുന്നത് മനസ്സിലാക്കൂ — ഈ ആഴ്ച ഫാതിഹയുടെ അർത്ഥം പഠിക്കൂ.",
   "ഓരോ ആയത്തിന്റെയും അവസാനം നിർത്തി പതുക്കെ ഓതൂ.",
   "മനസ്സ് അലയുമ്പോൾ ദേഷ്യപ്പെടാതെ തിരിച്ചുകൊണ്ടുവരൂ. അത് വീണ്ടും അലയും. വീണ്ടും തിരിച്ചുകൊണ്ടുവരൂ."],
  "ഒരാൾ നിസ്കാരം പൂർത്തിയാക്കിയാലും അതിന്റെ പത്തിലൊന്ന് മാത്രമേ അവന് എഴുതപ്പെടൂ എന്ന് നബി ﷺ പറഞ്ഞു — അവൻ ഹാജരായിരുന്ന ഭാഗം മാത്രം.",
  "ഇത് നിന്റെ അവസാനത്തെ നിസ്കാരമാണെന്ന് കരുതി നിസ്കരിക്കൂ. ഒരു ദിവസം അത് ശരിയാകും."]},
/* 19 */{t:"ചെറിയ അശുദ്ധി",sub:"വുദൂ എന്താണ് നീക്കുന്നത് — എന്താണ് വുദൂ മുറിക്കുന്നത്.",
 b:["വുദൂ ചെയ്യുന്നതുവരെ നിസ്കാരം തടയുന്ന അവസ്ഥയാണ് ഹദസുൽ അസ്ഗർ. ഇത് ശരീരത്തിലെ അഴുക്കല്ല; അത് നീക്കുന്നതുവരെ ഒരാളിൽ പറ്റിനിൽക്കുന്ന ഒരു വിധിയാണ്.",
  "വുദൂവിന്റെ ആറ് ഫർദുകൾ (ശാഫിഈ)",
  ["<b>നിയ്യത്ത്</b> — വെള്ളം ആദ്യം മുഖത്ത് തൊടുന്ന നിമിഷത്തിൽ.",
   "<b>മുഖം മുഴുവൻ</b> കഴുകൽ — മുടിയുടെ അതിർത്തി മുതൽ താടി വരെ, ചെവി മുതൽ ചെവി വരെ.",
   "<b>രണ്ട് കൈകളും മുട്ട് ഉൾപ്പെടെ</b> കഴുകൽ.",
   "<b>തലയുടെ ഒരു ഭാഗം</b> തടവൽ — ഏതാനും മുടിയിഴകൾ മതി.",
   "<b>രണ്ട് കാലുകളും നെരിയാണി ഉൾപ്പെടെ</b> കഴുകൽ.",
   "<b>തർതീബ്</b> — ഈ ക്രമത്തിൽ തന്നെ ചെയ്യൽ."],
  null,
  "വുദൂ മുറിക്കുന്നത് — നവാഖിദ് (ശാഫിഈ)",
  ["മുൻ-പിൻ ദ്വാരങ്ങളിലൂടെ എന്തെങ്കിലും പുറത്തുവരൽ — മൂത്രം, മലം, കാറ്റ്.",
   "ബോധം നഷ്ടപ്പെടൽ: ഉറക്കം, ബോധക്ഷയം, ലഹരി. <i>ഉറച്ചിരുന്ന് ഉറങ്ങിയാൽ മുറിയില്ല.</i>",
   "മഹ്‌റമല്ലാത്ത പ്രായപൂർത്തിയായ പുരുഷനും സ്ത്രീയും തമ്മിൽ മറയില്ലാതെ ത്വക്ക് സ്പർശിക്കൽ.",
   "<b>ഉള്ളംകൈകൊണ്ടോ വിരലുകളുടെ ഉൾഭാഗം കൊണ്ടോ</b> ഗുഹ്യഭാഗം സ്പർശിക്കൽ — സ്വന്തമോ മറ്റൊരാളുടെയോ."],
  "<b>സംശയത്തിന്റെ നിയമം.</b> ഉറപ്പ് സംശയം കൊണ്ട് നീങ്ങുകയില്ല. വുദൂ ഉണ്ടായിരുന്നു എന്ന് ഉറപ്പും അത് മുറിഞ്ഞോ എന്ന് സംശയവുമാണെങ്കിൽ നിനക്ക് വുദൂ ഉണ്ട്. വസ്‌വാസ് കാരണം വുദൂ ആവർത്തിക്കരുത്.",
  "മൂന്നും നാലും ശാഫിഈ നിലപാടുകളാണ്, മറ്റ് മദ്ഹബുകളിൽ വ്യത്യാസമുണ്ട്. നീ പഠിക്കുന്ന മദ്ഹബ് പിന്തുടരൂ."]},
/* 20 */{t:"വലിയ അശുദ്ധി",sub:"കുളി എന്താണ് നീക്കുന്നത്, എങ്ങനെ ചെയ്യണം. കാരണങ്ങൾ അടുത്ത പാഠത്തിൽ.",
 b:["ഹദസുൽ അക്ബർ വലിയ അശുദ്ധിയാണ്; <b>കുളി</b> കൊണ്ട് മാത്രമേ അത് നീങ്ങൂ — അത് നീക്കാനുള്ള നിയ്യത്തോടെ ശരീരം മുഴുവൻ കഴുകൽ. ഇത് ആരാധനയുടെ കാര്യമാണ്, വൃത്തിയുടെയല്ല: ഒരാൾ പൂർണമായി വൃത്തിയായിരുന്നിട്ടും ഈ അവസ്ഥയിലാകാം.",
  "ഈ അവസ്ഥയിൽ ഇവ പാടില്ല",
  ["നിസ്കരിക്കൽ, കഅ്ബ ത്വവാഫ് ചെയ്യൽ.",
   "മുസ്ഹഫ് തൊടൽ അല്ലെങ്കിൽ ചുമക്കൽ.",
   "ഖുർആൻ ഓർമ്മയിൽ നിന്ന് ഉറക്കെ ഓതൽ.",
   "പള്ളിക്കുള്ളിൽ താമസിക്കൽ.",
   "നോമ്പ് — അടുത്ത പാഠത്തിലെ അവസ്ഥകളിൽ."],
  "കുളിയുടെ രണ്ട് ഫർദുകൾ (ശാഫിഈ)",
  ["<b>നിയ്യത്ത്</b> — വലിയ അശുദ്ധി നീക്കാൻ, വെള്ളം ആദ്യം ശരീരത്തിൽ എത്തുമ്പോൾ.",
   "<b>ശരീരത്തിന്റെ എല്ലാ ഭാഗത്തും വെള്ളം എത്തൽ</b>, മുടിയുടെ വേരുകളും അതിനടിയിലെ ത്വക്കും ഉൾപ്പെടെ."],
  null,"പൂർണമായ രീതി",
  ["രണ്ട് കൈയും കഴുകി, ശരീരത്തിലെ നജസ് നീക്കൂ.",
   "പൂർണമായ വുദൂ ചെയ്യൂ.",
   "തലയിൽ മൂന്ന് തവണ വെള്ളം ഒഴിച്ച്, മുടിയുടെ വേരുകളിൽ എത്തിക്കൂ.",
   "വലതു വശത്ത്, പിന്നെ ഇടതു വശത്ത് ഒഴിക്കൂ.",
   "ഒരു ഭാഗവും ഉണങ്ങിയിരിക്കരുത് — ചെവിക്ക് പിന്നിൽ, പൊക്കിൾ, വിരലുകൾക്കിടയിൽ.",
   "വുദൂവിൽ കാലുകൾ കഴുകിയിട്ടില്ലെങ്കിൽ അവസാനം കഴുകൂ."],
  "കുളി എന്നാൽ ഒരു നിയ്യത്തും എല്ലായിടത്തും വെള്ളവുമാണ്. ബാക്കിയെല്ലാം സുന്നത്താണ്."]},
/* 21 */{t:"ജനാബത്ത് — കാരണങ്ങളും വിധികളും",sub:"വലിയ അശുദ്ധിയുടെ കാരണങ്ങളും അതിന് ശേഷം ചെയ്യേണ്ടതും.",
 b:["ഈ അവസ്ഥ ഉണ്ടാക്കുന്നത്",
  ["<b>മനിയ്യ്</b> പുറപ്പെടൽ — ഉറക്കത്തിലായാലും ഉണർവിലായാലും, ആഗ്രഹത്തോടെയായാലും അല്ലെങ്കിലും.",
   "<b>ജിമാഅ്</b> — ദാമ്പത്യബന്ധം, പുറപ്പെടലുണ്ടായാലും ഇല്ലെങ്കിലും.",
   "ഇസ്‌ലാം സ്വീകരിക്കൽ.",
   "മരണം — മയ്യിത്ത് മറ്റുള്ളവർ കുളിപ്പിക്കുന്നു."],
  "ഉണരുമ്പോൾ നനവ് കണ്ടാൽ",
  "ഉണർന്നപ്പോൾ നനവ് കണ്ടാൽ കുളി നിർബന്ധമാണ്. സ്വപ്നം ഓർമ്മയുണ്ട്, പക്ഷേ ഒന്നും കണ്ടില്ലെങ്കിൽ നിർബന്ധമില്ല. നനവ് കണ്ടു, പക്ഷേ സ്വപ്നം ഓർമ്മയില്ലെങ്കിലും കുളി നിർബന്ധമാണ്. ഇത് വളർച്ചയുടെ സ്വാഭാവിക ഭാഗമാണ് — ഒരു കുറ്റമല്ല, ലജ്ജിക്കേണ്ട കാര്യവുമല്ല.",
  "മനിയ്യ്, മദ്‌യ്, വദ്‌യ്",
  {head:["പുറപ്പെടുന്നത്","വിവരണം","വിധി"],
   rows:[["മനിയ്യ്","കട്ടിയുള്ളത്, ആഗ്രഹത്തോടെ","കുളി നിർബന്ധം"],
     ["മദ്‌യ്","നേർത്തതും തെളിഞ്ഞതും","സ്ഥലം കഴുകി വുദൂ"],
     ["വദ്‌യ്","കട്ടിയുള്ള വെളുത്തത്, മൂത്രത്തിന് ശേഷം","സ്ഥലം കഴുകി വുദൂ"]]},
  "അതിന് ശേഷം",
  ["കഴിഞ്ഞ പാഠത്തിൽ പഠിച്ചതുപോലെ കുളിക്കൂ.",
   "ഈ അവസ്ഥയിൽ നഷ്ടപ്പെട്ട നിസ്കാരങ്ങൾ വീട്ടണം.",
   "റമദാനിൽ രാത്രിയിലാണ് സംഭവിക്കുന്നതെങ്കിൽ കുളിച്ച് സാധാരണപോലെ നോമ്പെടുക്കൂ — സുബ്ഹി കഴിഞ്ഞ് കുളിച്ചാലും നോമ്പ് സാധുവാണ്."],
  "ഏത് പുറപ്പെടലാണെന്ന് ഉറപ്പില്ലെങ്കിൽ അധ്യാപകനോട് സ്വകാര്യമായി ചോദിക്കൂ. ഒരു ഫിഖ്ഹ് ചോദ്യത്തിന്റെ പേരിൽ ആരും ലജ്ജിക്കേണ്ടതില്ല.",
  "ആവശ്യം വരുന്നതിന് മുമ്പ് ഇത് പഠിക്കൂ. ഇത് സാധാരണ ഫിഖ്ഹാണ്, എല്ലാ മുസ്‌ലിമും ഇത് പഠിപ്പിക്കപ്പെടുന്നു."]},
/* 22 */{t:"ഹൈദും നിഫാസും",sub:"വലിയ അശുദ്ധിയുടെ കാരണങ്ങളും മാസമുറയുടെ വിധികളും.",
 b:["ഈ അവസ്ഥ ഉണ്ടാക്കുന്നത്",
  ["<b>മനിയ്യ്</b> പുറപ്പെടൽ.",
   "<b>ജിമാഅ്</b> — ദാമ്പത്യബന്ധം.",
   "<b>ഹൈദ്</b> — മാസമുറ, അത് അവസാനിക്കുമ്പോൾ.",
   "<b>നിഫാസ്</b> — പ്രസവാനന്തര രക്തസ്രാവം, അത് അവസാനിക്കുമ്പോൾ.",
   "ഇസ്‌ലാം സ്വീകരിക്കൽ."],
