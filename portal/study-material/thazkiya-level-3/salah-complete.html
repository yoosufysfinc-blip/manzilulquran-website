/* ================= RENDER ================= */
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
const book=document.getElementById('book');
let pageNo=0;

function niyTable(mode){
  const rows=NIY.map(r=>{
    let ar=r[3];
    if(mode) ar=ar.replace("لِلَّهِ تَعَالَى", mode+" لِلَّهِ تَعَالَى");
    return `<tr><td><b>${r[0]}</b></td><td>${r[2]}</td><td class="ar">${ar}</td></tr>`;
  }).join('');
  return `<table><thead><tr><th>${tx("nPrayer","Prayer")}</th><th>${tx("nRak","Rakʿah")}</th><th>${tx("nNiy","Niyyah")}</th></tr></thead><tbody>${rows}</tbody></table>`;
}


function figHTML(f,i){
  const media = IMG_STATUS==="ready"
    ? `<img src="${f.file}" alt="${f.lb}" loading="lazy">`
    : `<div class="ph"><div class="i">🖼️</div><div class="c">${f.file.replace("assets/img/","")}</div></div>`;
  const lb = T.lang==="ml" && FIG_ML[f.file.replace("assets/img/","")] ? FIG_ML[f.file.replace("assets/img/","")] : f.lb;
  return `<div class="fig"><div class="box">${i?`<span class="n">${i}</span>`:``}${media}</div>
    <div class="lb">${lb}</div><div class="lar">${f.ar}</div></div>`;
}
function seqHTML(arr,cls){
  return `<div class="blk"><div class="seq ${cls||''}">${arr.map((f,k)=>figHTML(f,k+1)).join('')}</div></div>`;
}
function oneHTML(f,cap){
  const media = IMG_STATUS==="ready"
    ? `<img src="${f.file}" alt="${f.lb}" loading="lazy">`
    : `<div class="ph" style="aspect-ratio:16/10"><div class="i">🖼️</div><div class="c">${f.file.replace("assets/img/","")}</div></div>`;
  return `<div class="blk"><div class="imgone"><div class="box">${media}</div></div>
    <div class="imgcap">${cap||f.lb}</div></div>`;
}

const T={lang:"en"};
try{T.lang=localStorage.getItem('slh_lang')||"en";}catch(e){}
const tx=(k,en)=>T.lang==="ml"&&UI_ML[k]!=null?UI_ML[k]:en;

/* merge a lesson with its Malayalam, keeping Arabic, tables of Arabic and images */
function mb(L,i){
  if(T.lang!=="ml"||!ML_L[i]) return L;
  const m=ML_L[i];
  const b=L.b.map((blk,k)=>{
    const v=m.b?m.b[k]:null;
    if(v==null) return blk;
    switch(blk.t){
      case "h": case "txt": case "note": case "rem": return {...blk,x:v};
      case "ar": return {...blk,en:v};
      case "ul": case "ol": return {...blk,x:v};
      case "tbl": return {...blk,head:v.head,rows:v.rows};
      case "one": return {...blk,cap:ONE_ML[blk.x]||blk.cap};
      default: return blk;
    }
  });
  return {...L,t:m.t,sub:m.sub,b};
}

function blocks(arr){
  return arr.map(b=>{
    switch(b.t){
      case "h":   return `<div class="blk"><div class="h">${b.x}</div></div>`;
      case "txt": return `<div class="blk"><p class="txt">${b.x}</p></div>`;
      case "ar":  return `<div class="blk"><div class="arb">${b.x}</div>`+
                         (b.tr?`<div class="trn">${b.tr}</div>`:``)+
                         (b.en?`<div class="mng">${b.en}</div>`:``)+`</div>`;
      case "ul":  return `<div class="blk"><ul class="pts">${b.x.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
      case "ol":  return `<div class="blk"><ol class="pts">${b.x.map(i=>`<li>${i}</li>`).join('')}</ol></div>`;
      case "tbl": return `<div class="blk"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`+
                         `<tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===1&&/[\u0600-\u06FF]/.test(c)?' class="ar"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case "niy": return `<div class="blk">${niyTable(b.mode)}</div>`;
      case "note":return `<div class="blk"><div class="note">${b.x}</div></div>`;
      case "rem": return `<div class="remember"><div class="rh">${tx("remember","Remember")}</div><p>${b.x}</p></div>`;
      case "seq": return seqHTML({POS_A:POSITIONS.slice(0,4),POS_B:POSITIONS.slice(4),
                    WUDU:WUDU,TAYAMMUM:TAYAMMUM}[b.x],b.cls);
      case "one": return oneHTML({SAFF:SINGLES.saff,JANAZAH:SINGLES.janazah,GHUSL:SINGLES.ghusl}[b.x],b.cap);
      default: return "";
    }
  }).join('');
}

function page(inner,partLabel,right,part){
  pageNo++;
  return `<section class="page p${part||1}">
    <div class="ptop"><span class="part">${partLabel||''}</span><span>${right||''}</span></div>
    ${inner}
    <div class="wm">${tx("wm","Ṣalāh Complete · Thazkiya Level 3")}</div>
    <div class="pno">${pageNo}</div>
  </section>`;
}

book.innerHTML=""; pageNo=0;
const SHOW=LESSONS;

/* cover */
book.appendChild(el(`<section class="page p1 cover">
  <img class="crest" src="/logo.png" alt="">
  <div class="car">الصَّلَاة</div>
  <div class="cen">ṢALĀH COMPLETE</div>
  <div class="cline"></div>
  <div class="cmeta">${tx("coverMeta","Thazkiya · Level 3<br>Twenty-three lessons in five parts<br>Shāfiʿī madhhab<br>ManzilulQuran E-learning Academy")}</div>
  <div class="wm">${tx("wm","Ṣalāh Complete · Thazkiya Level 3")}</div>
</section>`));

/* contents */
let toc='',cur=0;
SHOW.forEach((L,i)=>{
  if(L.p!==cur){cur=L.p;toc+=`<div class="grp">${T.lang==="ml"?PARTS_ML[cur]:PARTS[cur]}</div>`;}
  toc+=`<a href="#l${i+1}"><span class="n">${i+1}</span><span class="t">${L.t}</span>`+
       (L.aud?`<span class="tocaud">${AUD[L.aud]}</span>`:``)+`</a>`;
});
book.appendChild(el(`<section class="page p1">
  <h1 class="ltitle">${tx("contents","Contents")}</h1>
  <div class="rule"></div>
  <div class="toc">${toc}</div>
  <div class="wm">${tx("wm","Ṣalāh Complete · Thazkiya Level 3")}</div>
</section>`));

/* lessons */
SHOW.forEach((L0,i)=>{
  const L=mb(L0,i);
  const n=i+1;
  let inner=`<span class="lnum">${tx("lesson","Lesson")} ${n}</span>`+
    (L.aud?`<div><span class="aud">${AUD[L.aud]}</span></div>`:``)+`
    <h1 class="ltitle" id="l${n}">${L.t}</h1>
    <div class="lar">${L.ar}</div>
    <div class="lsub">${L.sub}</div>
    <div class="rule"></div>
    ${blocks(L.b)}`;
  book.appendChild(el(page(inner,(T.lang==="ml"?PARTS_ML:PARTS)[L.p],`${tx("lesson","Lesson")} ${n} ${tx("of","of")} ${SHOW.length}`,L.p)));
});
}
const langBtn=document.getElementById('langBtn');
const barMeta=document.getElementById('barMeta');

function paintLang(){
  document.body.classList.toggle("lang-ml",T.lang==="ml");
  document.documentElement.lang=T.lang;
  if(langBtn) langBtn.textContent = T.lang==="ml" ? "English" : "\u0d2e\u0d32\u0d2f\u0d3e\u0d33\u0d02";
  if(barMeta) barMeta.textContent = tx("barMeta","23 lessons \u00b7 Sh\u0101fi\u02bf\u012b");
}

if(langBtn){
  langBtn.addEventListener('click',()=>{
    T.lang = T.lang==="ml" ? "en" : "ml";
    try{localStorage.setItem('slh_lang',T.lang);}catch(e){}
    paintLang(); render(); window.scrollTo({top:0});
  });
}

paintLang();
render();



</script>
