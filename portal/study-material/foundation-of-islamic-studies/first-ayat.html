<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>My First Āyāt · أَوَّلُ آيَاتِي — ManzilulQuran</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCF8F0;
  --card:#FFFFFF;
  --ink:#2E3A46;
  --soft:#7C8A99;
  --teal:#0F7B7B;
  --teal-d:#0A5A5A;
  --teal-l:#B7E4E1;
  --gold:#C8912E;
  --gold-l:#F6E7C4;
  --rose:#C2566B;
  --line:#E7DFCE;
  --disp:'Lora',Georgia,serif;
  --ui:'Poppins',system-ui,sans-serif;
  --ar:'Amiri',serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--ui);color:var(--ink);background:var(--paper);min-height:100vh;line-height:1.7;
  background-image:
    radial-gradient(circle at 6% 8%,rgba(15,123,123,.07) 0 120px,transparent 121px),
    radial-gradient(circle at 94% 12%,rgba(200,145,46,.09) 0 140px,transparent 141px);
}
header{text-align:center;padding:26px 14px 10px}
header .ar-title{font-family:var(--ar);font-size:clamp(2rem,7vw,3rem);font-weight:700;color:var(--teal)}
header .en-title{font-family:var(--disp);font-size:clamp(1.1rem,3.4vw,1.5rem);font-weight:700;color:var(--ink);margin-top:2px}
header .sub{color:var(--soft);font-weight:500;font-size:.95rem;margin-top:4px}
header .back{display:inline-block;margin-bottom:12px;color:var(--teal);text-decoration:none;font-weight:600;font-size:.9rem}

nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:16px 12px;position:sticky;top:0;z-index:20;
  background:rgba(252,248,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav button{
  font-family:var(--ui);font-weight:600;font-size:.9rem;color:#fff;border:0;cursor:pointer;
  min-height:44px;padding:10px 16px;border-radius:100px;background:var(--teal);
  box-shadow:0 4px 0 var(--teal-d);transition:.15s;
}
nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
nav button.on{background:var(--gold);box-shadow:0 4px 0 #9a6f1f}

main{max-width:760px;margin:0 auto;padding:22px 14px 70px}
.screen{display:none}
.screen.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen-title{font-family:var(--disp);font-size:1.5rem;text-align:center;color:var(--teal-d);margin-bottom:4px}
.screen-hint{text-align:center;color:var(--soft);font-size:.95rem;margin-bottom:18px}

.tip{max-width:600px;margin:0 auto 18px;background:var(--teal-l);border-radius:var(--r);
  padding:12px 16px;font-weight:500;color:#0a4f4f;text-align:center;font-size:.95rem}
.warn{max-width:600px;margin:0 auto 18px;background:var(--gold-l);border-radius:var(--r);
  padding:12px 16px;font-weight:500;color:#7a5a12;text-align:center;font-size:.9rem}

/* ---------- joining ---------- */
.join-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;direction:rtl;margin-bottom:20px}
.jt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
.jt:active{transform:scale(.94)}
.jt .ar{font-family:var(--ar);font-size:2.1rem;font-weight:700;display:block;line-height:1.2;color:var(--ink)}
.jt .nm{font-size:.7rem;color:var(--soft);font-weight:600;display:block;direction:ltr}
.jt.no{border-color:var(--rose);background:#FDF3F5}
.jt.no .ar{color:var(--rose)}
.jt.selected{border-color:var(--gold);background:var(--gold-l)}

.faces{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:rtl;margin:14px 0}
.face{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 10px;min-width:92px;text-align:center}
.face .ar{font-family:var(--ar);font-size:2.6rem;font-weight:700;line-height:1.25;display:block;color:var(--teal)}
.face .lb{font-size:.72rem;font-weight:600;color:var(--soft);display:block;direction:ltr;margin-top:2px}
.face.dead{background:#FDF3F5;border-color:#F0D2D9}
.face.dead .ar{color:#D3AEB6}
.face.dead .lb{color:var(--rose)}

/* ---------- word builder ---------- */
.word-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;transition:.15s}
.wcard:active{transform:scale(.96)}
.wcard .ar{font-family:var(--ar);font-size:2.3rem;font-weight:700;color:var(--ink);display:block;line-height:1.4}
.wcard .en{font-size:.85rem;color:var(--soft);font-weight:600;display:block}
.wcard .parts{font-family:var(--ar);font-size:1.5rem;color:var(--teal);direction:rtl;margin-top:8px;
  max-height:0;overflow:hidden;opacity:0;transition:.25s}
.wcard.open{border-color:var(--teal)}
.wcard.open .parts{max-height:80px;opacity:1}

/* ---------- ayah cards ---------- */
.surah-head{background:var(--teal);color:#fff;border-radius:var(--r);padding:16px;text-align:center;margin:26px 0 14px}
.surah-head .ar{font-family:var(--ar);font-size:2rem;font-weight:700;line-height:1.4}
.surah-head .meta{font-size:.85rem;opacity:.9;font-weight:500}
.ayah{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;
  border-right:5px solid var(--gold)}
.ayah .no{display:inline-block;background:var(--gold-l);color:#7a5a12;font-weight:700;font-size:.75rem;
  border-radius:100px;padding:3px 11px;margin-bottom:8px}
.ayah .ar{font-family:var(--ar);font-size:1.9rem;font-weight:700;line-height:2.1;direction:rtl;text-align:right;color:var(--ink)}
.ayah .tr{font-style:italic;color:var(--teal-d);font-weight:500;font-size:.95rem;margin-top:6px}
.ayah .mn{color:var(--soft);font-size:.95rem;margin-top:2px}
.ayah .wbtn{margin-top:10px;background:none;border:1.5px solid var(--teal-l);color:var(--teal);
  font-family:var(--ui);font-weight:600;font-size:.8rem;min-height:36px;padding:6px 14px;border-radius:100px;cursor:pointer}
.ayah .words{display:flex;gap:8px;flex-wrap:wrap;direction:rtl;margin-top:10px;
  max-height:0;overflow:hidden;opacity:0;transition:.25s}
.ayah.open .words{max-height:400px;opacity:1}
.ayah .words span{background:var(--teal-l);color:#0a4f4f;font-family:var(--ar);font-size:1.5rem;
  font-weight:700;border-radius:10px;padding:4px 12px;line-height:1.7}

footer{text-align:center;color:var(--soft);font-size:.82rem;padding:24px 14px 40px;border-top:1px solid var(--line);margin-top:30px}

@media (max-width:480px){
  nav button{font-size:.82rem;padding:9px 13px}
  .screen-title{font-size:1.3rem}
  .ayah .ar{font-size:1.6rem;line-height:2}
  .face .ar{font-size:2.2rem}
  .join-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>

<header>
  <a class="back" href="index.html">← Foundation · Level 1</a>

  <div class="en-title">My First Āyāt</div>
  <div class="sub">Joining the letters, then reading real āyāt · Ages 8–10</div>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<footer>ManzilulQuran E-learning Academy · Foundation · Level 1</footer>

<script>
/* ==========================================================================
   DATA
   ⚠️ VERIFY THE ARABIC IN `SURAHS` AGAINST A MUṢḤAF BEFORE PUBLISHING.
   Spelling used here is Imlā'ī (the simpler teaching spelling), not Uthmānī.
   ========================================================================== */

const ZWJ='\u200D';

const LETTERS=[
 {ch:'ا',name:'Alif'},{ch:'ب',name:'Ba'},{ch:'ت',name:'Ta'},{ch:'ث',name:'Tha'},
 {ch:'ج',name:'Jeem'},{ch:'ح',name:'Ḥa'},{ch:'خ',name:'Kha'},{ch:'د',name:'Dal'},
 {ch:'ذ',name:'Dhal'},{ch:'ر',name:'Ra'},{ch:'ز',name:'Zay'},{ch:'س',name:'Seen'},
 {ch:'ش',name:'Sheen'},{ch:'ص',name:'Ṣad'},{ch:'ض',name:'Ḍad'},{ch:'ط',name:'Ṭa'},
 {ch:'ظ',name:'Ẓa'},{ch:'ع',name:'Ain'},{ch:'غ',name:'Ghain'},{ch:'ف',name:'Fa'},
 {ch:'ق',name:'Qaf'},{ch:'ك',name:'Kaf'},{ch:'ل',name:'Lam'},{ch:'م',name:'Meem'},
 {ch:'ن',name:'Noon'},{ch:'ه',name:'Ha'},{ch:'و',name:'Waw'},{ch:'ي',name:'Ya'}
];

/* the six that never join to the letter AFTER them */
const NOJOIN=['ا','د','ذ','ر','ز','و'];

const WORDS=[
  {w:'قَلَم', en:'pen',     parts:['ق','ل','م']},
  {w:'بَاب',  en:'door',    parts:['ب','ا','ب']},
  {w:'قَمَر', en:'moon',    parts:['ق','م','ر']},
  {w:'شَمْس', en:'sun',     parts:['ش','م','س']},
  {w:'بَيْت', en:'house',   parts:['ب','ي','ت']},
  {w:'نُور',  en:'light',   parts:['ن','و','ر']},
  {w:'كِتَاب',en:'book',    parts:['ك','ت','ا','ب']},
  {w:'مَسْجِد',en:'masjid', parts:['م','س','ج','د']}
];

const SURAHS=[
 {
  name:'الْفَاتِحَة', en:'Al-Fātiḥah', meta:'The Opening · 7 āyāt · Makkah',
  ayat:[
   {ar:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',
    tr:'Bismillāhi r-raḥmāni r-raḥīm',
    mn:'In the name of Allah, the Most Merciful, the Most Compassionate.'},
   {ar:'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',
    tr:'Al-ḥamdu lillāhi rabbi l-ʿālamīn',
    mn:'All praise is for Allah, Lord of all the worlds.'},
   {ar:'الرَّحْمَٰنِ الرَّحِيمِ',
    tr:'Ar-raḥmāni r-raḥīm',
    mn:'The Most Merciful, the Most Compassionate.'},
   {ar:'مَالِكِ يَوْمِ الدِّينِ',
    tr:'Māliki yawmi d-dīn',
    mn:'Master of the Day of Judgement.'},
   {ar:'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ',
    tr:'Iyyāka naʿbudu wa iyyāka nastaʿīn',
    mn:'You alone we worship, and You alone we ask for help.'},
   {ar:'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',
    tr:'Ihdinā ṣ-ṣirāṭa l-mustaqīm',
    mn:'Guide us to the straight path.'},
   {ar:'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ',
    tr:'Ṣirāṭa lladhīna anʿamta ʿalayhim ghayri l-maghḍūbi ʿalayhim wa lā ḍ-ḍāllīn',
    mn:'The path of those You have blessed — not of those who earned anger, nor of those who went astray.'}
  ]
 },
 {
  name:'الْإِخْلَاص', en:'Al-Ikhlāṣ', meta:'Sincerity · 4 āyāt · Makkah',
  ayat:[
   {ar:'قُلْ هُوَ اللَّهُ أَحَدٌ', tr:'Qul huwa llāhu aḥad', mn:'Say: He is Allah, the One.'},
   {ar:'اللَّهُ الصَّمَدُ', tr:'Allāhu ṣ-ṣamad', mn:'Allah, the Eternal, the Absolute.'},
   {ar:'لَمْ يَلِدْ وَلَمْ يُولَدْ', tr:'Lam yalid wa lam yūlad', mn:'He does not give birth, nor was He born.'},
   {ar:'وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ', tr:'Wa lam yakun lahū kufuwan aḥad', mn:'And there is none equal to Him.'}
  ]
 },
 {
  name:'الْفَلَق', en:'Al-Falaq', meta:'The Daybreak · 5 āyāt · Makkah',
  ayat:[
   {ar:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ', tr:'Qul aʿūdhu bi rabbi l-falaq', mn:'Say: I seek refuge in the Lord of the daybreak.'},
   {ar:'مِنْ شَرِّ مَا خَلَقَ', tr:'Min sharri mā khalaq', mn:'From the evil of what He created.'},
   {ar:'وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ', tr:'Wa min sharri ghāsiqin idhā waqab', mn:'And from the evil of darkness when it settles.'},
   {ar:'وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ', tr:'Wa min sharri n-naffāthāti fi l-ʿuqad', mn:'And from the evil of those who blow on knots.'},
   {ar:'وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ', tr:'Wa min sharri ḥāsidin idhā ḥasad', mn:'And from the evil of an envier when he envies.'}
  ]
 },
 {
  name:'النَّاس', en:'An-Nās', meta:'Mankind · 6 āyāt · Makkah',
  ayat:[
   {ar:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ', tr:'Qul aʿūdhu bi rabbi n-nās', mn:'Say: I seek refuge in the Lord of mankind.'},
   {ar:'مَلِكِ النَّاسِ', tr:'Maliki n-nās', mn:'The King of mankind.'},
   {ar:'إِلَٰهِ النَّاسِ', tr:'Ilāhi n-nās', mn:'The God of mankind.'},
   {ar:'مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ', tr:'Min sharri l-waswāsi l-khannās', mn:'From the evil of the sneaking whisperer.'},
   {ar:'الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ', tr:'Alladhī yuwaswisu fī ṣudūri n-nās', mn:'Who whispers into the hearts of mankind.'},
   {ar:'مِنَ الْجِنَّةِ وَالنَّاسِ', tr:'Mina l-jinnati wa n-nās', mn:'From among the jinn and mankind.'}
  ]
 }
];

/* ================= HELPERS ================= */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
const nav=document.getElementById('nav');
const main=document.getElementById('main');
const screens=[];
function addScreen(id,label){
  const s=el(`<section class="screen" id="${id}"></section>`);
  main.appendChild(s);
  const b=el(`<button>${label}</button>`);
  b.addEventListener('click',()=>show(id));
  nav.appendChild(b);
  screens.push({id,s,b});
  return s;
}
function show(id){
  screens.forEach(x=>{
    x.s.classList.toggle('on',x.id===id);
    x.b.classList.toggle('on',x.id===id);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
const joins=ch=>!NOJOIN.includes(ch);

/* ================= 1. JOINING ================= */
(function(){
  const s=addScreen('join','🤝 Joining');
  s.appendChild(el(`<h2 class="screen-title">Letters Hold Hands 🤝</h2>`));
  s.appendChild(el(`<p class="screen-hint">In a word, letters join together. But six letters never reach forward.</p>`));
  s.appendChild(el(`<div class="tip">✋ These six join to the letter <b>before</b> them, but never to the letter <b>after</b>: <span style="font-family:var(--ar);font-size:1.5rem">ا د ذ ر ز و</span></div>`));

  const g=el(`<div class="join-grid"></div>`);
  LETTERS.forEach(L=>{
    const no=!joins(L.ch);
    const t=el(`<div class="jt ${no?'no':''}"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></div>`);
    g.appendChild(t);
  });
  s.appendChild(g);
  s.appendChild(el(`<div class="tip">🔴 Red = does not join forward &nbsp;·&nbsp; the rest join both ways.</div>`));

  /* demo: same letters, one joining, one not */
  s.appendChild(el(`<h3 style="text-align:center;font-family:var(--disp);color:var(--teal-d);margin-top:24px">See the difference</h3>`));
  const demo=el(`<div class="faces"></div>`);
  [
    {t:'بـ + ـتـ + ـب',r:'بتب',lb:'all join'},
    {t:'د + ا + ر',r:'دار',lb:'د and ا stop'}
  ].forEach(D=>{
    demo.appendChild(el(`<div class="face"><span class="ar">${D.r}</span><span class="lb">${D.lb}</span></div>`));
  });
  s.appendChild(demo);
})();

/* ================= 2. THREE FACES ================= */
(function(){
  const s=addScreen('faces','🔤 Three Faces');
  s.appendChild(el(`<h2 class="screen-title">One Letter, Three Faces 🔤</h2>`));
  s.appendChild(el(`<p class="screen-hint">Tap a letter to see how it changes at the start, middle and end of a word.</p>`));

  const g=el(`<div class="join-grid"></div>`);
  s.appendChild(g);
  const out=el(`<div id="faceout" style="text-align:center;margin-top:18px"></div>`);
  s.appendChild(out);

  function render(L){
    const can=joins(L.ch);
    out.innerHTML='';
    out.appendChild(el(`<div style="font-weight:600;color:var(--soft)">${L.name} &nbsp;( ${L.ch} )</div>`));
    const row=el(`<div class="faces"></div>`);
    row.appendChild(el(`<div class="face"><span class="ar">${L.ch}</span><span class="lb">alone</span></div>`));
    row.appendChild(el(`<div class="face ${can?'':'dead'}"><span class="ar">${can?L.ch+ZWJ:'—'}</span><span class="lb">${can?'start':'no start form'}</span></div>`));
    row.appendChild(el(`<div class="face ${can?'':'dead'}"><span class="ar">${can?ZWJ+L.ch+ZWJ:'—'}</span><span class="lb">${can?'middle':'no middle form'}</span></div>`));
    row.appendChild(el(`<div class="face"><span class="ar">${ZWJ+L.ch}</span><span class="lb">end</span></div>`));
    out.appendChild(row);
    if(!can){
      out.appendChild(el(`<div class="tip">This is one of the six. It joins from the right only, so it has no start or middle face.</div>`));
    }
  }

  LETTERS.forEach((L,i)=>{
    const t=el(`<div class="jt ${joins(L.ch)?'':'no'}"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></div>`);
    t.addEventListener('click',()=>{
      g.querySelectorAll('.jt').forEach(x=>x.classList.remove('selected'));
      t.classList.add('selected');
      render(L);
    });
    g.appendChild(t);
    if(i===1){ setTimeout(()=>{t.classList.add('selected');render(L);},0); }
  });
})();

/* ================= 3. BUILD WORDS ================= */
(function(){
  const s=addScreen('words','🧩 Build Words');
  s.appendChild(el(`<h2 class="screen-title">From Letters to Words 🧩</h2>`));
  s.appendChild(el(`<p class="screen-hint">Read the word, then tap it to see the letters it is made from.</p>`));
  const g=el(`<div class="word-list"></div>`);
  WORDS.forEach(W=>{
    const parts=W.parts.join(' + ');
    const c=el(`<div class="wcard">
      <span class="ar">${W.w}</span>
      <span class="en">${W.en}</span>
      <div class="parts">${parts}</div>
    </div>`);
    c.addEventListener('click',()=>c.classList.toggle('open'));
    g.appendChild(c);
  });
  s.appendChild(g);
})();

/* ================= 4. AL-FĀTIḤAH ================= */
/* ================= 5. SHORT SŪRAHS ================= */
function buildSurah(s,S){
  s.appendChild(el(`<div class="surah-head">
    <div class="ar">${S.name}</div>
    <div class="meta">${S.en} · ${S.meta}</div>
  </div>`));
  S.ayat.forEach((A,i)=>{
    const card=el(`<div class="ayah">
      <span class="no">${i+1}</span>
      <div class="ar">${A.ar}</div>
      <div class="tr">${A.tr}</div>
      <div class="mn">${A.mn}</div>
      <button class="wbtn">Word by word ▾</button>
      <div class="words"></div>
    </div>`);
    const wrap=card.querySelector('.words');
    A.ar.split(' ').forEach(w=>wrap.appendChild(el(`<span>${w}</span>`)));
    card.querySelector('.wbtn').addEventListener('click',()=>card.classList.toggle('open'));
    s.appendChild(card);
  });
}

(function(){
  const s=addScreen('fatiha','🕌 Al-Fātiḥah');
  s.appendChild(el(`<h2 class="screen-title">Al-Fātiḥah 🕌</h2>`));
  s.appendChild(el(`<p class="screen-hint">The sūrah we read in every rakʿah. Read slowly — one āyah at a time.</p>`));
  buildSurah(s,SURAHS[0]);
})();

(function(){
  const s=addScreen('short','⭐ Short Sūrahs');
  s.appendChild(el(`<h2 class="screen-title">Three Short Sūrahs ⭐</h2>`));
  s.appendChild(el(`<p class="screen-hint">Al-Ikhlāṣ, Al-Falaq and An-Nās — short, beautiful, and easy to keep in your heart.</p>`));
  SURAHS.slice(1).forEach(S=>buildSurah(s,S));
})();

/* ---- hash routing ----
   class/index.html links students as  <path>#lesson1 .. #lesson5
   so those must resolve, as well as the friendly ids. */
const SCREEN_ORDER=['join','faces','words','fatiha','short'];
function fromHash(){
  const h=(location.hash||'').replace('#','');
  if(!h) return 'join';
  const m=h.match(/^lesson(\d+)$/);
  if(m) return SCREEN_ORDER[parseInt(m[1],10)-1] || 'join';
  return screens.some(x=>x.id===h) ? h : 'join';
}
show(fromHash());
window.addEventListener('hashchange',()=>show(fromHash()));
</script>
