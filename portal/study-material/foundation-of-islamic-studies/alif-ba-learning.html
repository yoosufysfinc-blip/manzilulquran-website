<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/og-image.jpg">
<title>Alif-Ba for Little Ones · ManzilulQuran</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9EF;
  --sky:#58C7E0;
  --sun:#FFC94D;
  --coral:#FF8A65;
  --mint:#6BCB77;
  --grape:#A78BDB;
  --ink:#3A3560;
  --fatha:#E8543F;   /* red-orange = fatha */
  --kasra:#2E9E63;   /* green = kasra */
  --damma:#2E7CD6;   /* blue = damma */
  --madd:#8E5BD6;    /* purple = madd */
  --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Baloo Bhaijaan 2','Comic Sans MS',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 8% 12%, rgba(88,199,224,.14) 0 90px, transparent 91px),
    radial-gradient(circle at 92% 8%, rgba(255,201,77,.20) 0 110px, transparent 111px),
    radial-gradient(circle at 85% 90%, rgba(167,139,219,.12) 0 100px, transparent 101px),
    radial-gradient(circle at 10% 88%, rgba(255,138,101,.12) 0 80px, transparent 81px);
}
header{text-align:center;padding:22px 12px 6px}
header .big-title{
  font-size:clamp(2rem,6vw,3.2rem);
  font-weight:800;
  line-height:1.1;
}
header .big-title .a{color:var(--coral)}
header .big-title .b{color:var(--sky)}
header .big-title .c{color:var(--mint)}
header .sub{font-size:1.05rem;color:#7a75a0;font-weight:700;margin-top:2px}

/* ---------- NAV ---------- */
nav{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:14px 10px;position:sticky;top:0;z-index:50;
  background:rgba(255,249,239,.94);backdrop-filter:blur(4px);
}
nav button{
  border:none;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:1rem;
  padding:9px 16px;border-radius:999px;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.12);
  transition:transform .12s;
}
nav button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
nav button.active{outline:4px solid rgba(58,53,96,.25);transform:scale(1.06)}
nav button:focus-visible{outline:4px solid var(--ink)}
.n-all{background:var(--sun);color:#6b4b00}
.n-g1{background:var(--coral)}
.n-g2{background:var(--sky)}
.n-g3{background:var(--mint)}
.n-g4{background:var(--grape)}
.n-g5{background:#F06292}
.n-madd{background:var(--madd)}
.n-book{background:#26A69A}
.n-colour{background:#8D6E63}

main{max-width:900px;margin:0 auto;padding:8px 14px 70px}
section.screen{display:none;animation:pop .3s ease}
section.screen.show{display:block}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.screen-title{
  text-align:center;font-size:1.5rem;font-weight:800;margin:14px 0 4px;
}
.screen-hint{text-align:center;color:#8b86ad;font-weight:700;margin-bottom:16px;font-size:1rem}

/* ---------- ALL LETTERS GRID ---------- */
.all-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));
  gap:12px;direction:rtl;
}
.tile{
  background:var(--card);border:none;cursor:pointer;
  border-radius:22px;padding:10px 4px 6px;text-align:center;
  box-shadow:0 6px 0 rgba(58,53,96,.10);
  font-family:inherit;color:var(--ink);
  transition:transform .12s;
}
.tile:active{transform:scale(.92)}
.tile:focus-visible{outline:4px solid var(--sky)}
.tile .ar{font-size:2.6rem;font-weight:800;line-height:1.15;display:block}
.tile .nm{font-size:.85rem;font-weight:700;color:#8b86ad;display:block}
.tile.wob{animation:wob .5s}
@keyframes wob{25%{transform:rotate(-6deg) scale(1.1)}55%{transform:rotate(5deg) scale(1.1)}100%{transform:rotate(0)}}

/* rainbow tile borders */
.tile:nth-child(6n+1){border-bottom:5px solid var(--coral)}
.tile:nth-child(6n+2){border-bottom:5px solid var(--sun)}
.tile:nth-child(6n+3){border-bottom:5px solid var(--mint)}
.tile:nth-child(6n+4){border-bottom:5px solid var(--sky)}
.tile:nth-child(6n+5){border-bottom:5px solid var(--grape)}
.tile:nth-child(6n+6){border-bottom:5px solid #F06292}

/* ---------- GROUP LETTER ROW ---------- */
.group-row{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));
  gap:12px;direction:rtl;margin-bottom:18px;
}
.group-row .tile .ar{font-size:3rem}
.tile.selected{outline:5px solid var(--sun);transform:scale(1.05)}

/* ---------- HARAKA STAGE ---------- */
.stage{
  background:var(--card);border-radius:28px;
  box-shadow:0 8px 0 rgba(58,53,96,.10);
  padding:18px 14px 20px;text-align:center;margin-bottom:22px;
}
.stage .who{font-size:1.15rem;font-weight:800;color:#8b86ad;margin-bottom:8px}
.haraka-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;direction:rtl}
.hcard{
  flex:1 1 100px;max-width:160px;
  border:none;cursor:pointer;font-family:inherit;
  border-radius:22px;padding:12px 6px 10px;
  transition:transform .12s;
}
.hcard:active{transform:scale(.9)}
.hcard:focus-visible{outline:4px solid var(--ink)}
.hcard .ar{font-size:3.4rem;font-weight:800;line-height:1.2;display:block;color:#fff}
.hcard .say{font-size:1.05rem;font-weight:800;color:rgba(255,255,255,.95);display:block}
.hcard.f{background:var(--fatha);box-shadow:0 6px 0 #b23a2a}
.hcard.k{background:var(--kasra);box-shadow:0 6px 0 #1f7047}
.hcard.d{background:var(--damma);box-shadow:0 6px 0 #1e58a0}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-weight:800;font-size:.95rem}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}

/* ---------- READING PRACTICE ---------- */
.practice{
  background:linear-gradient(135deg,#FFF3D6,#FFE9F0);
  border-radius:28px;padding:16px 14px 20px;margin-bottom:10px;
  box-shadow:0 8px 0 rgba(58,53,96,.08);
}
.practice h3{text-align:center;font-size:1.25rem;margin-bottom:2px}
.practice p{text-align:center;color:#8b86ad;font-weight:700;font-size:.95rem;margin-bottom:12px}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;direction:rtl}
.combo{
  background:#fff;border:none;cursor:pointer;font-family:inherit;
  border-radius:20px;padding:12px 6px;text-align:center;color:var(--ink);
  box-shadow:0 5px 0 rgba(58,53,96,.12);
  transition:transform .12s;
}
.combo:active{transform:scale(.9)}
.combo:focus-visible{outline:4px solid var(--coral)}
.combo .ar{font-size:2.7rem;font-weight:800;display:block;line-height:1.3}
.combo .tr{font-size:.95rem;font-weight:800;color:#8b86ad}
.shuffle{
  display:block;margin:16px auto 0;border:none;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:1.05rem;
  background:var(--sun);color:#6b4b00;padding:10px 24px;border-radius:999px;
  box-shadow:0 5px 0 #d9a52e;transition:transform .12s;
}
.shuffle:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a52e}

/* ---------- MADD ---------- */
.madd-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;direction:rtl;margin-bottom:20px}
.mcard{
  flex:1 1 150px;max-width:220px;background:#fff;border-radius:26px;
  padding:16px 10px;text-align:center;
  box-shadow:0 8px 0 rgba(58,53,96,.10);
  border-top:8px solid var(--madd);
}
.mcard .big{font-size:3.6rem;font-weight:800;color:var(--madd);line-height:1.25}
.mcard .rule{font-weight:800;font-size:1rem;color:var(--ink);margin-top:4px}
.mcard .long{font-size:1.1rem;font-weight:800;color:#8b86ad}
.mcard button{
  margin-top:8px;border:none;cursor:pointer;font-family:inherit;font-weight:800;
  background:var(--madd);color:#fff;border-radius:999px;padding:6px 18px;font-size:1rem;
  box-shadow:0 4px 0 #6a41a5;
}
.mcard button:active{transform:translateY(3px)}

.tip{
  max-width:560px;margin:0 auto 16px;background:#EAF7FF;border-radius:20px;
  padding:12px 16px;font-weight:700;color:#3d6e85;text-align:center;font-size:1rem;
}

/* ---------- TEXT BOOK (A4 pages) ---------- */
.a4page{
  background:#fff;border-radius:14px;
  aspect-ratio:210/297;width:100%;max-width:640px;
  margin:0 auto 26px;padding:26px 22px;
  box-shadow:0 10px 24px rgba(58,53,96,.15);
  border:6px solid #FFE9B8;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
.a4page .pg-head{
  text-align:center;font-weight:800;font-size:1.3rem;margin-bottom:10px;
  color:var(--ink);
}
.a4page .pg-head small{display:block;font-size:.85rem;color:#8b86ad}
.word-grid{
  flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;
  gap:12px;direction:rtl;
}
.wcard{
  border-radius:18px;text-align:center;padding:8px 4px;
  display:flex;flex-direction:column;justify-content:center;
  border:3px dashed #E8DFF5;background:#FDFBFF;
  cursor:pointer;user-select:none;transition:transform .12s;position:relative;overflow:visible;
}
.wcard:active{transform:scale(.95)}
.wcard .pic{font-size:2.6rem;line-height:1.1;display:inline-block}
.wcard .wr{font-size:2rem;font-weight:800;color:var(--ink);line-height:1.4}
.wcard .wm{font-size:.9rem;font-weight:800;color:#8b86ad}

/* ---- object animations (tap a word card) ---- */
.anim-bounce{animation:a-bounce .9s ease}
@keyframes a-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-20px) scale(1.12)}55%{transform:translateY(0)}72%{transform:translateY(-9px)}88%{transform:translateY(0)}}
.anim-wave{animation:a-wave 1s ease;transform-origin:70% 90%}
@keyframes a-wave{0%,100%{transform:rotate(0)}20%{transform:rotate(24deg)}40%{transform:rotate(-18deg)}60%{transform:rotate(18deg)}80%{transform:rotate(-9deg)}}
.anim-swim{animation:a-swim 1.4s ease}
@keyframes a-swim{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-16px) translateY(-6px) rotate(-9deg)}50%{transform:translateX(0) translateY(2px)}75%{transform:translateX(16px) translateY(-6px) rotate(9deg)}}
.anim-walk{animation:a-walk 1.5s ease}
@keyframes a-walk{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-10px) rotate(-4deg) translateY(-3px)}30%{transform:translateX(-20px) rotate(3deg)}50%{transform:translateX(-26px) rotate(-3deg) translateY(-3px)}70%{transform:translateX(-14px) rotate(3deg)}85%{transform:translateX(-5px) rotate(-2deg)}}
.anim-flap{animation:a-flap .8s ease}
@keyframes a-flap{0%,100%{transform:rotate(0) translateY(0)}15%{transform:rotate(-12deg) translateY(-10px)}30%{transform:rotate(10deg) translateY(-16px)}50%{transform:rotate(-10deg) translateY(-10px)}70%{transform:rotate(8deg) translateY(-4px)}}
.anim-spin{animation:a-spin 1s ease}
@keyframes a-spin{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}
.anim-sway{animation:a-sway 1.3s ease;transform-origin:50% 100%}
@keyframes a-sway{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}88%{transform:rotate(-3deg)}}
.anim-glow{animation:a-glow 1.2s ease}
@keyframes a-glow{0%,100%{transform:scale(1);filter:brightness(1)}35%{transform:scale(1.25);filter:brightness(1.7) drop-shadow(0 0 14px #FFC94D)}65%{transform:scale(1.15);filter:brightness(1.5) drop-shadow(0 0 8px #FFC94D)}}
.anim-stomp{animation:a-stomp .9s ease}
@keyframes a-stomp{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-14px)}40%{transform:translateY(4px) scale(1.15,.85)}55%{transform:translateY(-8px) scale(1)}70%{transform:translateY(3px) scale(1.1,.9)}}
.anim-pour{animation:a-pour 1.2s ease;transform-origin:50% 80%}
@keyframes a-pour{0%,100%{transform:rotate(0)}30%{transform:rotate(-38deg) translateY(-4px)}60%{transform:rotate(-38deg) translateY(-4px)}}
.anim-open{animation:a-open 1.2s ease;transform-origin:15% 50%}
@keyframes a-open{0%,100%{transform:perspective(300px) rotateY(0)}35%{transform:perspective(300px) rotateY(-55deg)}65%{transform:perspective(300px) rotateY(-55deg)}}
.anim-rain{animation:a-rain 1.2s ease}
@keyframes a-rain{0%,100%{transform:translateY(0)}20%{transform:translateY(6px)}40%{transform:translateY(-3px)}60%{transform:translateY(6px)}80%{transform:translateY(-2px)}}
.anim-flutter{animation:a-flutter 1.5s ease}
@keyframes a-flutter{0%{transform:translateY(-18px) rotate(0)}25%{transform:translateY(-8px) rotate(14deg) translateX(8px)}50%{transform:translateY(0px) rotate(-12deg) translateX(-8px)}75%{transform:translateY(6px) rotate(8deg) translateX(4px)}100%{transform:translateY(0) rotate(0) translateX(0)}}
.anim-splash{animation:a-splash 1.2s ease}
@keyframes a-splash{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-24px) rotate(-14deg)}55%{transform:translateY(4px) rotate(6deg)}75%{transform:translateY(-6px) rotate(-3deg)}}
/* rooster crows: crouch, rear back, puff chest and tremble, then settle */
.anim-crow{animation:a-crow 1.6s ease}
@keyframes a-crow{
  0%,100%{transform:translateY(0) rotate(0) scale(1)}
  14%{transform:translateY(3px) rotate(3deg) scale(1.05,.9)}
  30%{transform:translateY(-11px) rotate(-15deg) scale(1.2)}
  40%{transform:translateY(-12px) rotate(-18deg) scale(1.22)}
  47%{transform:translateY(-11px) rotate(-13deg) scale(1.22)}
  54%{transform:translateY(-12px) rotate(-18deg) scale(1.22)}
  61%{transform:translateY(-11px) rotate(-14deg) scale(1.2)}
  80%{transform:translateY(1px) rotate(1deg) scale(1.02,.96)}
}
.crow-note{
  position:absolute;top:4px;right:12px;font-size:1.3rem;pointer-events:none;
  animation:a-note 1.6s ease forwards;
}
@keyframes a-note{
  0%,20%{opacity:0;transform:translateY(10px) scale(.5) rotate(0)}
  35%{opacity:1;transform:translateY(0) scale(1) rotate(-8deg)}
  100%{opacity:0;transform:translateY(-30px) scale(1.35) rotate(14deg)}
}
.pg-num{
  position:absolute;bottom:8px;left:0;right:0;text-align:center;
  font-weight:800;color:#c9c3e6;font-size:.9rem;
}

/* ---------- COLOURING ---------- */
.palette{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  position:sticky;top:64px;z-index:40;
  background:rgba(255,249,239,.95);padding:10px;border-radius:20px;margin-bottom:14px;
}
.crayon{
  width:42px;height:42px;border-radius:50%;border:4px solid #fff;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .12s;
}
.crayon:active{transform:scale(.85)}
.crayon.picked{outline:5px solid var(--ink);transform:scale(1.15)}
.crayon:focus-visible{outline:5px solid var(--ink)}
.crayon.eraser{background:#fff;font-size:1.3rem;line-height:1}
.colour-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:14px;direction:rtl;
}
.cletter{
  background:#fff;border:none;cursor:pointer;font-family:inherit;
  border-radius:22px;padding:6px 2px 2px;text-align:center;
  box-shadow:0 6px 0 rgba(58,53,96,.10);
  transition:transform .12s;
}
.cletter:active{transform:scale(.93)}
.cletter:focus-visible{outline:4px solid var(--sun)}
.cletter .big{
  font-size:4.2rem;font-weight:800;line-height:1.2;display:block;
  color:transparent;
  -webkit-text-stroke:2.5px var(--ink);
  paint-order:stroke fill;
}
.cletter .nm{font-size:.85rem;font-weight:700;color:#8b86ad;display:block;padding-bottom:4px}

/* ---------- PRINT (book + colouring on real A4) ---------- */
@media print{
  nav,header,footer,.palette,.shuffle,.screen-hint{display:none!important}
  body{background:#fff}
  section.screen{display:none!important}
  section.screen.show{display:block!important}
  .a4page{box-shadow:none;border-color:#eee;page-break-after:always;max-width:100%}
  .cletter{box-shadow:none;border:1px solid #eee}
}

footer{text-align:center;color:#b9b4d4;font-weight:700;padding:20px;font-size:.9rem}

@media (max-width:480px){
  .tile .ar{font-size:2.2rem}
  .group-row .tile .ar{font-size:2.5rem}
  .hcard .ar{font-size:2.8rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="big-title"><span class="a">أَلِف</span> <span class="b">بَاء</span> <span class="c">تَاء</span> 🌈</div>
  <div class="sub">Learn 📚 · Read 👀 · Colour 🖍️ — for little stars ⭐</div>
</header>

<nav id="nav"></nav>

<main id="main"></main>

<footer>ManzilulQuran E-learning Academy 🌙 Made with love for little readers</footer>

<script>
/* ================= DATA ================= */
const LETTERS=[
 {ch:'ا',name:'Alif',tr:'a',alif:true},
 {ch:'ب',name:'Ba',tr:'b'},
 {ch:'ت',name:'Ta',tr:'t'},
 {ch:'ث',name:'Tha',tr:'th'},
 {ch:'ج',name:'Jeem',tr:'j'},
 {ch:'ح',name:'Ḥa',tr:'ḥ'},
 {ch:'خ',name:'Kha',tr:'kh'},
 {ch:'د',name:'Dal',tr:'d'},
 {ch:'ذ',name:'Dhal',tr:'dh'},
 {ch:'ر',name:'Ra',tr:'r'},
 {ch:'ز',name:'Zay',tr:'z'},
 {ch:'س',name:'Seen',tr:'s'},
 {ch:'ش',name:'Sheen',tr:'sh'},
 {ch:'ص',name:'Ṣad',tr:'ṣ'},
 {ch:'ض',name:'Ḍad',tr:'ḍ'},
 {ch:'ط',name:'Ṭa',tr:'ṭ'},
 {ch:'ظ',name:'Ẓa',tr:'ẓ'},
 {ch:'ع',name:'Ain',tr:'ʿ'},
 {ch:'غ',name:'Ghain',tr:'gh'},
 {ch:'ف',name:'Fa',tr:'f'},
 {ch:'ق',name:'Qaf',tr:'q'},
 {ch:'ك',name:'Kaf',tr:'k'},
 {ch:'ل',name:'Lam',tr:'l'},
 {ch:'م',name:'Meem',tr:'m'},
 {ch:'ن',name:'Noon',tr:'n'},
 {ch:'ه',name:'Ha',tr:'h'},
 {ch:'و',name:'Waw',tr:'w'},
 {ch:'ي',name:'Ya',tr:'y'}
];
const FATHA='\u064E', KASRA='\u0650', DAMMA='\u064F';
const HARAKAT=[
 {mark:FATHA,cls:'f',v:'a',label:'Fatha'},
 {mark:KASRA,cls:'k',v:'i',label:'Kasra'},
 {mark:DAMMA,cls:'d',v:'u',label:'Damma'}
];
const GROUPS=[[0,6],[6,12],[12,18],[18,24],[24,28]];
const GROUP_COLORS=['coral','sky','mint','grape','pink'];

/* ================= AUDIO (speech) ================= */
let arVoice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    arVoice=vs.find(v=>v.lang&&v.lang.startsWith('ar'))||null;
  }catch(e){}
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function say(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ar-SA';
    if(arVoice)u.voice=arVoice;
    u.rate=0.75;u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* fun tap feedback used everywhere audio was removed */
function popIt(elm){elm.classList.remove('wob');void elm.offsetWidth;elm.classList.add('wob');}

/* ================= HELPERS ================= */
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function harakaChar(L,mark){
  // Alif with harakat is shown as bare alif + mark (simple qaida style)
  return L.ch+mark;
}
function trSyll(L,v){ return (L.alif?'':L.tr)+v; }
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ================= NAV & SCREENS ================= */
const nav=document.getElementById('nav');
const main=document.getElementById('main');
const screens=[];

function addScreen(id,btnLabel,btnClass){
  const s=el(`<section class="screen" id="${id}"></section>`);
  main.appendChild(s);
  const b=el(`<button class="${btnClass}">${btnLabel}</button>`);
  b.addEventListener('click',()=>showScreen(id,b));
  nav.appendChild(b);
  screens.push({id,btn:b,sec:s});
  return s;
}
/* deep links from the course page / class sheet: #lesson3 opens group 3 */
function openFromHash(){
  const h=(location.hash||'').replace('#','');
  const m=h.match(/^(?:lesson|group|g)(\d+)$/i);
  if(m){ const gi=Math.max(1,Math.min(5,parseInt(m[1],10)))-1; showScreen('g'+gi); }
}
window.addEventListener('hashchange',openFromHash);
function showScreen(id){
  screens.forEach(s=>{
    s.sec.classList.toggle('show',s.id===id);
    s.btn.classList.toggle('active',s.id===id);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= SCREEN 1: ALL LETTERS ================= */
(function(){
  const s=addScreen('all','🌟 All Letters','n-all');
  s.appendChild(el(`<h2 class="screen-title">All 28 Letters 🎉</h2>`));
  s.appendChild(el(`<p class="screen-hint">Tap a letter to hear its name!</p>`));
  const g=el(`<div class="all-grid"></div>`);
  LETTERS.forEach(L=>{
    const t=el(`<button class="tile"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    t.addEventListener('click',()=>{
      t.classList.remove('wob');void t.offsetWidth;t.classList.add('wob');
      say(L.ch);
    });
    g.appendChild(t);
  });
  s.appendChild(g);
})();

/* ================= GROUP SCREENS ================= */
GROUPS.forEach((range,gi)=>{
  const letters=LETTERS.slice(range[0],range[1]);
  const navCls='n-g'+(gi+1);
  const s=addScreen('g'+gi,`${gi+1}️⃣ Letters ${range[0]+1}–${range[1]}`,navCls);

  s.appendChild(el(`<h2 class="screen-title">Group ${gi+1} 🎈</h2>`));
  s.appendChild(el(`<p class="screen-hint">Tap a letter, then tap its sounds below! 👇</p>`));

  /* letter row */
  const row=el(`<div class="group-row"></div>`);
  s.appendChild(row);

  /* haraka stage */
  const stage=el(`<div class="stage">
    <div class="who" id="who-${gi}">Pick a letter! ☝️</div>
    <div class="haraka-row" id="hr-${gi}"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--fatha)"></span> Fatha = "a"</span>
      <span><span class="dot" style="background:var(--kasra)"></span> Kasra = "i"</span>
      <span><span class="dot" style="background:var(--damma)"></span> Damma = "u"</span>
    </div>
  </div>`);
  s.appendChild(stage);

  const who=stage.querySelector('#who-'+gi);
  const hr=stage.querySelector('#hr-'+gi);

  function selectLetter(L,tileEl){
    row.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
    tileEl.classList.add('selected');
    who.textContent=`${L.name} ( ${L.ch} ) says...`;
    hr.innerHTML='';
    HARAKAT.forEach(H=>{
      const syll=harakaChar(L,H.mark);
      const c=el(`<button class="hcard ${H.cls}">
        <span class="ar">${syll}</span>
        <span class="say">${trSyll(L,H.v)}</span>
      </button>`);
      c.addEventListener('click',()=>popIt(c));
      hr.appendChild(c);
    });
  }

  letters.forEach((L,i)=>{
    const t=el(`<button class="tile"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    t.addEventListener('click',()=>selectLetter(L,t));
    row.appendChild(t);
    if(i===0){ /* preselect first letter without audio */
      setTimeout(()=>{
        t.classList.add('selected');
        who.textContent=`${L.name} ( ${L.ch} ) says...`;
        HARAKAT.forEach(H=>{
          const syll=harakaChar(L,H.mark);
          const c=el(`<button class="hcard ${H.cls}">
            <span class="ar">${syll}</span>
            <span class="say">${trSyll(L,H.v)}</span>
          </button>`);
          c.addEventListener('click',()=>popIt(c));
          hr.appendChild(c);
        });
      },0);
    }
  });

  /* reading practice: 2-letter combos */
  const prac=el(`<div class="practice">
    <h3>🎯 Reading Time!</h3>
    <p>Just for fun — tap and read two letters together!</p>
    <div class="combo-grid" id="cg-${gi}"></div>
  </div>`);
  s.appendChild(prac);
  const cg=prac.querySelector('#cg-'+gi);

  function makeCombos(){
    cg.innerHTML='';
    // avoid alif as first letter of a combo (it carries the sound oddly for beginners)
    const pool=letters.filter(L=>!L.alif);
    const first=pool.length?pool:letters;
    for(let i=0;i<6;i++){
      const L1=rand(first), L2=rand(letters.filter(L=>!L.alif).length?letters.filter(L=>!L.alif):letters);
      const H1=rand(HARAKAT), H2=rand(HARAKAT);
      const txt=L1.ch+H1.mark+L2.ch+H2.mark;
      const tr=trSyll(L1,H1.v)+trSyll(L2,H2.v);
      const c=el(`<button class="combo"><span class="ar">${txt}</span><span class="tr">${tr}</span></button>`);
      c.addEventListener('click',()=>popIt(c));
      cg.appendChild(c);
    }
  }
  makeCombos();
  const sh=el(`<button class="shuffle">🎲 New letters!</button>`);
  sh.addEventListener('click',makeCombos);
  prac.appendChild(sh);
});

/* ================= MADD SCREEN ================= */
(function(){
  const s=addScreen('madd','🎈 Madd  ا و ي','n-madd');
  s.appendChild(el(`<h2 class="screen-title">Madd — Looong Sounds! 🐘</h2>`));
  s.appendChild(el(`<p class="screen-hint">Three magic letters make sounds streeeetch: ا و ي</p>`));

  s.appendChild(el(`<div class="tip">🧸 Stretch the sound like pulling chewing gum — “baaaa”!</div>`));

  const cards=el(`<div class="madd-cards"></div>`);
  const MADD=[
    {big:'بَا',rule:'Fatha + ا',long:'baaa 🔴',v:'aa'},
    {big:'بُو',rule:'Damma + و',long:'buuu 🔵',v:'uu'},
    {big:'بِي',rule:'Kasra + ي',long:'biii 🟢',v:'ii'}
  ];
  MADD.forEach(M=>{
    const c=el(`<div class="mcard">
      <div class="big">${M.big}</div>
      <div class="rule">${M.rule}</div>
      <div class="long">${M.long}</div>
    </div>`);
    cards.appendChild(c);
  });
  s.appendChild(cards);

  /* madd practice */
  const prac=el(`<div class="practice">
    <h3>🎯 Long Reading Time!</h3>
    <p>Tap and stretch the sound!</p>
    <div class="combo-grid" id="cg-madd"></div>
  </div>`);
  s.appendChild(prac);
  const cg=prac.querySelector('#cg-madd');
  const MADDSET=[
    {mark:FATHA,tail:'ا',v:'aa'},
    {mark:DAMMA,tail:'و',v:'uu'},
    {mark:KASRA,tail:'ي',v:'ii'}
  ];
  function makeMadd(){
    cg.innerHTML='';
    const pool=LETTERS.filter(L=>!L.alif&&L.ch!=='و'&&L.ch!=='ي');
    for(let i=0;i<6;i++){
      const L=rand(pool), M=rand(MADDSET);
      const txt=L.ch+M.mark+M.tail;
      const c=el(`<button class="combo"><span class="ar">${txt}</span><span class="tr">${L.tr+M.v}</span></button>`);
      c.addEventListener('click',()=>popIt(c));
      cg.appendChild(c);
    }
  }
  makeMadd();
  const sh=el(`<button class="shuffle">🎲 New sounds!</button>`);
  sh.addEventListener('click',makeMadd);
  prac.appendChild(sh);
})();

/* ================= TEXT BOOK SCREEN ================= */
(function(){
  const s=addScreen('book','📖 Book','n-book');
  s.appendChild(el(`<h2 class="screen-title">My First Words Book 📖</h2>`));
  s.appendChild(el(`<p class="screen-hint">Read the word, then tap the card — the picture comes alive! 🎬 (Printable pages 🖨️)</p>`));

  const WORDS=[
    {ar:'أَبٌ',pic:'👨',tr:'Abun',mn:'Father',anim:'wave'},
    {ar:'يَدٌ',pic:'✋',tr:'Yadun',mn:'Hand',anim:'wave'},
    {ar:'بَابٌ',pic:'🚪',tr:'Baabun',mn:'Door',anim:'open'},
    {ar:'تُوتٌ',pic:'🫐',tr:'Tootun',mn:'Berry',anim:'bounce'},
    {ar:'جَمَلٌ',pic:'🐪',tr:'Jamalun',mn:'Camel',anim:'walk'},
    {ar:'حُوتٌ',pic:'🐋',tr:'Ḥootun',mn:'Whale',anim:'splash'},
    {ar:'دِيكٌ',pic:'🐓',tr:'Deekun',mn:'Rooster',anim:'crow'},
    {ar:'ذَهَبٌ',pic:'🪙',tr:'Dhahabun',mn:'Gold',anim:'spin'},
    {ar:'سَمَكٌ',pic:'🐟',tr:'Samakun',mn:'Fish',anim:'swim'},
    {ar:'شَجَرٌ',pic:'🌳',tr:'Shajarun',mn:'Tree',anim:'sway'},
    {ar:'عِنَبٌ',pic:'🍇',tr:'Inabun',mn:'Grapes',anim:'bounce'},
    {ar:'فِيلٌ',pic:'🐘',tr:'Feelun',mn:'Elephant',anim:'stomp'},
    {ar:'قَمَرٌ',pic:'🌙',tr:'Qamarun',mn:'Moon',anim:'glow'},
    {ar:'كُوبٌ',pic:'🥤',tr:'Koobun',mn:'Cup',anim:'pour'},
    {ar:'لَبَنٌ',pic:'🥛',tr:'Labanun',mn:'Milk',anim:'pour'},
    {ar:'مَطَرٌ',pic:'🌧️',tr:'Maṭarun',mn:'Rain',anim:'rain'},
    {ar:'نُورٌ',pic:'💡',tr:'Noorun',mn:'Light',anim:'glow'},
    {ar:'وَرَقٌ',pic:'📄',tr:'Waraqun',mn:'Paper',anim:'flutter'}
  ];

  const PER_PAGE=6;
  const titles=['Easy Words! 🌟','More Words! 🎈','You Can Read! 🏆'];
  for(let p=0;p*PER_PAGE<WORDS.length;p++){
    const page=el(`<div class="a4page">
      <div class="pg-head">${titles[p]||'More Words!'}<small>Read the word, find the picture!</small></div>
      <div class="word-grid"></div>
      <div class="pg-num">— ${p+1} —</div>
    </div>`);
    const grid=page.querySelector('.word-grid');
    WORDS.slice(p*PER_PAGE,(p+1)*PER_PAGE).forEach(W=>{
      const card=el(`<div class="wcard" role="button" tabindex="0">
        <div class="pic">${W.pic}</div>
        <div class="wr">${W.ar}</div>
        <div class="wm">${W.tr} · ${W.mn}</div>
      </div>`);
      const pic=card.querySelector('.pic');
      const play=()=>{
        pic.className='pic';void pic.offsetWidth;
        pic.classList.add('anim-'+W.anim);
        if(W.anim==='crow'){
          const note=el(`<span class="crow-note">🎵🎶</span>`);
          card.appendChild(note);
          note.addEventListener('animationend',()=>note.remove());
        }
      };
      card.addEventListener('click',play);
      card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
      grid.appendChild(card);
    });
    s.appendChild(page);
  }
})();

/* ================= COLOURING SCREEN ================= */
(function(){
  const s=addScreen('colour','🖍️ Colouring','n-colour');
  s.appendChild(el(`<h2 class="screen-title">Colour the Letters! 🖍️</h2>`));
  s.appendChild(el(`<p class="screen-hint">Pick a crayon, then tap the letters to colour them! (Or print for real crayons 🖨️)</p>`));

  const COLORS=['#E8543F','#FF9F1C','#FFC94D','#6BCB77','#58C7E0','#2E7CD6','#A78BDB','#F06292','#8D6E63'];
  let picked=COLORS[0];

  const pal=el(`<div class="palette"></div>`);
  COLORS.forEach((col,i)=>{
    const b=el(`<button class="crayon${i===0?' picked':''}" style="background:${col}" aria-label="Colour ${col}"></button>`);
    b.addEventListener('click',()=>{
      picked=col;
      pal.querySelectorAll('.crayon').forEach(x=>x.classList.remove('picked'));
      b.classList.add('picked');
    });
    pal.appendChild(b);
  });
  const eraser=el(`<button class="crayon eraser" aria-label="Eraser">🧽</button>`);
  eraser.addEventListener('click',()=>{
    picked=null;
    pal.querySelectorAll('.crayon').forEach(x=>x.classList.remove('picked'));
    eraser.classList.add('picked');
  });
  pal.appendChild(eraser);
  s.appendChild(pal);

  const grid=el(`<div class="colour-grid"></div>`);
  LETTERS.forEach(L=>{
    const c=el(`<button class="cletter"><span class="big">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    const big=c.querySelector('.big');
    c.addEventListener('click',()=>{
      popIt(c);
      big.style.color=picked?picked:'transparent';
    });
    grid.appendChild(c);
  });
  s.appendChild(grid);
})();
