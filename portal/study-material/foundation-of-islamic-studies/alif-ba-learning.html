<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alif Bā Tā · أَلِف بَاء تَاء — ManzilulQuran</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF6EA; --card:#FFFDF7; --line:#E8DFC8;
  --ink:#1F3A30; --soft:#6C8478;
  --em:#0B4D3B; --em-l:#DCEDE4; --gold:#C9A96E; --gold-l:#F6E9CC;
  --fatha:#E8543F; --kasra:#2E7CD6; --damma:#3EA96B;
  --coral:#F2705B; --sky:#4FA8DE; --mint:#54C3A0; --grape:#9B7BD4; --pink:#EE7FA8;
  --ui:'Nunito',system-ui,-apple-system,sans-serif;
  --disp:'Baloo 2','Nunito',cursive;
  --ar:'Amiri',serif;
  --r:20px;
  --sh:0 14px 32px -20px rgba(11,77,59,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--ui);color:var(--ink);line-height:1.6;min-height:100vh;
  background:
    radial-gradient(760px 360px at 104% -6%,rgba(201,169,110,.22),transparent 60%),
    radial-gradient(680px 340px at -10% 12%,rgba(220,237,228,.7),transparent 58%),
    var(--paper);
  background-attachment:fixed;padding-bottom:88px}

/* ---------------- header ---------------- */
.bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  background:rgba(251,246,234,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .home{width:42px;height:42px;min-height:42px;flex:0 0 auto;border:0;border-radius:13px;
  background:linear-gradient(140deg,var(--em),#07301f);color:#fff;font-size:17px;cursor:pointer;
  display:grid;place-items:center;transition:.18s}
.bar .home:hover{transform:translateY(-2px)}
.bar .ttl{min-width:0;flex:1}
.bar .ttl h1{font-family:var(--disp);font-size:17px;font-weight:700;color:var(--em);
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl .sub{font-size:11px;color:var(--soft);white-space:nowrap}

/* transliteration switch */
.trsw{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);
  background:var(--card);border-radius:100px;padding:5px 9px 5px 11px;cursor:pointer;min-height:42px}
.trsw .lab{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--soft);line-height:1}
.trsw .knob{width:38px;height:22px;border-radius:100px;background:var(--em);position:relative;transition:.22s}
.trsw .knob::after{content:"";position:absolute;top:3px;left:19px;width:16px;height:16px;
  border-radius:50%;background:#fff;transition:.22s}
body.no-tr .trsw .knob{background:#C6CFC9}
body.no-tr .trsw .knob::after{left:3px}
body.no-tr .trsw .lab{color:#A8B4AD}

/* what the switch hides */
.say,.tr,.wtr,.legend,.hint-tr,.nm{transition:opacity .15s}
body.no-tr .say,body.no-tr .tr,body.no-tr .wtr,body.no-tr .legend,
body.no-tr .hint-tr,body.no-tr .nm{display:none}
/* tiles keep their shape once the names come off */
body.no-tr .tile{padding:14px 6px}
body.no-tr .cletter{padding:15px 4px 12px}
body.no-tr .who{font-family:var(--ar);font-size:22px}

.wrap{max-width:860px;margin:0 auto;padding:18px 14px 20px}

/* ---------------- map ---------------- */
.hero{text-align:center;padding:26px 20px 28px;border-radius:var(--r);margin-bottom:20px;
  background:linear-gradient(165deg,#fff,var(--em-l) 62%,var(--gold-l));
  border:1px solid var(--line);box-shadow:var(--sh)}
.hero .ar-t{font-family:var(--ar);font-size:clamp(1.9rem,8vw,2.7rem);font-weight:700;color:var(--em);line-height:1.4}
.hero h2{font-family:var(--disp);font-size:clamp(1.15rem,4.6vw,1.5rem);color:var(--ink);margin-top:2px}
.hero p{font-size:14.5px;color:var(--soft);max-width:44ch;margin:8px auto 0}
.hero .prog{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;
  font-weight:800;color:#6a5015;background:var(--gold-l);border:1px solid rgba(142,111,46,.3);
  border-radius:100px;padding:6px 15px}

.stage-h{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold);margin:20px 4px 9px}
.steps{display:grid;gap:11px}
.step{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;
  font-family:inherit;transition:.18s;min-height:44px}
.step:hover{transform:translateY(-2px);border-color:var(--em);box-shadow:var(--sh)}
.step .n{width:42px;height:42px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
  font-family:var(--disp);font-size:18px;font-weight:800;color:#fff}
.step.c-em .n{background:linear-gradient(140deg,var(--em),#07301f)}
.step.c-coral .n{background:linear-gradient(140deg,var(--coral),#C9412C)}
.step.c-sky .n{background:linear-gradient(140deg,var(--sky),#2B7FB0)}
.step.c-mint .n{background:linear-gradient(140deg,var(--mint),#2E8E6E)}
.step.c-grape .n{background:linear-gradient(140deg,var(--grape),#6D4FAC)}
.step.c-pink .n{background:linear-gradient(140deg,var(--pink),#C9547C)}
.step.c-gold .n{background:linear-gradient(140deg,var(--gold),#8E6F2E)}
.step .tx{flex:1;min-width:0}
.step .tx b{font-family:var(--disp);font-size:16px;font-weight:700;display:block;line-height:1.25}
.step .tx span{font-size:12.5px;color:var(--soft)}
.step .go{flex:0 0 auto;font-size:18px;color:var(--soft)}
.step.done .go{color:var(--mint)}

/* ---------------- screens ---------------- */
.screen{display:none}
.screen.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.s-title{font-family:var(--disp);font-size:clamp(1.3rem,5.2vw,1.7rem);text-align:center;color:var(--em)}
.s-hint{text-align:center;font-size:14px;color:var(--soft);margin:4px auto 16px;max-width:46ch}

.tile{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:11px 6px 8px;
  cursor:pointer;font-family:inherit;transition:.15s;display:flex;flex-direction:column;
  align-items:center;gap:2px;min-height:44px}
.tile:hover{border-color:var(--em);transform:translateY(-2px)}
.tile.selected{border-color:var(--em);background:var(--em-l);box-shadow:0 0 0 3px rgba(11,77,59,.12)}
.tile .ar{font-family:var(--ar);font-size:30px;font-weight:700;color:var(--em);line-height:1.5}
.tile .nm{font-size:11px;font-weight:700;color:var(--soft)}
.all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px}
.group-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px;margin-bottom:16px}

.stage{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);
  padding:18px 16px;margin-bottom:16px}
.who{font-family:var(--disp);font-size:17px;text-align:center;color:var(--em);margin-bottom:12px}
.haraka-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.hcard{border-radius:16px;border:2px solid;background:#fff;padding:13px 8px;cursor:pointer;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
.hcard .ar{font-family:var(--ar);font-size:34px;font-weight:700;line-height:1.5;direction:rtl}
.hcard .say{font-family:var(--disp);font-size:15px;font-weight:700}
.hcard.f{border-color:var(--fatha)} .hcard.f .ar,.hcard.f .say{color:var(--fatha)}
.hcard.k{border-color:var(--kasra)} .hcard.k .ar,.hcard.k .say{color:var(--kasra)}
.hcard.d{border-color:var(--damma)} .hcard.d .ar,.hcard.d .say{color:var(--damma)}
.hcard.s{border-color:var(--soft)} .hcard.s .ar,.hcard.s .say{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:13px;
  font-size:12.5px;color:var(--soft)}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}

.practice{background:linear-gradient(160deg,#fff,var(--gold-l));border:1.5px solid rgba(142,111,46,.25);
  border-radius:var(--r);padding:18px 16px;margin-bottom:16px}
.practice h3{font-family:var(--disp);font-size:17px;color:#8E6F2E;text-align:center}
.practice p{text-align:center;font-size:13px;color:var(--soft);margin-bottom:12px}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.combo{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
.combo .ar{font-family:var(--ar);font-size:29px;font-weight:700;color:var(--em);direction:rtl;line-height:1.6}
.combo .tr{font-family:var(--disp);font-size:13px;font-weight:700;color:var(--gold)}
.shuffle{display:block;margin:14px auto 0;background:linear-gradient(135deg,var(--gold),#8E6F2E);
  color:#fff;border:0;border-radius:100px;padding:11px 26px;font-family:var(--disp);
  font-size:15px;font-weight:700;cursor:pointer;min-height:44px}

.tip,.rest-note,.mark-rule{background:var(--em-l);border-left:4px solid var(--em);border-radius:0 12px 12px 0;
  padding:11px 14px;font-size:13.5px;color:var(--ink);margin-bottom:14px}
.mark-h{font-family:var(--disp);font-size:16px;color:var(--em);margin:16px 0 3px;
  display:flex;align-items:center;gap:8px}
.mark-h .sym{font-family:var(--ar);font-size:24px;direction:rtl}
.mark-note{font-size:13px;color:var(--soft);margin-bottom:9px}
.mark-rule{margin-top:10px;font-size:13px}

.madd-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center}
.mcard .big{font-family:var(--ar);font-size:44px;font-weight:700;color:var(--em);direction:rtl;line-height:1.5}
.mcard .rule{font-size:12px;color:var(--soft);margin-top:4px}
.mcard .long{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--gold);margin-top:2px}

.a4page{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px 16px;margin-bottom:16px}
.pg-head{font-family:var(--disp);font-size:18px;color:var(--em);text-align:center;margin-bottom:14px}
.pg-head small{display:block;font-family:var(--ui);font-size:12px;color:var(--soft);font-weight:600}
.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:11px}
.wcard{border:1.5px solid var(--line);border-radius:15px;padding:13px 8px;text-align:center;
  cursor:pointer;position:relative;overflow:hidden;background:var(--card);min-height:44px}
.wcard .pic{font-size:40px;line-height:1.2;display:inline-block}
.wcard .wr{font-family:var(--ar);font-size:26px;font-weight:700;color:var(--em);direction:rtl;line-height:1.7}
.wcard .wtr{font-family:var(--disp);font-size:12.5px;font-weight:700;color:var(--gold)}
.wcard .wmn{font-size:12px;color:var(--soft)}
.pg-num{text-align:center;font-size:12px;color:var(--soft);margin-top:12px}

.palette{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:16px}
.crayon{width:42px;height:42px;border-radius:50%;border:3px solid #fff;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.15);transition:.15s}
.crayon.picked{transform:scale(1.18);box-shadow:0 0 0 3px var(--em)}
.crayon.eraser{background:#fff;font-size:19px;display:grid;place-items:center}
.colour-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.cletter{background:#fff;border:2px dashed var(--line);border-radius:15px;padding:12px 4px 8px;
  cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;min-height:44px}
.cletter .big{font-family:var(--ar);font-size:38px;font-weight:700;color:transparent;
  -webkit-text-stroke:1.5px var(--soft);line-height:1.4;transition:color .15s}
.cletter .nm{font-size:11px;font-weight:700;color:var(--soft)}

/* ---------------- footer nav ---------------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--paper) 62%,transparent)}
.foot button{min-height:46px;border:1.5px solid var(--line);background:var(--card);color:var(--em);
  font-family:var(--disp);font-weight:700;font-size:15px;border-radius:14px;padding:11px 18px;cursor:pointer}
.foot button:hover:not(:disabled){background:var(--em);color:#fff;border-color:var(--em)}
.foot button:disabled{opacity:.3;cursor:default}
.foot .mid{flex:1;text-align:center;font-size:12.5px;color:var(--soft);font-weight:700}
body.at-map .foot{display:none}

.wob{animation:wob .4s}
@keyframes wob{0%,100%{transform:none}25%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}

@media(max-width:520px){
  .wrap{padding:14px 11px 16px}
  .bar .ttl .sub{display:none}
  .all-grid,.group-row{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
  .tile .ar{font-size:26px}
  .hcard .ar{font-size:30px}
  .colour-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="at-map">

<div class="bar">
  <button class="home" id="homeBtn" aria-label="Back to the map">🏠</button>
  <div class="ttl"><h1 id="barTitle">Alif Bā Tā</h1><div class="sub" id="barSub">Foundation · Level 1</div></div>
  <button class="trsw" id="trBtn" aria-label="Show or hide the sound spellings">
    <span class="lab">Aa</span><span class="knob"></span>
  </button>
</div>

<div class="wrap">

  <!-- ========== MAP ========== -->
  <section class="screen show" id="map">
    <div class="hero">
      <div class="ar-t">أَلِف بَاء تَاء</div>
      <h2>Let's learn to read Arabic!</h2>
      <p>Ten steps. Start at the top and work your way down — tap any step to open it.</p>
      <div class="prog" id="progPill">⭐ 0 of 10 steps opened</div>
    </div>
    <div id="mapBody"></div>
  </section>

  <main id="main"></main>
</div>

<div class="foot" id="foot">
  <button id="prevBtn">‹ Back</button>
  <div class="mid" id="footMid"></div>
  <button id="nextBtn">Next ›</button>
</div>

<script>
"use strict";

/* ================= DATA ================= */
const LETTERS=[
 {ch:'ا',name:'Alif',tr:'a',alif:true},{ch:'ب',name:'Ba',tr:'b'},{ch:'ت',name:'Ta',tr:'t'},
 {ch:'ث',name:'Tha',tr:'th'},{ch:'ج',name:'Jeem',tr:'j'},{ch:'ح',name:'Ḥa',tr:'ḥ'},
 {ch:'خ',name:'Kha',tr:'kh'},{ch:'د',name:'Dal',tr:'d'},{ch:'ذ',name:'Dhal',tr:'dh'},
 {ch:'ر',name:'Ra',tr:'r'},{ch:'ز',name:'Zay',tr:'z'},{ch:'س',name:'Seen',tr:'s'},
 {ch:'ش',name:'Sheen',tr:'sh'},{ch:'ص',name:'Ṣad',tr:'ṣ'},{ch:'ض',name:'Ḍad',tr:'ḍ'},
 {ch:'ط',name:'Ṭa',tr:'ṭ'},{ch:'ظ',name:'Ẓa',tr:'ẓ'},{ch:'ع',name:'Ain',tr:'ʿ'},
 {ch:'غ',name:'Ghain',tr:'gh'},{ch:'ف',name:'Fa',tr:'f'},{ch:'ق',name:'Qaf',tr:'q'},
 {ch:'ك',name:'Kaf',tr:'k'},{ch:'ل',name:'Lam',tr:'l'},{ch:'م',name:'Meem',tr:'m'},
 {ch:'ن',name:'Noon',tr:'n'},{ch:'ه',name:'Ha',tr:'h'},{ch:'و',name:'Waw',tr:'w'},
 {ch:'ي',name:'Ya',tr:'y'}
];
const FATHA='\u064E',KASRA='\u0650',DAMMA='\u064F';
const SUKOON='\u0652',FATHATAN='\u064B',KASRATAN='\u064D',DAMMATAN='\u064C',SHADDA='\u0651';
const HARAKAT=[
 {mark:FATHA,cls:'f',v:'a',label:'Fatha'},
 {mark:KASRA,cls:'k',v:'i',label:'Kasra'},
 {mark:DAMMA,cls:'d',v:'u',label:'Damma'}
];
const GROUPS=[[0,6],[6,12],[12,18],[18,24],[24,28]];
const GCOL=['c-coral','c-sky','c-mint','c-grape','c-pink'];

/* ========== AUDIO — step 1 (All 28 Letters) only ========== */
let arVoice=null;
function pickVoice(){try{arVoice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ar'))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ar-SA'; if(arVoice)u.voice=arVoice; u.rate=.75; u.pitch=1.1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= HELPERS ================= */
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;}
function pop(e){e.classList.remove('wob');void e.offsetWidth;e.classList.add('wob');}
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function trSyll(L,v){return (L.alif?'':L.tr)+v;}

/* ================= STEP REGISTRY ================= */
const main=document.getElementById('main');
const STEPS=[];   /* {id,label,note,colour,sec} */

function addStep(id,label,note,colour){
  const sec=el(`<section class="screen" id="${id}"></section>`);
  main.appendChild(sec);
  STEPS.push({id,label,note,colour,sec});
  return sec;
}

/* ================= STEP 1 — ALL LETTERS ================= */
(function(){
  const s=addStep('letters','All 28 Letters','Meet every letter — tap to hear its name','c-em');
  s.appendChild(el(`<h2 class="s-title">All 28 Letters</h2>`));
  s.appendChild(el(`<p class="s-hint">Tap a letter to hear its name. Say it back out loud!</p>`));
  const g=el(`<div class="all-grid"></div>`);
  LETTERS.forEach(L=>{
    const t=el(`<button class="tile"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    t.addEventListener('click',()=>{pop(t);say(L.ch);});
    g.appendChild(t);
  });
  s.appendChild(g);
})();

/* ================= STEPS 2–6 — LETTER GROUPS ================= */
GROUPS.forEach((range,gi)=>{
  const letters=LETTERS.slice(range[0],range[1]);
  const s=addStep('g'+gi,`Group ${gi+1}`,`Letters ${range[0]+1}–${range[1]} with fatha, kasra, damma`,GCOL[gi]);

  s.appendChild(el(`<h2 class="s-title">Group ${gi+1}</h2>`));
  s.appendChild(el(`<p class="s-hint">Tap a letter, then read each sound underneath out loud.</p>`));

  const row=el(`<div class="group-row"></div>`); s.appendChild(row);
  const stage=el(`<div class="stage">
    <div class="who">Pick a letter</div>
    <div class="haraka-row"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--fatha)"></span>Fatha = a</span>
      <span><span class="dot" style="background:var(--kasra)"></span>Kasra = i</span>
      <span><span class="dot" style="background:var(--damma)"></span>Damma = u</span>
    </div>
  </div>`);
  s.appendChild(stage);
  const who=stage.querySelector('.who'), hr=stage.querySelector('.haraka-row');

  function select(L,tile){
    row.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
    if(tile)tile.classList.add('selected');
    who.textContent = document.body.classList.contains('no-tr') ? L.ch : `${L.name}  ${L.ch}  says…`;
    hr.innerHTML='';
    HARAKAT.forEach(H=>{
      const c=el(`<button class="hcard ${H.cls}">
        <span class="ar">${L.ch+H.mark}</span><span class="say">${trSyll(L,H.v)}</span></button>`);
      c.addEventListener('click',()=>pop(c));
      hr.appendChild(c);
    });
  }
  letters.forEach((L,i)=>{
    const t=el(`<button class="tile"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    t.addEventListener('click',()=>select(L,t));
    row.appendChild(t);
    if(i===0) setTimeout(()=>select(L,t),0);
  });

  const prac=el(`<div class="practice"><h3>Reading Time</h3>
    <p>Read the two letters together, then tap.</p><div class="combo-grid"></div></div>`);
  s.appendChild(prac);
  const cg=prac.querySelector('.combo-grid');
  function build(){
    cg.innerHTML='';
    const pool=letters.filter(L=>!L.alif); const use=pool.length?pool:letters;
    for(let i=0;i<6;i++){
      const L1=rand(use),L2=rand(use),H1=rand(HARAKAT),H2=rand(HARAKAT);
      const ar=L1.ch+H1.mark+L2.ch+H2.mark;
      const c=el(`<button class="combo"><span class="ar">${ar}</span>
        <span class="tr">${trSyll(L1,H1.v)+trSyll(L2,H2.v)}</span></button>`);
      c.addEventListener('click',()=>pop(c));
      cg.appendChild(c);
    }
  }
  build();
  const sh=el(`<button class="shuffle">🎲 New letters</button>`);
  sh.addEventListener('click',build); prac.appendChild(sh);
});

/* ================= STEP 7 — MORE MARKS ================= */
(function(){
  const s=addStep('marks','More Marks','Sukoon, tanween and shaddah','c-gold');
  s.appendChild(el(`<h2 class="s-title">Three More Marks</h2>`));
  s.appendChild(el(`<p class="s-hint">Tap a letter and read it with each mark.</p>`));
  const POOL=LETTERS.filter(L=>!L.alif);

  const row=el(`<div class="group-row"></div>`); s.appendChild(row);
  const stage=el(`<div class="stage"><div class="who">Pick a letter</div><div class="body"></div></div>`);
  s.appendChild(stage);
  s.appendChild(el(`<div class="rest-note">Alif <b>ا</b> rests — it does not take these three marks.</div>`));
  const who=stage.querySelector('.who'), body=stage.querySelector('.body');

  function cards(list){
    const r=el(`<div class="haraka-row"></div>`);
    list.forEach(o=>{
      const c=el(`<button class="hcard ${o.cls}"><span class="ar">${o.ar}</span><span class="say">${o.say}</span></button>`);
      c.addEventListener('click',()=>pop(c));
      r.appendChild(c);
    });
    return r;
  }
  function render(L){
    body.innerHTML='';
    body.appendChild(el(`<div class="mark-h"><span class="sym">◌${SUKOON}</span>Sukoon — stop</div>`));
    body.appendChild(el(`<div class="mark-note">No vowel. The sound stops right there.</div>`));
    body.appendChild(cards([{cls:'s',ar:'أَ'+L.ch+SUKOON,say:'a'+L.tr}]));
    body.appendChild(el(`<div class="mark-rule">A sukoon letter never stands alone — a vowel comes first, then it closes the sound.</div>`));

    body.appendChild(el(`<div class="mark-h"><span class="sym">◌${FATHATAN}</span>Tanween — double marks</div>`));
    body.appendChild(el(`<div class="mark-note">Two fathas, two kasras, two dammas — add an <b>n</b> at the end.</div>`));
    body.appendChild(cards([
      {cls:'f',ar:L.ch+FATHATAN,say:L.tr+'an'},
      {cls:'k',ar:L.ch+KASRATAN,say:L.tr+'in'},
      {cls:'d',ar:L.ch+DAMMATAN,say:L.tr+'un'}]));
    body.appendChild(el(`<div class="mark-rule">In the Qur'an, tanween fath usually carries an alif too: <b>${L.ch+FATHATAN}ا</b></div>`));

    body.appendChild(el(`<div class="mark-h"><span class="sym">◌${SHADDA}</span>Shaddah — press it twice</div>`));
    body.appendChild(el(`<div class="mark-note">Say the letter <b>twice</b>, holding it strong.</div>`));
    body.appendChild(cards([
      {cls:'f',ar:L.ch+SHADDA+FATHA,say:L.tr+'·'+L.tr+'a'},
      {cls:'k',ar:L.ch+SHADDA+KASRA,say:L.tr+'·'+L.tr+'i'},
      {cls:'d',ar:L.ch+SHADDA+DAMMA,say:L.tr+'·'+L.tr+'u'}]));
  }
  function select(L,tile){
    row.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));
    if(tile)tile.classList.add('selected');
    who.textContent = document.body.classList.contains('no-tr') ? L.ch : `${L.name}  ${L.ch}  with the marks…`;
    render(L);
  }
  POOL.forEach((L,i)=>{
    const t=el(`<button class="tile"><span class="ar">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    t.addEventListener('click',()=>select(L,t));
    row.appendChild(t);
    if(i===0) setTimeout(()=>select(L,t),0);
  });

  const prac=el(`<div class="practice"><h3>Mixed Marks</h3>
    <p>Read each one out loud, then tap it.</p><div class="combo-grid"></div></div>`);
  s.appendChild(prac);
  const cg=prac.querySelector('.combo-grid');
  const TANW=[{m:FATHATAN,v:'an'},{m:KASRATAN,v:'in'},{m:DAMMATAN,v:'un'}];
  const HRK=[{m:FATHA,v:'a'},{m:KASRA,v:'i'},{m:DAMMA,v:'u'}];
  function build(){
    cg.innerHTML='';
    for(let i=0;i<9;i++){
      const L=rand(POOL); let ar,tr;
      if(i%3===0){ar='أَ'+L.ch+SUKOON;tr='a'+L.tr;}
      else if(i%3===1){const T=rand(TANW);ar=L.ch+T.m;tr=L.tr+T.v;}
      else {const H=rand(HRK);ar=L.ch+SHADDA+H.m;tr=L.tr+'·'+L.tr+H.v;}
      const c=el(`<button class="combo"><span class="ar">${ar}</span><span class="tr">${tr}</span></button>`);
      c.addEventListener('click',()=>pop(c));
      cg.appendChild(c);
    }
  }
  build();
  const sh=el(`<button class="shuffle">🎲 New marks</button>`);
  sh.addEventListener('click',build); prac.appendChild(sh);
})();

/* ================= STEP 8 — MADD ================= */
(function(){
  const s=addStep('madd','Madd','Long stretched sounds — ا و ي','c-sky');
  s.appendChild(el(`<h2 class="s-title">Madd — Long Sounds</h2>`));
  s.appendChild(el(`<p class="s-hint">Three letters make a sound stretch: ا و ي</p>`));
  s.appendChild(el(`<div class="tip">Stretch the sound like pulling chewing gum — “baaaa”.</div>`));

  const cards=el(`<div class="madd-cards"></div>`);
  [{big:'بَا',rule:'Fatha + ا',long:'baa'},
   {big:'بُو',rule:'Damma + و',long:'buu'},
   {big:'بِي',rule:'Kasra + ي',long:'bii'}].forEach(M=>{
    cards.appendChild(el(`<div class="mcard"><div class="big">${M.big}</div>
      <div class="rule">${M.rule}</div><div class="long tr">${M.long}</div></div>`));
  });
  s.appendChild(cards);

  const prac=el(`<div class="practice"><h3>Long Reading Time</h3>
    <p>Tap and stretch the sound.</p><div class="combo-grid"></div></div>`);
  s.appendChild(prac);
  const cg=prac.querySelector('.combo-grid');
  const SET=[{mark:FATHA,tail:'ا',v:'aa'},{mark:DAMMA,tail:'و',v:'uu'},{mark:KASRA,tail:'ي',v:'ii'}];
  function build(){
    cg.innerHTML='';
    const pool=LETTERS.filter(L=>!L.alif&&L.ch!=='و'&&L.ch!=='ي');
    for(let i=0;i<6;i++){
      const L=rand(pool),M=rand(SET),ar=L.ch+M.mark+M.tail;
      const c=el(`<button class="combo"><span class="ar">${ar}</span><span class="tr">${L.tr+M.v}</span></button>`);
      c.addEventListener('click',()=>pop(c));
      cg.appendChild(c);
    }
  }
  build();
  const sh=el(`<button class="shuffle">🎲 New sounds</button>`);
  sh.addEventListener('click',build); prac.appendChild(sh);
})();

/* ================= STEP 9 — FIRST WORDS ================= */
(function(){
  const s=addStep('book','My First Words','Eighteen real words to read','c-mint');
  s.appendChild(el(`<h2 class="s-title">My First Words</h2>`));
  s.appendChild(el(`<p class="s-hint">Read the word out loud, then tap the card — the picture wiggles.</p>`));

  const WORDS=[
    {ar:'أَبٌ',pic:'👨',tr:'abun',mn:'Father'},{ar:'يَدٌ',pic:'✋',tr:'yadun',mn:'Hand'},
    {ar:'بَابٌ',pic:'🚪',tr:'baabun',mn:'Door'},{ar:'تُوتٌ',pic:'🫐',tr:'tootun',mn:'Berry'},
    {ar:'جَمَلٌ',pic:'🐪',tr:'jamalun',mn:'Camel'},{ar:'حُوتٌ',pic:'🐋',tr:'ḥootun',mn:'Whale'},
    {ar:'دِيكٌ',pic:'🐓',tr:'deekun',mn:'Rooster'},{ar:'ذَهَبٌ',pic:'🪙',tr:'dhahabun',mn:'Gold'},
    {ar:'سَمَكٌ',pic:'🐟',tr:'samakun',mn:'Fish'},{ar:'شَجَرٌ',pic:'🌳',tr:'shajarun',mn:'Tree'},
    {ar:'عِنَبٌ',pic:'🍇',tr:'ʿinabun',mn:'Grapes'},{ar:'فِيلٌ',pic:'🐘',tr:'feelun',mn:'Elephant'},
    {ar:'قَمَرٌ',pic:'🌙',tr:'qamarun',mn:'Moon'},{ar:'كُوبٌ',pic:'🥤',tr:'koobun',mn:'Cup'},
    {ar:'لَبَنٌ',pic:'🥛',tr:'labanun',mn:'Milk'},{ar:'مَطَرٌ',pic:'🌧️',tr:'maṭarun',mn:'Rain'},
    {ar:'نُورٌ',pic:'💡',tr:'noorun',mn:'Light'},{ar:'وَرَقٌ',pic:'📄',tr:'waraqun',mn:'Paper'}
  ];
  const titles=['Easy Words','More Words','You Can Read!'];
  for(let p=0;p*6<WORDS.length;p++){
    const page=el(`<div class="a4page"><div class="pg-head">${titles[p]||'More Words'}
      <small>Read the word, find the picture</small></div>
      <div class="word-grid"></div><div class="pg-num">— ${p+1} —</div></div>`);
    const grid=page.querySelector('.word-grid');
    WORDS.slice(p*6,(p+1)*6).forEach(W=>{
      const c=el(`<div class="wcard" role="button" tabindex="0">
        <div class="pic">${W.pic}</div><div class="wr">${W.ar}</div>
        <div class="wtr">${W.tr}</div><div class="wmn">${W.mn}</div></div>`);
      const play=()=>pop(c.querySelector('.pic'));
      c.addEventListener('click',play);
      c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
      grid.appendChild(c);
    });
    s.appendChild(page);
  }
})();

/* ================= STEP 10 — COLOURING ================= */
(function(){
  const s=addStep('colour','Colour the Letters','Pick a crayon and fill them in','c-grape');
  s.appendChild(el(`<h2 class="s-title">Colour the Letters</h2>`));
  s.appendChild(el(`<p class="s-hint">Pick a crayon, then tap the letters to colour them.</p>`));

  const COLORS=['#E8543F','#FF9F1C','#FFC94D','#6BCB77','#58C7E0','#2E7CD6','#A78BDB','#F06292','#8D6E63'];
  let picked=COLORS[0];
  const pal=el(`<div class="palette"></div>`);
  COLORS.forEach((col,i)=>{
    const b=el(`<button class="crayon${i===0?' picked':''}" style="background:${col}" aria-label="Colour"></button>`);
    b.addEventListener('click',()=>{picked=col;pal.querySelectorAll('.crayon').forEach(x=>x.classList.remove('picked'));b.classList.add('picked');});
    pal.appendChild(b);
  });
  const er=el(`<button class="crayon eraser" aria-label="Eraser">🧽</button>`);
  er.addEventListener('click',()=>{picked=null;pal.querySelectorAll('.crayon').forEach(x=>x.classList.remove('picked'));er.classList.add('picked');});
  pal.appendChild(er); s.appendChild(pal);

  const grid=el(`<div class="colour-grid"></div>`);
  LETTERS.forEach(L=>{
    const c=el(`<button class="cletter"><span class="big">${L.ch}</span><span class="nm">${L.name}</span></button>`);
    const big=c.querySelector('.big');
    c.addEventListener('click',()=>{pop(c);big.style.color=picked||'transparent';});
    grid.appendChild(c);
  });
  s.appendChild(grid);
})();

/* ================= MAP ================= */
const mapBody=document.getElementById('mapBody');
const progPill=document.getElementById('progPill');
let seen={};
try{seen=JSON.parse(localStorage.getItem('alifba_seen')||'{}');}catch(e){seen={};}

const STAGES=[
  {h:'Start here',from:0,to:1},
  {h:'The five groups',from:1,to:6},
  {h:'Extra marks',from:6,to:8},
  {h:'Time to read',from:8,to:10}
];
function paintMap(){
  mapBody.innerHTML='';
  STAGES.forEach(S=>{
    mapBody.appendChild(el(`<div class="stage-h">${S.h}</div>`));
    const box=el(`<div class="steps"></div>`);
    for(let i=S.from;i<S.to && i<STEPS.length;i++){
      const st=STEPS[i];
      const b=el(`<button class="step ${st.colour}${seen[st.id]?' done':''}">
        <span class="n">${i+1}</span>
        <span class="tx"><b>${st.label}</b><span>${st.note}</span></span>
        <span class="go">${seen[st.id]?'✓':'›'}</span></button>`);
      b.addEventListener('click',()=>go(i));
      box.appendChild(b);
    }
    mapBody.appendChild(box);
  });
  const n=Object.keys(seen).length;
  progPill.textContent=`⭐ ${n} of ${STEPS.length} steps opened`;
}

/* ================= NAVIGATION ================= */
const mapSec=document.getElementById('map');
const barTitle=document.getElementById('barTitle'), barSub=document.getElementById('barSub');
const prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'),
      footMid=document.getElementById('footMid');
let cur=-1;   /* -1 = map */

function go(i,fromHash){
  cur=i;
  mapSec.classList.toggle('show',i<0);
  document.body.classList.toggle('at-map',i<0);
  STEPS.forEach((s,k)=>s.sec.classList.toggle('show',k===i));
  if(i<0){
    barTitle.textContent='Alif Bā Tā'; barSub.textContent='Foundation · Level 1';
    paintMap();
    if(!fromHash && location.hash) history.replaceState(null,'','#map');
  }else{
    const st=STEPS[i];
    barTitle.textContent=st.label; barSub.textContent=`Step ${i+1} of ${STEPS.length}`;
    footMid.textContent=`${i+1} / ${STEPS.length}`;
    prevBtn.disabled=false; nextBtn.disabled=(i===STEPS.length-1);
    seen[st.id]=1;
    try{localStorage.setItem('alifba_seen',JSON.stringify(seen));}catch(e){}
    if(!fromHash) history.replaceState(null,'','#'+hashFor(i));
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
/* groups keep the #lesson1–#lesson5 contract used by the class sheet */
function hashFor(i){ return (i>=1&&i<=5) ? 'lesson'+i : STEPS[i].id; }

document.getElementById('homeBtn').addEventListener('click',()=>go(-1));
prevBtn.addEventListener('click',()=>go(cur-1<0?-1:cur-1));
nextBtn.addEventListener('click',()=>{ if(cur<STEPS.length-1) go(cur+1); });
document.addEventListener('keydown',e=>{
  if(cur<0)return;
  if(e.key==='ArrowRight'&&cur<STEPS.length-1)go(cur+1);
  if(e.key==='ArrowLeft')go(cur-1<0?-1:cur-1);
});

function openFromHash(){
  const h=(location.hash||'').replace('#','').toLowerCase();
  if(!h||h==='map'){go(-1,true);return;}
  const m=h.match(/^(?:lesson|group|g)(\d+)$/);
  if(m){ const gi=Math.max(1,Math.min(5,parseInt(m[1],10))); go(gi,true); return; }
  const k=STEPS.findIndex(s=>s.id===h);
  go(k>=0?k:-1,true);
}
window.addEventListener('hashchange',openFromHash);

/* ================= TRANSLITERATION SWITCH ================= */
const trBtn=document.getElementById('trBtn');
function paintTr(){
  const off=document.body.classList.contains('no-tr');
  trBtn.setAttribute('aria-pressed',String(!off));
  trBtn.title = off ? 'Sound spellings are hidden — tap to show' : 'Sound spellings are showing — tap to hide';
}
try{ if(localStorage.getItem('alifba_tr')==='off') document.body.classList.add('no-tr'); }catch(e){}
trBtn.addEventListener('click',()=>{
  document.body.classList.toggle('no-tr');
  try{localStorage.setItem('alifba_tr',document.body.classList.contains('no-tr')?'off':'on');}catch(e){}
  paintTr();
  /* the selected-letter line carries a roman name, so refresh it in place */
  document.querySelectorAll('.screen.show .tile.selected').forEach(t=>t.click());
});
paintTr();

paintMap();
openFromHash();
</script>
