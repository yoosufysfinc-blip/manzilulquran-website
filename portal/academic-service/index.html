<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ManzilulQuran — Academy Manager</title>
<meta name="description" content="Batch classes, individual classes, sub-classes and one set of books for ManzilulQuran E-learning Academy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portal/academic-service/assets/as.v6.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-ws="batch">
<div id="mqGate">
  <div class="box">
    <div class="logo"><img src="/logo.png" alt="" onerror="this.style.display='none'"></div>
    <h2>Academic Service</h2>
    <p>Enter the Academic Service password to open the Academy Manager.</p>
    <input type="password" id="mqGatePw" placeholder="Password" autocomplete="off">
    <div class="err" id="mqGateErr"></div>
    <button id="mqGateBtn">Enter</button>
  </div>
</div>
<script>
(function(){
  var PW="manzil786", KEY="mq_acad_unlocked_at", EIGHT=8*60*60*1000;
  function ok(){try{var at=parseInt(sessionStorage.getItem(KEY)||"0",10);return at&&(Date.now()-at<EIGHT);}catch(e){return false;}}
  function reveal(){var g=document.getElementById("mqGate");if(g)g.classList.add("hidden");}
  function go(){var i=document.getElementById("mqGatePw");
    if(i.value===PW){try{sessionStorage.setItem(KEY,String(Date.now()));}catch(e){}reveal();}
    else{i.classList.add("wrong");document.getElementById("mqGateErr").textContent="Wrong password.";setTimeout(function(){i.classList.remove("wrong");},400);i.select();}}
  document.addEventListener("DOMContentLoaded",function(){
    if(ok()){reveal();return;}
    var b=document.getElementById("mqGateBtn"),i=document.getElementById("mqGatePw");
    if(b)b.onclick=go;
    if(i){i.addEventListener("keydown",function(e){if(e.key==="Enter")go();});setTimeout(function(){i.focus();},100);}
  });
})();
</script>
<div class="app">
  <header class="topnav no-print">
    <div class="tn-row">
      <div class="brand">
        <div class="brand-mark" id="brandMark"></div>
        <div><div class="brand-name" id="brandName">Manzilulquran</div>
          <div class="brand-sub" id="brandSub">Learn Quran</div></div>
      </div>
      <nav class="navpill" id="navList"></nav>
      <div class="tn-right">
        <button class="iconbtn" id="searchBtn" title="Search" aria-label="Search">⌕</button>
        <button class="iconbtn" data-act="alerts" title="Alerts" aria-label="Alerts">◔</button>
        <button class="syncchip off" id="syncChip" data-act="sync-panel" title="Google Sheets sync"><i></i>Sync off</button>
      </div>
    </div>
    <div class="wsbar">
      <button class="ws-btn" data-ws-go="batch"><span class="wi">▤</span>Batch classes</button>
      <button class="ws-btn" data-ws-go="ind"><span class="wi">☺</span>Individual</button>
      <button class="ws-btn" data-ws-go="books"><span class="wi">☰</span>Academy books</button>
      <div class="month-pick" style="margin-left:auto"><label for="globalMonth">Month</label>
        <select id="globalMonth" class="mono"></select></div>
      <button class="btn btn-primary" data-act="pay-new">Record payment</button>
    </div>
  </header>

  <div class="head">
    <div><div class="crumb" id="crumb">Dashboard</div>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="page-sub" id="pageSub"></div></div>
    <div class="head-acts no-print" id="headActs"></div>
  </div>
  <main class="content" id="view" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="/portal/academic-service/assets/core.v5.js"></script>
<script src="/portal/academic-service/assets/logic.v3.js"></script>
<script src="/portal/academic-service/assets/ui.v8.js"></script>
<script src="/portal/academic-service/assets/ws-batch.v2.js"></script>
<script src="/portal/academic-service/assets/ws-individual.v3.js"></script>
<script src="/portal/academic-service/assets/ws-books.v8.js"></script>
<script src="/portal/academic-service/assets/forms-actions.v12.js"></script>
<script>
"use strict";
/* ==========================================================================
   START UP
   ========================================================================== */
async function init(){
  bootData();
  /* show the last saved copy straight away; Supabase refreshes it in the background below */
  const months = allMonths();
  if (months.indexOf(State.month) < 0) State.month = months[months.length - 1];
  $("#globalMonth").innerHTML = monthOpts(State.month, "");
  $("#globalMonth").addEventListener("change", function(){
    State.month = this.value;
    State.tpay.month = ""; State.att.marks = null;
    resetLists(); render();
  });
  $("#searchBtn").addEventListener("click", () => Actions["global-search"]());
  Sync.start();
  setInterval(() => Sync.paint(), 60000);
  switchWS("batch");
  /* Supabase is the primary source of truth: refresh from it without blocking the first screen */
  if (typeof Supa !== "undefined" && Supa.on()) {
    Supa.init();
    const r = await Supa.pullAll();
    if (!r.ok) { toast("Could not load from Supabase: " + (r.error || "unknown") + " — showing the last saved copy", "warn", 6000); return; }
    const m2 = allMonths();
    if (m2.indexOf(State.month) < 0) State.month = m2[m2.length - 1];
    $("#globalMonth").innerHTML = monthOpts(State.month, "");
    resetLists(); render();
  }
}
init();
</script>
</body>
</html>
