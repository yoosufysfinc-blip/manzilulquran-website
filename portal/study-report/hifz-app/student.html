<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#174A39">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hifz Learning · ManzilulQuran</title>
<link rel="icon" href="/assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=DM+Sans:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="stu">

    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow-d" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
    <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>

    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>

    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>

    <symbol id="i-medal" viewBox="0 0 40 40"><g fill="none" stroke="#B99A5D" stroke-width="1.4"><rect x="8.5" y="8.5" width="23" height="23" rx="3"/><rect x="8.5" y="8.5" width="23" height="23" rx="3" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="11.5" fill="#FFFEFA" stroke="#E7DCC4" stroke-width="1"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>

    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  </defs>
</svg>

<!-- The opening: the academy's mark, then the student's name, then the app.
     It is removed from the page once the app is drawn. -->
<div class="splash" id="splash" role="region" aria-label="Opening the Hifz Learning App">
  <div class="sp-in">
    <div class="sp-logo"><span class="sp-halo" aria-hidden="true"></span><img src="/assets/logo-mark.png" alt="" onerror="this.remove()"></div>
    <p class="sp-brand">ManzilulQuran</p>
    <p class="sp-sub">E-Learning Academy</p>
    <p class="sp-rule" aria-hidden="true"><i></i><span>Hifz Learning</span><i></i></p>
    <p class="sp-name" id="spName"></p>
    <div class="sp-bar" aria-hidden="true"><i></i></div>
  </div>
</div>

<a class="skip" href="#main" data-act="skip">Skip to content</a>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <span class="brand">
      <span class="brand-mark stu-mark"><img src="/assets/logo-mark.png" alt="ManzilulQuran" onerror="this.remove()"></span>
      <span class="brand-txt"><span class="brand-name" id="stuName">Student</span><span class="brand-sub">Hifz Learning · ManzilulQuran</span></span>
    </span>
    <div class="top-actions">
      <button class="status-chip" id="statusChip" type="button" data-act="toactive" hidden title="Go to the current ayah">
        <span class="sr">Go to </span><span class="dot" aria-hidden="true"></span><span class="sc-txt" id="statusTxt"></span><span class="sc-extra" id="statusExtra"></span>
      </button>
      <button class="tbtn" type="button" data-act="tips" id="btnTips" aria-label="Memorization tips"><svg class="ic" aria-hidden="true"><use href="#i-bulb"/></svg><span class="lbl">Tips</span></button>
      <button class="tbtn" type="button" data-act="settings" id="btnSettings" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg><span class="lbl">Settings</span></button>
      <button class="tbtn stu-close" type="button" id="btnClose" aria-label="Close and go back" hidden><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg><span class="lbl">Close</span></button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="homeView" class="view" hidden></div>
  <div id="lessonView" class="view" hidden></div>
</main>

<dialog id="dlgSurah" class="dlg-sheet" aria-labelledby="dlgSurahT">
  <div class="panel">
    <div class="panel-head">
      <div><h2 id="dlgSurahT">Choose a surah</h2><p lang="ml">സൂറത്ത് തിരഞ്ഞെടുക്കുക</p></div>
      <button class="x" type="button" data-act="closedlg" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="picker-tools">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="sr">Search surahs</span>
        <input id="surahSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Search name, number, or meaning…" enterkeyhint="search"></label>
      <div class="picker-filters" role="group" aria-label="Filter surahs">
        <button class="chip" type="button" data-act="pfilter" data-f="all" aria-pressed="true">All 114</button>
        <button class="chip" type="button" data-act="pfilter" data-f="amma" aria-pressed="false">Juzʾ ʿAmma (78–114)</button>
        <button class="chip" type="button" data-act="porder" aria-pressed="false"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-repeat"/></svg>Reverse order</button>
        <span class="picker-count" id="pickerCount" aria-live="polite"></span>
      </div>
    </div>
    <div class="panel-body"><ul class="s-list" id="surahList"></ul></div>
  </div>
</dialog>

<!-- Settings -->
<dialog id="dlgSettings" class="dlg-drawer" aria-labelledby="dlgSetT">
  <div class="panel">
    <div class="panel-head">
      <div><h2 id="dlgSetT">Settings</h2><p lang="ml">ക്രമീകരണങ്ങൾ</p></div>
      <button class="x" type="button" data-act="closedlg" aria-label="Close settings"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="settingsBody"></div>
    <div class="panel-foot"><button class="btn btn-primary" type="button" data-act="closedlg">Done</button></div>
  </div>
</dialog>

<!-- Tips -->
<dialog id="dlgTips" class="dlg-sheet" aria-labelledby="dlgTipsT">
  <div class="panel">
    <div class="panel-head">
      <div><h2 id="dlgTipsT">Memorization tips</h2><p lang="ml">മനഃപാഠമാക്കാനുള്ള നിർദ്ദേശങ്ങൾ</p></div>
      <button class="x" type="button" data-act="closedlg" aria-label="Close tips"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" style="padding:4px 18px 22px" id="tipsBody"></div>
  </div>
</dialog>

<!-- Lesson tools (More) -->
<dialog id="dlgTool" class="dlg-sheet dlg-tool" aria-labelledby="dlgToolT">
  <div class="panel">
    <div class="panel-head">
      <div><h2 id="dlgToolT">Lesson tools</h2><p lang="ml">പാഠത്തിന്റെ ഉപകരണങ്ങൾ</p></div>
      <button class="x" type="button" data-act="closedlg" aria-label="Close lesson tools"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="toolBody"></div>
  </div>
</dialog>

<!-- Confirm -->
<dialog id="dlgConfirm" class="dlg-small" aria-labelledby="dlgConfT">
  <div class="panel">
    <div class="panel-head"><h2 id="dlgConfT">Are you sure?</h2></div>
    <div class="confirm-body" id="confBody"></div>
    <div class="panel-foot"><button class="btn btn-ghost" type="button" id="confNo">Cancel</button><button class="btn btn-primary" type="button" id="confYes">Continue</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="/portal/study-report/hifz-app/assets/quran-data.v1.js"></script>
<script src="/portal/study-report/hifz-app/assets/mushaf.v1.js"></script>
<script src="/portal/study-report/hifz-app/assets/store.v2.js"></script>
<script src="/portal/study-report/hifz-app/assets/learn.v4.js"></script>
<script src="/portal/study-report/hifz-app/assets/student.v1.js"></script>
</body>
</html>
