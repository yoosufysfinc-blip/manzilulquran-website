<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tartheelul Qur'an — ManzilulQuran Academy</title>

<!-- link preview (WhatsApp, Facebook, X) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="ManzilulQuran E-learning Academy" />
<meta property="og:title" content="Tartheelul Qur'an — ManzilulQuran Academy" />
<meta property="og:description" content="Qur'an recitation with Tajwīd — Base and Advanced levels, taught live one-to-one. Watch the course video." />
<meta property="og:url" content="https://manzilulquran.in/fees/tartheel.html" />
<meta property="og:image" content="https://manzilulquran.in/fees/og-tartheel.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="1200" />
<meta property="og:image:alt" content="Tartheelul Qur'an — ManzilulQuran Academy" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Tartheelul Qur'an — ManzilulQuran Academy" />
<meta name="twitter:description" content="Qur'an recitation with Tajwīd — Base and Advanced levels, taught live one-to-one. Watch the course video." />
<meta name="twitter:image" content="https://manzilulquran.in/fees/og-tartheel.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* .play and .endcard set display:flex, which outranks the browser's own
     [hidden]{display:none}. Without this they never hide. */
  [hidden]{display:none !important}

  :root{
    --gold:#C9A96E;
    --em:#2fae7f;
    --ink:#eef7f0;
    --muted:rgba(238,247,240,.6);
    --line:rgba(201,169,110,.26);
    /* video is 1080x1920 -> 9:16 */
    --ratio:0.5625;
  }

  html,body{height:100%;overflow:hidden}

  body{
    font-family:'Poppins','Noto Sans Malayalam',sans-serif;
    color:var(--ink);
    background:linear-gradient(to bottom,
      #03120c 0%, #051b13 26%, #072519 48%, #0a3425 70%, #072017 88%, #030f0a 100%);
  }

  .horizon{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:130vw;height:40vh;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse at center bottom,
      rgba(47,174,127,.18), rgba(201,169,110,.07) 46%, transparent 74%);
    filter:blur(8px);
  }

  .stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 3.6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.16}50%{opacity:.8}}

  /* ---------- layout: the player takes the screen ---------- */
  .shell{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));
  }

  /* ---------- compact language switch ---------- */
  .toggle{
    display:inline-flex;align-items:center;
    background:rgba(8,32,23,.6);border:1px solid var(--line);
    border-radius:999px;padding:3px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    cursor:pointer;position:relative;flex:0 0 auto;
    height:38px;
  }
  .toggle .opt{
    position:relative;z-index:2;
    min-width:60px;height:32px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:500;letter-spacing:.04em;
    color:var(--muted);border-radius:999px;
    transition:color .3s ease;white-space:nowrap;
  }
  .toggle .opt.ml{font-family:'Noto Sans Malayalam','Poppins',sans-serif;letter-spacing:0;font-size:12px}
  .toggle .knob{
    position:absolute;z-index:1;top:3px;left:3px;
    width:calc(50% - 3px);height:calc(100% - 6px);border-radius:999px;
    background:linear-gradient(135deg,rgba(47,174,127,.92),rgba(201,169,110,.88));
    transition:transform .5s cubic-bezier(.22,.61,.36,1);
  }
  .toggle[data-lang="en"] .knob{transform:translateX(100%)}
  .toggle[data-lang="ml"] .opt.ml,
  .toggle[data-lang="en"] .opt.en{color:#06140e;font-weight:600}

  /* a short glow so the switch is noticed, then it settles */
  @keyframes hintGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}
    50%{box-shadow:0 0 0 5px rgba(201,169,110,.16), 0 0 20px rgba(201,169,110,.55)}
  }
  .toggle.hint{animation:hintGlow 1.65s ease-in-out 3}

  /* ---------- 3D flip stage ---------- */
  .stage{
    perspective:1600px;
    width:min(97vw, calc(92svh * var(--ratio)));
    max-width:100%;
    aspect-ratio:9/16;
    transition:transform .42s ease;
    will-change:transform;
  }
  @keyframes dolly{
    0%{transform:scale(1)}
    46%{transform:scale(.78)}
    100%{transform:scale(1)}
  }
  .stage.turning{animation:dolly .92s cubic-bezier(.4,0,.2,1)}


  .flip{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.33,.0,.2,1);
    will-change:transform;
  }

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;overflow:hidden;background:#030f0a;
    border:1px solid var(--line);
    box-shadow:
      0 16px 46px rgba(0,0,0,.55),
      0 0 26px rgba(201,169,110,.16);
    transition:box-shadow .5s ease;
  }
  .stage.turning .face{
    box-shadow:
      0 22px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(201,169,110,.45),
      0 0 48px rgba(201,169,110,.5),
      0 0 95px rgba(47,174,127,.3);
  }
  .face.back{transform:rotateY(180deg)}
  .face > *{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face video{width:100%;height:100%;object-fit:cover;display:block;background:#030f0a}

  /* big play disc */
  .play{
    position:absolute;inset:0;z-index:3;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at center,rgba(3,15,10,.16),rgba(3,15,10,.5));
    border:0;cursor:pointer;
  }
  .play i{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(201,169,110,.96),rgba(47,174,127,.9));
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .play i::after{
    content:"";width:0;height:0;margin-left:5px;
    border-left:18px solid #06140e;
    border-top:11px solid transparent;border-bottom:11px solid transparent;
  }

  /* fullscreen */
  .fs{
    position:absolute;z-index:4;top:10px;right:10px;
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(3,15,10,.5);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    cursor:pointer;
  }
  .fs svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  /* end card — the demo button appears only once the video has finished */
  .endcard{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:20px;text-align:center;
    background:linear-gradient(to bottom,rgba(3,15,10,.86),rgba(3,15,10,.96));
    animation:fadeIn .45s ease both;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .endcard p{font-size:13px;color:var(--muted);line-height:1.5;max-width:22ch}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    min-height:48px;padding:0 24px;border-radius:999px;
    background:linear-gradient(135deg,#1f9f6f,#2fae7f);
    color:#05140e;font-weight:600;font-size:14px;text-decoration:none;
    box-shadow:0 10px 26px rgba(47,174,127,.3);
  }
  .btn:active{transform:translateY(1px)}
  .btn svg{width:18px;height:18px;fill:currentColor}

  .replay{
    display:inline-flex;align-items:center;gap:7px;
    min-height:44px;padding:0 16px;border-radius:999px;
    background:transparent;border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer;
  }
  .replay svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  @media (max-width:480px){
    .toggle .opt{min-width:54px}
  }

  @media (prefers-reduced-motion: reduce){
    .star{animation:none;opacity:.4}
    .flip,.stage,.toggle .knob{transition:none}
    .toggle.hint,.endcard{animation:none}
  }
</style>
</head>
<body>

<div class="horizon" aria-hidden="true"></div>
<div class="stars" id="stars" aria-hidden="true"></div>

<div class="shell">

  <button class="toggle hint" id="langToggle" data-lang="ml" aria-label="Switch video language">
    <span class="knob" aria-hidden="true"></span>
    <span class="opt ml">മലയാളം</span>
    <span class="opt en">English</span>
  </button>

  <div class="stage" id="stage">
    <div class="flip" id="flip">

      <div class="face front">
        <video id="vML" playsinline preload="metadata" controls controlsList="nodownload"
               poster="https://media.manzilulquran.in/tartheel-ml-poster.jpg">
          <source src="https://media.manzilulquran.in/tartheel-ml-v1.mp4" type="video/mp4" />
        </video>
        <button class="fs" data-for="vML" aria-label="Full screen">
          <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
        <button class="play" data-for="vML" aria-label="Play video"><i></i></button>
        <div class="endcard" data-for="vML" hidden>
          <p>Book a free demo class and see how it works.</p>
          <a class="btn demo" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.04c-.24.68-1.42 1.31-1.96 1.36-.5.05-1.13.07-1.83-.11-.42-.13-.96-.31-1.66-.61-2.92-1.26-4.83-4.2-4.97-4.4-.15-.2-1.19-1.58-1.19-3.01s.75-2.14 1.02-2.43c.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.59.82 2.03.89 2.18.07.15.12.32.02.51-.1.2-.15.32-.29.5-.15.17-.31.39-.44.52-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.12.63-.07.17-.2.73-.85.92-1.14.19-.29.39-.24.66-.15.27.1 1.71.81 2 .96.29.15.49.22.56.34.07.13.07.72-.17 1.4z"/></svg>
            Book a Free Demo
          </a>
          <button class="replay" data-for="vML">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
            Watch again
          </button>
        </div>
      </div>

      <div class="face back">
        <video id="vEN" playsinline preload="none" controls controlsList="nodownload"
               poster="https://media.manzilulquran.in/tartheel-en-poster.jpg">
          <source src="https://media.manzilulquran.in/tartheel-en-v1.mp4" type="video/mp4" />
        </video>
        <button class="fs" data-for="vEN" aria-label="Full screen">
          <svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
        <button class="play" data-for="vEN" aria-label="Play video"><i></i></button>
        <div class="endcard" data-for="vEN" hidden>
          <p>Book a free demo class and see how it works.</p>
          <a class="btn demo" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.04c-.24.68-1.42 1.31-1.96 1.36-.5.05-1.13.07-1.83-.11-.42-.13-.96-.31-1.66-.61-2.92-1.26-4.83-4.2-4.97-4.4-.15-.2-1.19-1.58-1.19-3.01s.75-2.14 1.02-2.43c.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.59.82 2.03.89 2.18.07.15.12.32.02.51-.1.2-.15.32-.29.5-.15.17-.31.39-.44.52-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.12.63-.07.17-.2.73-.85.92-1.14.19-.29.39-.24.66-.15.27.1 1.71.81 2 .96.29.15.49.22.56.34.07.13.07.72-.17 1.4z"/></svg>
            Book a Free Demo
          </a>
          <button class="replay" data-for="vEN">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
            Watch again
          </button>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
(function(){
  'use strict';

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- stars ---------- */
  (function(){
    var c = document.getElementById('stars');
    if(!c) return;
    var frag = document.createDocumentFragment();
    for(var k=0;k<60;k++){
      var s = document.createElement('div');
      s.className = 'star';
      var sz = (Math.random()*1.1 + 0.6).toFixed(2);
      s.style.width = s.style.height = sz + 'px';
      s.style.left = (Math.random()*100) + '%';
      s.style.top  = (Math.random()*86) + '%';
      s.style.opacity = (0.16 + Math.random()*0.45).toFixed(2);
      if(!reduce){
        s.style.animationDuration = (2.6 + Math.random()*3.2) + 's';
        s.style.animationDelay = (-Math.random()*4) + 's';
      }
      frag.appendChild(s);
    }
    c.appendChild(frag);
  })();

  /* ---------- WhatsApp demo link (on both end cards) ---------- */
  var phone = '917025070415';
  var msg = "Assalamu Alaikum! I'm interested in the Tartheelul Qur'an course (Recitation with Tajw\u012Bd) at ManzilulQuran E-learning Academy and would like to book a FREE demo class.\n\nLevel: Base / Advanced (please advise)\n\nPlease share the available time slots. Jazak Allah Khair.";
  var wa = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
  Array.prototype.forEach.call(document.querySelectorAll('.btn.demo'), function(a){ a.href = wa; });

  /* ---------- flip player ---------- */
  var stage  = document.getElementById('stage');
  var flip   = document.getElementById('flip');
  var toggle = document.getElementById('langToggle');
  var vML    = document.getElementById('vML');
  var vEN    = document.getElementById('vEN');

  var turns  = 0;
  var busy   = false;
  var active = vML;

  function pick(sel, id){ return document.querySelector(sel + '[data-for="' + id + '"]'); }

  // ?lang=en opens on the English side with no animation
  try{
    if((new URLSearchParams(location.search).get('lang')||'').toLowerCase() === 'en'){
      turns = 1; active = vEN;
      toggle.setAttribute('data-lang','en');
      var prev = flip.style.transition;
      flip.style.transition = 'none';
      flip.style.transform  = 'rotateY(180deg)';
      void flip.offsetWidth;
      flip.style.transition = prev;
      vEN.preload = 'metadata'; vML.preload = 'none';
    }
  }catch(e){}

  // the glow is a one-time hint; drop it as soon as the switch is used
  setTimeout(function(){ toggle.classList.remove('hint'); }, 5200);

  // the second video downloads only once the first is actually being watched
  var backLoaded = false;
  function loadBack(){
    if(backLoaded) return;
    backLoaded = true;
    var back = (active === vML) ? vEN : vML;
    try{ back.preload = 'auto'; back.load(); }catch(e){}
  }
  vML.addEventListener('playing', loadBack, {once:true});
  vEN.addEventListener('playing', loadBack, {once:true});

  /* per-video controls */
  [vML, vEN].forEach(function(v){
    var id   = v.id;
    var play = pick('.play', id);
    var end  = pick('.endcard', id);
    var fs   = pick('.fs', id);
    var rep  = pick('.replay', id);

    play.addEventListener('click', function(){ v.play().catch(function(){}); });

    rep.addEventListener('click', function(){
      end.hidden = true;
      try{ v.currentTime = 0; }catch(e){}
      v.play().catch(function(){});
    });

    // real full screen — iOS Safari only allows it on the video element itself,
    // and every browser requires this to come straight from a tap
    fs.addEventListener('click', function(){
      if(v.requestFullscreen)            v.requestFullscreen().catch(function(){});
      else if(v.webkitEnterFullscreen)   v.webkitEnterFullscreen();
      else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen();
    });

    v.addEventListener('play',  function(){ play.hidden = true; end.hidden = true; });
    v.addEventListener('ended', function(){ end.hidden = false; play.hidden = true; });
  });

  /* the 180deg turn */
  function switchLang(){
    if(busy) return;
    busy = true;
    toggle.classList.remove('hint');

    var from = active;
    var to   = (active === vML) ? vEN : vML;
    var wasPlaying = !from.paused && !from.ended;

    loadBack();

    turns += 1;
    toggle.setAttribute('data-lang', to === vML ? 'ml' : 'en');

    if(reduce){
      flip.style.transform = 'rotateY(' + (turns*180) + 'deg)';
      handover(from, to, wasPlaying);
      active = to; busy = false;
      return;
    }

    stage.classList.add('turning');
    flip.style.transform = 'rotateY(' + (turns*180) + 'deg)';

    // halfway through, while the card is edge-on: hand the playhead over
    setTimeout(function(){
      handover(from, to, wasPlaying);
      active = to;
    }, 450);

    setTimeout(function(){ stage.classList.remove('turning'); }, 930);
    setTimeout(function(){ busy = false; }, 950);
  }

  // keep the viewer's place when the language changes
  function handover(from, to, wasPlaying){
    var at = from.currentTime || 0;
    from.pause();
    pick('.endcard', from.id).hidden = true;
    function seekAndGo(){
      try{ if(isFinite(at) && at > 0) to.currentTime = at; }catch(e){}
      if(wasPlaying){
        pick('.play', to.id).hidden = true;
        to.play().catch(function(){});
      }
    }
    if(to.readyState >= 1){ seekAndGo(); }
    else { to.addEventListener('loadedmetadata', seekAndGo, {once:true}); }
  }

  toggle.addEventListener('click', switchLang);

})();
</script>
</body>
</html>
